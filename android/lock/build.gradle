plugins {
    id 'com.android.application'
}

// ../../lock-version.json is the single place this app's version is set, exactly as
// app-version.json is for the HOOPLOAN app -- api/lock-version.js serves the same file back to the
// installed app so it can update itself. Two separate files because the two apps ship on
// their own clocks: an officer's calls build has nothing to do with a locked handset's.
def lockVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../lock-version.json'))

def serverUrl = project.hasProperty('serverUrl') ? project.property('serverUrl') : 'https://hoop-pmo.vercel.app'

android {
    namespace 'com.samaritantechs.hooploanlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.samaritantechs.hooploanlock'
        // API 23. Device Owner provisioning by QR needs 23+, and everything this app relies
        // on (lock task without exit, user restrictions, silent install) is 23-and-up too.
        minSdk 23
        targetSdk 35
        versionCode lockVersion.versionCode
        versionName lockVersion.versionName
        // A fallback only. The real server URL arrives in the provisioning bundle, so one
        // APK can serve any deployment; this is what a hand-installed test build falls back on.
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${serverUrl}\""
    }

    // The SAME sideload key as the calls app. Device Owner provisioning pins the admin to a
    // signing certificate checksum, so re-signing with a different key would strand every
    // phone already provisioned -- they would refuse the update and could not be re-enrolled
    // without a factory reset. Losing this key is the one unrecoverable mistake here.
    signingConfigs {
        sideload {
            storeFile rootProject.file('sideload.keystore')
            storePassword 'hopecalls'
            keyAlias 'hopecalls'
            keyPassword 'hopecalls'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* PUSH IS OPTIONAL, AND THE CONDITION IS LOAD-BEARING.
   =============================================================================================
   Everything else in this APK is platform API -- JobScheduler, DevicePolicyManager,
   HttpURLConnection -- with nothing to resolve, which is what has kept it buildable anywhere.
   Firebase is the first real dependency and it brings a tree with it.

   So it switches on with the file. With lock/google-services.json present the SDK is compiled
   in and Push.java with it; without it this builds exactly as it always did -- no dependency,
   no plugin, nothing that can fail to resolve. A clone that strips the file, or a fork that
   never had one, still produces a working lock app that simply beats on its timer.

   That is not defensive decoration. This APK is how two hundred handsets get locked, and "the
   build broke because a dependency would not resolve" is a day nobody at HOOP can spend. The
   lock must never depend on Google being reachable -- at build time or at run time. */
def hasPush = file('google-services.json').exists()

dependencies {
    /* The messaging SDK alone. Not the BOM, not analytics, not crashlytics: this app sends
       Google nothing and reports Google nothing. It receives one wake-up that carries no
       command -- see push.js and Push.java. */
    if (hasPush) implementation 'com.google.firebase:firebase-messaging:24.1.0'
}

/* Applied after the android block because it reads it. Push.java sits in its own source set
   so a build WITHOUT the json never tries to compile a class whose superclass is not on the
   classpath -- which is what would make "optional" a fiction. */
if (hasPush) {
    apply plugin: 'com.google.gms.google-services'
    android.sourceSets.main.java.srcDirs += 'src/push/java'
}
