        +'jina lako litaonekana pande zote mbili kwenye ripoti. / Your own request — you will '
        +'appear as both requester and approver on the report.</div>'
      : '')
    +'<label class="lbl">Kiasi cha kuidhinisha / Amount to approve</label>'
    +'<select id="avdAmt" class="inp">'+advAmountOptions(amounts,r.amount,r.amount)+'</select>'
    +'<label class="lbl">Maoni / Comment</label>'
    +'<textarea id="avdCmt" class="inp" rows="3" placeholder="Lazima ukikataa. / Required when declining."></textarea>'
    +'<button class="btn w" id="avdOk" style="margin-top:10px">Idhinisha / Approve</button>'
    +'<button class="btn w danger ghost" id="avdNo" style="margin-top:6px">Kataa / Decline</button>');
  var send=function(approve){
    var b=$('#avdOk'), n=$('#avdNo'); if(b) b.disabled=true; if(n) n.disabled=true;
    srv('advDecide',{ id:r.id, approve:approve,
      approvedAmount:approve?Number($('#avdAmt').value):null,
      comment:$('#avdCmt').value }).then(function(){
      toast(approve?'Imeidhinishwa / Approved':'Imekataliwa / Declined');
      closeDrawer(); drawAdvAppr(m);
    }).catch(function(e){
      if(b) b.disabled=false; if(n) n.disabled=false; toast(safeErr(e), true);
    });
  };
  $('#avdOk').onclick=function(){ send(true); };
  $('#avdNo').onclick=function(){ send(false); };
}

/* THE REPORT'S OWN WORD FOR THE STATE.
     "advance salaries report have status column of requested, approved or rejected too"

   Three words, and they are deliberately not quite the queue's three. A request nobody has
   decided yet is REQUESTED here, not "waiting": on a filing sheet the question is what the
   staff member did, and what they did was ask. English single words, like the headers around
   them -- this is the one pane in the system that is a payroll document rather than a screen,
   and a word that changes with the language toggle is a word that cannot be filed. */
function advReportStatus(r){
  if(r.status==='approved') return '<span class="chip ok">Approved</span>';
  if(r.status==='declined') return '<span class="chip bad">Rejected</span>';
  return '<span class="chip warn">Requested</span>';
}

/* THE MONTH, AS THE DEFAULT RATHER THAN AS A THING TO TYPE.
     "default start and end dates calenders defaulted to start and end of current month
      unless altered"

   HR opens this pane to do one job -- this month's advances -- so that is what it opens
   showing. Two empty date boxes would be an unbounded query dressed up as a blank form: it
   loads every advance ever granted, and the total tile above it is then a figure for all time
   sitting where a monthly figure belongs. Wrong on a sheet somebody pays from.

   Built from the local calendar, not from UTC -- day 0 of next month is the last day of this
   one, which is the only leap-year-proof way to write it. */
function monthRange_(){
  var d=new Date(), p=function(n){ return (n<10?'0':'')+n; };
  var y=d.getFullYear(), mo=d.getMonth();
  return { from: y+'-'+p(mo+1)+'-01',
           to:   y+'-'+p(mo+1)+'-'+p(new Date(y, mo+1, 0).getDate()) };
}

/* HR'S PANE: the filing copy and the bank run. The columns are the owner's list, in the
   owner's order, because this is the sheet that gets printed and taken to a bank. */
function drawAdvRep(m){
  m.innerHTML='<div class="sk"></div>';
  srv('advReport',ADVR).then(function(d){
    if(d.notReady){ m.innerHTML=advNotReady(); return; }
    var rows=d.rows||[], t=d.totals||{};
    m.innerHTML='<div class="tiles">'
      /* Both tiles are doors onto the status filter, because that is the question each of
         them raises: "how many" is answered by the whole period, "how much to pay" only by
         the approved ones. Clicking a lit tile puts the filter back. */
      +tile('Maombi',money(t.count||0),'kwenye kipindi hiki',
        { on:ADVR.status==='', cta:ADVR.status===''?'zote':'onyesha zote ›',
          go:function(){ ADVR.status=''; drawAdvRep(m); } })
      /* The only figure safe to hand a cashier: approved rows only. A total that quietly
         included pending or declined requests would be a bank instruction for money nobody
         agreed to pay. */
      +tile('Za kulipa',money(t.approved||0),'TZS — zilizoidhinishwa pekee',
        { color:'ok', on:ADVR.status==='approved',
          cta:ADVR.status==='approved'?'imechujwa':'chuja ›',
          go:function(){ ADVR.status=(ADVR.status==='approved'?'':'approved'); drawAdvRep(m); } })
      +'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0">'
      +'<span class="mut" style="font-size:12px">Tarehe ya maombi:</span>'
      +'<input id="avrFrom" class="inp" type="date" style="width:auto" value="'+esc(ADVR.from||'')+'">'
      +'<input id="avrTo" class="inp" type="date" style="width:auto" value="'+esc(ADVR.to||'')+'">'
      +'<select id="avrSt" class="inp" style="width:auto">'
      +['','pending','approved','declined'].map(function(k){
        return '<option value="'+k+'"'+(ADVR.status===k?' selected':'')+'>'
          +(k===''?'Zote / All':k==='pending'?'Zinasubiri / Pending'
            :k==='approved'?'Zilizokubaliwa / Approved':'Zilizokataliwa / Declined')+'</option>';
      }).join('')+'</select>'
      +'<button class="btn sm" id="avrGo">Chuja / Filter</button>'
      +'<button class="btn sm ghost" id="avrClr">Mwezi huu / This month</button>'
      +'<button class="btn sm ghost" id="avrAll">Tarehe zote / All dates</button>'
      +'</div>'
      +(rows.length?'<div class="scroll"><table><thead><tr>'
        +'<th>TIMESTAMP</th><th>STAFF ROLE</th><th>STAFF NAME</th><th>APPLICATION DATE</th>'
        /* TWO FIGURES, NAMED AS TWO FIGURES. "2 columns of requested amt and approved amt" --
           the pair is the whole point of the sheet: the approver may grant less than was
           asked, and a reader who cannot see both cannot tell that they did. APPROVED AMOUNT
           is the column the bank pays from. */
        +'<th class="r">REQUESTED AMOUNT</th><th>STATUS</th><th class="r">APPROVED AMOUNT</th><th>COMMENT</th>'
        +'<th>BANK/CARRIER NAME</th><th>ACCOUNTS NO.</th></tr></thead><tbody>'
        +rows.map(function(r){
          return '<tr><td style="font-size:11px">'+esc(advWhen(r.at))+'</td>'
            +'<td>'+esc(r.staffRole||'—')+'</td><td>'+esc(r.staffName||'—')+'</td>'
            +'<td>'+esc(r.applyDate||'—')+'</td>'
            +'<td class="r">'+money(r.amount||0)+'</td>'
            +'<td>'+advReportStatus(r)+'</td>'
            /* APPROVAL is the figure and nothing else, now that STATUS carries the word. A
               row that is not approved shows a dash rather than a zero: a zero in a payment
               column reads as "pay nothing", which is a different instruction from "there is
               nothing to pay here yet". */
            +'<td class="r">'+(r.status==='approved'?money(r.approved||0):'—')+'</td>'
            +'<td style="font-size:11px">'+esc(r.comment||'')
              +(r.decidedBy?'<div class="mut" style="font-size:10px">'+esc(r.decidedBy)+'</div>':'')+'</td>'
            +'<td>'+esc(r.bank||'—')+'</td><td>'+esc(r.account||'—')+'</td></tr>';
        }).join('')+'</tbody></table></div>'
        :'<div class="mut">Hakuna maombi kwenye kipindi hiki. / No requests in this period.</div>');
    wireTiles(m);
    $('#avrGo').onclick=function(){
      ADVR={ from:$('#avrFrom').value, to:$('#avrTo').value, status:$('#avrSt').value };
      drawAdvRep(m);
    };
    /* Two ways back, because they are two different questions. "This month" returns to the
       default the pane opens on; "All dates" is the deliberate unbounded look, chosen rather
       than arrived at by leaving two boxes empty. */
    $('#avrClr').onclick=function(){
      var r=monthRange_(); ADVR={from:r.from,to:r.to,status:''}; drawAdvRep(m);
    };
    $('#avrAll').onclick=function(){ ADVR={from:'',to:'',status:''}; drawAdvRep(m); };
  }).catch(function(e){ m.innerHTML=paneFailed(safeErr(e)); });
}
var ADVR=(function(){ var r=monthRange_(); return { from:r.from, to:r.to, status:'' }; })();

/* ---------- stock accountability ----------
   "the stock is too large and hoop agents are stealing stock"

   Four pivots over the same answer -- company, the store (Sipho), RSMs, agents -- because
   the same question is asked at four different altitudes. Every row is one holder and what
   they are answerable for: held now, held too long, and what LEFT their hands. A departure
   is judged three ways -- sold (in our sales book), kwa Watu (financed but no sale record),
   or UNACCOUNTED, which is the line that matters and is deliberately not called theft. */
var STOCKACCT={pivot:'company',open:null,moved:null,sort:''};
/* The default order already puts the worst first -- most unaccounted, then most stale. A
   tile only overrides it, and only on the one column the tile is about; the tie-breakers
   below it stay, so two holders level on the sorted column still read worst-first. */
function saSorted(rows){
  if(!STOCKACCT.sort) return rows;
  var k=STOCKACCT.sort;
  return rows.slice().sort(function(a,b){
    return (Number(b[k])||0)-(Number(a[k])||0)
      || (b.unaccounted-a.unaccounted) || (b.stale-a.stale) || (b.held-a.held);
  });
}
function drawStockAccount(m){
  m.innerHTML='<div class="card"><h2>Stock accountability</h2><div class="sk"></div></div>';

        +'<div class="mut">Hakuna ripoti ya stock bado — pakia ripoti ya SyscoPos ya Sipho kwenye /upload. '

      }).join('')+'</div>';
    /* EVERY TILE IS A COLUMN OF THE TABLE BELOW, so clicking one answers "who" by bringing
       the worst to the top -- never by hiding anybody, which on an accountability screen
       would be the wrong instinct entirely. Clicking the live one puts the default order
       back. */
    var by=function(col,cta){ return { on:STOCKACCT.sort===col, cta:cta||'nani ›',
      go:function(){ STOCKACCT.sort=(STOCKACCT.sort===col?'':col); STOCKACCT.open=null;

    var head='<div class="tiles">'

        money(t.holders||0)+' holders · ripoti '+esc(d.asOf),by('held'))

        Object.assign({color:((t.stale||0)?'bad':'')},by('stale')))
      +tile('Zilizotoka / left stock',money(t.gone||0),'tangu ripoti ya '+esc(d.prevAsOf||'—'),by('gone'))

        by('moved','nani kapewa ›'))
      +tile('Zimeuzwa / sold',money(t.sold||0),'zipo kwenye kitabu cha mauzo',
        Object.assign({color:'ok'},by('sold')))
      +tile('HAZIJULIKANI / unaccounted',money(t.unaccounted||0),'hazipo mauzoni wala Watu',

      +'</div>';
    var note='<div class="mut" style="margin:8px 0">Simu iliyohamishiwa mwenzake haipotei: ikiwa bado ipo kwenye ripoti ya leo kwa jina lingine, '
      +'inasomeka <b>imehamishwa</b>, si haijulikani. Na kila IMEI isiyojulikana tunaitafuta kwenye ripoti ZOTE — '
      +'kama mtu mwingine aliwahi kuwa nayo, jina lake linaonekana kwenye orodha ya IMEI (ni <b>dalili</b>, si uthibitisho — '
      +'simu bado haijulikani). / A transfer still on the report reads as transferred; every unaccounted IMEI is searched '
      +'across all reports and names anyone else who held it, as a lead, not a clearance.<br>'
      +'Simu iliyotoka kwenye stock ina njia tatu za kweli: '
      +'<b>imeuzwa</b> (ipo kwenye kitabu cha mauzo), <b>kwa Watu</b> (imefadhiliwa lakini haipo mauzoni — hilo ni kosa la karatasi, si wizi), '
      +'au <b>haijulikani</b> — haipo popote. Safu ya mwisho ndiyo ya kuulizia, na inaonyesha aliyekuwa nayo mwisho. '
      +'/ Unaccounted = left stock and appears in neither the sales book nor the Watu register.'
      +(d.notChecked?' <b style="color:var(--bad)">'+money(d.notChecked)+' departures were not judged this run (cap reached) — they are NOT counted above.</b>':'')
      +'</div>';
    var rows=saSorted(sec.rows||[]);

    var table=rows.length
      ? '<div class="scroll"><table><thead><tr><th>Holder</th><th>Role</th>'

        +hd('sold','Sold')+'<th class="r">Kwa Watu</th>'+hd('unaccounted','Unaccounted')
        +'<th></th></tr></thead><tbody>'
        +rows.map(function(r,i){
          return '<tr><td><b>'+esc(r.holder)+'</b>'+(r.branch?'<div class="mut" style="font-size:10px">'+esc(r.branch)+'</div>':'')+'</td>'

            +'<td class="r"'+(r.stale?' style="color:var(--bad)"':'')+'>'+money(r.stale)+'</td>'

            +'<td class="r">'+((r.moved||0)?'<button class="btn sm ghost" data-sam="'+i+'">'+money(r.moved)+'</button>':'0')+'</td>'

            +'<td class="r">'+money(r.watu)+'</td>'

            +(STOCKACCT.moved===i&&(r.movedList||[]).length
              ? '<tr><td colspan="10" style="background:var(--b50)"><b style="font-size:12px">Zimehamishwa kutoka '+esc(r.holder)+' — nani kazipata</b>'
                +'<div class="scroll" style="margin-top:6px"><table><thead><tr><th>Serial / IMEI</th><th>Item</th><th>Sasa yupo kwa</th><th>Ripoti</th></tr></thead><tbody>'
                +r.movedList.map(function(x){

                  return '<tr><td style="font-size:11px">'+esc(s.serial)+'</td><td>'+esc(s.item||'—')+'</td>'
                    +'<td class="r">'+(s.age!=null?money(s.age):'—')+'</td>'
                    +'<td>'+(s.alsoHeldBy?'<b>'+esc(s.alsoHeldBy)+'</b> <span class="mut" style="font-size:10px">'+esc(s.alsoHeldOn||'')+'</span>'

              : '');
        }).join('')+'</tbody></table></div>'
      : '<div class="mut">Hakuna mwenye stock kwenye kundi hili. / Nobody in this pivot holds stock.</div>';
    m.innerHTML='<div class="card"><h2>Stock accountability</h2>'
      +'<div class="mut" style="margin-bottom:8px">Ripoti ya '+esc(d.asOf)+' ikilinganishwa na ya '+esc(d.prevAsOf||'—')
      +'. / Newest stock report against the one before it.</div>'
      +tabs+head+note+table+'</div>';
    $all('[data-sa]').forEach(function(b){ b.onclick=function(){ STOCKACCT.pivot=b.getAttribute('data-sa'); STOCKACCT.open=null; drawStockAccount(m); }; });
    wireTiles(m);
    $all('[data-sax]').forEach(function(b){ b.onclick=function(){
      var i=Number(b.getAttribute('data-sax')); STOCKACCT.open=(STOCKACCT.open===i?null:i);
      STOCKACCT.moved=null; drawStockAccount(m); }; });
    $all('[data-sam]').forEach(function(b){ b.onclick=function(){
      var i=Number(b.getAttribute('data-sam')); STOCKACCT.moved=(STOCKACCT.moved===i?null:i);
      STOCKACCT.open=null; drawStockAccount(m); }; });
  }).catch(function(e){ paneFailed(m,e); });
}

/* ---------- daily sales performance ----------
   "Pivot for all: for General duty person, RSMs, Commission agents and company grand
    totals ... target in settings so we see sales performances over set target."

   One week, four pivots, one shared week slider (the same pattern the recovery charts
   use). Each pivot is a per-person grid -- one row, seven day-columns Mon-Sun, count and
   TZS per day -- plus the week total; the company pivot is the same shape with one row.
   The target line is SALES_DAILY_TARGET (TZS/day) from settings: each day is measured
   against it, and the row total against target x 7. */
var SALESPERF={week:'',pivot:'general',data:null,at:0};
/* =======================================================================================
   SALES PERFORMANCE -- one fetch per WEEK, and no bars.

     "Speed is still an issue like i was tryna pull sales by roles it loads too much"
     "On sales performance remove the bars in rows it just longens the report too bad"

   THE SPEED PROBLEM WAS THE PIVOT BUTTONS, and it was entirely self-inflicted. salesWeek
   returns ALL FOUR pivots in one payload -- general, RSM, agent, company are computed from
   the same rows in the same pass -- and the pivot buttons then called drawSalesPerf(), which
   wiped the pane to a spinner and went back to the server for a payload it was already
   holding. Four ways to look at one week meant four round trips to see them. Switching now
   re-renders from what is in hand; only the WEEK arrows fetch, because only they change the
   answer.

   THE BARS WERE THE LENGTH PROBLEM. Every day cell carried a 46px column plus a number under
   it, so one person's week was ~70px of screen -- twenty agents and the report is fifteen
   hundred pixels of mostly whitespace, scrolled past to reach a total. A sales report is
   read by comparing numbers along a row and down a column, which is what a table is for. One
   line per person now, and it is a real <table>, so it also gets the Excel export and the
   column filters every other table here has -- which the hand-built grid never could.

   What the bars encoded is kept: a day that met the target is green, and the day's TZS is on
   the cell's tooltip. Nothing that was legible is gone -- only the pixels around it.
   ======================================================================================= */
function drawSalesPerf(m){
  // Held for five minutes, keyed by week: the same window the server caches for, so the two
  // cannot disagree about which week is "current".
  var fresh=SALESPERF.data&&SALESPERF.data.__wk===SALESPERF.week&&(Date.now()-SALESPERF.at)<5*60000;
  if(fresh) return salesRender(m);
  m.innerHTML='<div class="card"><h2>Sales performance</h2><div class="sk"></div></div>';
  srv('salesWeek',{week:SALESPERF.week}).then(function(d){
    d.__wk=SALESPERF.week; SALESPERF.data=d; SALESPERF.at=Date.now();
    salesRender(m);
  }).catch(function(e){ paneFailed(m,e); });
}
function salesRender(m){
  var d=SALESPERF.data; if(!d) return;
  var target=d.dailyTarget||0;
  var pivots=[['general','General duty'],['rsm','RSM'],['agent','Commission agent'],['company','Company']];
  var bar='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'
    +'<button class="btn sm ghost" id="spPrev" title="previous week">◀</button>'
    +'<span style="font-size:12px;font-weight:600">'+esc(d.from||'')+' → '+esc(d.to||'')+'</span>'
    +'<button class="btn sm ghost" id="spNext" title="next week">▶</button>'
    +(d.thisWeek?'<span class="chip">wiki hii / this week</span>'
      :'<button class="btn sm" id="spNow">Rudi wiki hii / this week</button>')
    +(d.fellBack ? '<span class="chip warn">bado hakuna mauzo wiki hii / no sales yet this week</span>' : '')
    +'<span style="flex:1"></span>'
    +'<span class="mut" style="font-size:11.5px">Lengo / target: '
      +(target?money(target)+' TZS/siku · '+money(d.weekTarget)+' /wiki':'—')+'</span>'
    +'</div>';
  var tabs='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'
    +pivots.map(function(p){
      return '<button class="btn sm'+(SALESPERF.pivot===p[0]?'':' ghost')+'" data-sp="'+p[0]+'">'+p[1]+'</button>';
    }).join('')+'</div>';

  // Company is one synthetic row so the table renders it identically to a per-person pivot.
  var rows = SALESPERF.pivot==='company'
    ? [{ name:'Company / jumla', days:d.company.days, count:d.company.count, amount:d.company.amount }]
    : (d[SALESPERF.pivot]||[]);

  var body;
  if(!rows.length){
    body='<div class="mut">Hakuna mauzo kwa wiki hii — pakia faili la mauzo (hoopltd.shop) kisha rudi hapa. '
      +'/ No sales for this week yet; upload the sales file and come back.</div>';
  } else {
    // Three letters, not "Wednesday": a full name is an unbreakable ~58px token and seven of
    // them set the table's minimum width wider than the pane.
    var dayName=function(iso){ return ['Jpi','Jtt','Jnn','Jtn','Alh','Iju','Jmo'][new Date(iso+'T00:00:00').getDay()]; };
    var who=pivots.filter(function(p){return p[0]===SALESPERF.pivot;})[0][1];
    // Column totals, so the bottom row answers "what did the whole company do on Tuesday" --
    // the question a per-person table otherwise makes you add up by hand.
    var colC={},colA={};
    d.days.forEach(function(dd){ colC[dd]=0; colA[dd]=0; });
    rows.forEach(function(r){ d.days.forEach(function(dd){
      var c=r.days[dd]; if(c){ colC[dd]+=c.count; colA[dd]+=c.amount; } }); });
    var totC=rows.reduce(function(s,r){ return s+r.count; },0);
    var totA=rows.reduce(function(s,r){ return s+r.amount; },0);

    var cell=function(c){
      if(!c||!c.count) return '<td class="r"><span style="color:var(--soft)">—</span></td>';
      var hit=target&&c.amount>=target;
      return '<td class="r"'+(hit?' style="color:var(--ok);font-weight:700"':'')
        +' title="'+money(c.amount)+' TZS">'+money(c.count)+'</td>';
    };
    body='<div class="scroll"><table><thead><tr><th>'+esc(who)+'</th>'
      +d.days.map(function(dd){
        return '<th class="r" title="'+esc(dd)+'">'+esc(dayName(dd))
          +'<div style="font-size:9px;color:var(--soft);font-weight:600">'+esc(dd.slice(5))+'</div></th>'; }).join('')
      +'<th class="r">Simu</th><th class="r">TZS / wiki</th>'+(target?'<th class="r">Lengo</th>':'')+'</tr></thead><tbody>'
      +rows.map(function(r){
        var overTarget=target?(r.amount>=d.weekTarget):null;
        return '<tr><td><b>'+esc(r.name)+'</b></td>'
          +d.days.map(function(dd){ return cell(r.days[dd]); }).join('')
          +'<td class="r">'+money(r.count)+'</td>'
          +'<td class="r"><b'+(overTarget===true?' style="color:var(--ok)"':'')+'>'+money(r.amount)+'</b></td>'
          +(target?'<td class="r">'+(overTarget?'<span class="chip ok">✓</span>'
              :'<span class="mut">'+Math.round(100*r.amount/d.weekTarget)+'%</span>')+'</td>':'')
          +'</tr>';
      }).join('')
      +'</tbody><tfoot><tr class="totrow"><td><b>Jumla / total</b></td>'
      +d.days.map(function(dd){
        return '<td class="r" title="'+money(colA[dd])+' TZS">'+(colC[dd]?money(colC[dd]):'—')+'</td>'; }).join('')
      +'<td class="r"><b>'+money(totC)+'</b></td><td class="r"><b>'+money(totA)+'</b></td>'
      +(target?'<td></td>':'')+'</tr></tfoot></table></div>'
      +'<div class="mut" style="font-size:10.5px;margin-top:8px">Kila nambari = idadi ya simu siku hiyo; '
      +'gusa/weka kishale juu yake kuona thamani (TZS). <b style="color:var(--ok)">Kijani</b> = siku imefika lengo. '
      +(target?'':'Weka <b>SALES_DAILY_TARGET</b> kwenye Settings ili uone lengo.')
      +'</div>';
  }
  m.innerHTML='<div class="card"><h2>Sales performance</h2>'
    +'<div class="mut" style="margin-bottom:8px">Mauzo ya kila siku, yaliyofuatiliwa kwa: mhudumu (general duty), RSM, wakala wa komisheni, na jumla ya kampuni. '
    +'/ Daily sales pivoted by general duty, RSM, commission agent, and company.</div>'
    +bar+tabs+body+'</div>';
  var step=function(n){
    var base=new Date((d.from||new Date().toISOString().slice(0,10))+'T09:00:00Z');
    base.setUTCDate(base.getUTCDate()+7*n);
    SALESPERF.week=base.toISOString().slice(0,10); SALESPERF.data=null; drawSalesPerf(m);
  };
  var p=$('#spPrev'); if(p) p.onclick=function(){ step(-1); };
  var nx=$('#spNext'); if(nx) nx.onclick=function(){ step(1); };
  var nw=$('#spNow'); if(nw) nw.onclick=function(){ SALESPERF.week=''; SALESPERF.data=null; drawSalesPerf(m); };
  /* NO FETCH HERE. The payload already holds every pivot -- this only chooses which of them
     to draw, which is the whole point of the change. */
  $all('[data-sp]').forEach(function(b){ b.onclick=function(){
    SALESPERF.pivot=b.getAttribute('data-sp'); salesRender(m); }; });
}

/* ---------- wateja / customers ----------
   ONE nav, THREE separated lists: jana (yesterday's list), leo ndani ya siku 45, na leo
   waliopita 45. Kila mstari unabeba AGENT -- aliyemuuzia simu, nafasi ile ile mdhamini
   aliyoshika Hope. Kila mtumiaji (isipokuwa view-only) anaandika maoni kwa mteja yeyote. */
var CUST={data:null,list:'leo45',sel:null};
function drawCust(m){
  CUST.data=null; CUST.sel=null;
  m.innerHTML='<div class="card"><h2>Wateja / Customers</h2><div class="sk"></div></div>';
  srv('customers').then(function(d){ CUST.data=d; custRender(m); })
    .catch(function(e){ paneFailed(m,e); });
}
function custRender(m){
  var d=CUST.data;
  var lists={jana:d.jana||[],leo45:d.leo45||[],leo45plus:d.leo45plus||[]};
  var rows=lists[CUST.list]||[];
  function pill(k,label){
    return '<button class="btn sm'+(CUST.list===k?'':' ghost')+'" data-pl="'+k+'">'+label+' · '+money(lists[k].length)+'</button>';
  }
  m.innerHTML=
    '<div class="card"><h2>Wateja / Customers'+(d.deckDate?' — deck '+esc(d.deckDate):'')+'</h2>'
    +'<div class="row">'
    +pill('jana','Jana'+(d.prevDate?' ('+esc(d.prevDate)+')':''))
    +pill('leo45','Leo · siku ≤ 45')
    +pill('leo45plus','Leo · 45+')
    +'</div>'
    +'<div class="row"><input class="inp" id="custQ" placeholder="Tafuta: jina, simu, IMEI, agent, branch, mdhamini… / search"></div>'
    +'<div class="mut" style="margin-bottom:8px">Bofya mteja kuona historia na kuandika maoni. <b>Agent</b> = aliyemuuzia simu · <b>Mdhamini</b> = guarantor (kutoka offline queue).</div>'
    +'<div class="scroll"><table><thead><tr><th>Mteja</th><th>Simu</th><th>Branch</th><th>Agent</th><th>Mdhamini / Guarantor</th><th>Anayefuatilia</th><th class="r">OFF</th><th class="r">Siku/45</th><th>Hali</th></tr></thead><tbody id="custRows">'
    +(rows.length?rows.map(function(r,i){
      var hh=telHref(r.phone);
      return '<tr data-ci="'+i+'" style="cursor:pointer"><td><b>'+esc(r.name||'—')+'</b><div class="mut" style="font-size:10px">'+esc(r.imei)+'</div></td>'
        +'<td>'+(hh!=='#'?'<a href="tel:'+hh+'" onclick="event.stopPropagation()">'+esc(r.phone)+'</a>':'—')+'</td>'
        +'<td>'+esc(r.branch||r.team||'')+'</td>'
        +'<td>'+esc(r.agent||'—')+(r.agentPhone?'<div class="mut" style="font-size:10px">'+esc(r.agentPhone)+'</div>':'')+'</td>'
        +'<td>'+(r.gName?esc(r.gName):'—')+(r.gPhone?'<div class="mut" style="font-size:10px">'+esc(r.gPhone)+'</div>':'')+'</td>'
        +'<td>'+(r.heldBy?'👤 '+esc(r.heldBy):'—')+'</td>'
        +'<td class="r">'+(r.daysOff!=null?money(r.daysOff):'—')+(r.locked7?' <span class="chip bad">7+</span>':(r.locked4?' <span class="chip warn">4+</span>':''))+'</td>'
        +'<td class="r">'+(r.lifeDay!=null?(r.inWindow!==false?money(r.lifeDay)+'/45':'<span class="chip">NJE</span>'):'—')+'</td>'
        +'<td>'+(r.fu?'<span class="chip">'+esc(r.fu)+'</span>':(r.paid?'<span class="chip ok">amelipa</span>':''))+'</td></tr>';
    }).join(''):'<tr><td colspan="9" class="mut">Hakuna mteja kwenye orodha hii bado.</td></tr>')
    +'</tbody></table></div></div>'
    +'<div id="custSrch"></div>';
  $all('[data-pl]',m).forEach(function(b){ b.onclick=function(){ CUST.list=b.getAttribute('data-pl'); CUST.sel=null; custRender(m); }; });
  $all('#custRows tr[data-ci]',m).forEach(function(tr){
    tr.onclick=function(){ openCust(rows[parseInt(tr.getAttribute('data-ci'),10)]); };
  });
  /* The box filters the visible list instantly; from 3 characters it ALSO asks the whole
     register -- so "any customer" means any, not just today's deck. One bounded read. */
  var t=null;
  $('#custQ').addEventListener('input',function(){
    var q=this.value.trim();
    var Q=q.toUpperCase();
    $all('#custRows tr[data-ci]',m).forEach(function(tr){
      tr.style.display=!Q||tr.textContent.toUpperCase().indexOf(Q)>=0?'':'none';
    });
    clearTimeout(t);
    var box=$('#custSrch');
    if(q.length<3){ if(box) box.innerHTML=''; return; }
    t=setTimeout(function(){
      srv('customerSearch',{q:q}).then(function(x){
        if($('#custQ')&&$('#custQ').value.trim()!==q) return;
        var cs=x.customers||[];
        if(!box) return;
        box.innerHTML=!cs.length?'':'<div class="card"><h2>Rejista nzima / Whole register — '+cs.length+'</h2>'
          +'<div class="scroll"><table><thead><tr><th>Mteja</th><th>Branch</th><th>Agent</th><th>Mdhamini</th><th class="r">OFF</th></tr></thead><tbody>'
          +cs.map(function(c,i){
            return '<tr data-si="'+i+'" style="cursor:pointer"><td><b>'+esc(c.name||'—')+'</b><div class="mut" style="font-size:10px">'+esc(c.imei)+'</div></td>'
              +'<td>'+esc(c.branch||c.team||'')+'</td><td>'+esc(c.agent||'—')+'</td>'
              +'<td>'+(c.gName?esc(c.gName):'—')+(c.gPhone?'<div class="mut" style="font-size:10px">'+esc(c.gPhone)+'</div>':'')+'</td>'
              +'<td class="r">'+(c.daysOff!=null?money(c.daysOff):'—')+(c.locked7?' <span class="chip bad">7+</span>':'')+'</td></tr>';
          }).join('')+'</tbody></table></div></div>';
        $all('[data-si]',box).forEach(function(tr){
          tr.onclick=function(){ openCust(cs[parseInt(tr.getAttribute('data-si'),10)]); };
        });
      }).catch(function(){});
    },350);
  });
  // A hit from the header's everything-box lands here: open that customer's card.
  if(window.GOPEN){ var g0=window.GOPEN; window.GOPEN=null; openCust(g0); }
}
/* =======================================================================================
   THE CUSTOMER PANEL OPENS OVER THE PAGE, as HOPE's does.

     "Clicking customer should open their panel as hopeloan does. not scroll to bottom"

   It used to render into a #custDetail div BELOW the table and then scrollIntoView its way
   down to it. On a deck of three hundred that means the row you clicked scrolls off the top
   while the panel arrives at the bottom, so you lose your place in the list and cannot see
   the person you picked at the same time as their history. HOPE puts this in a drawer --
   the same one openFollowup uses there -- and a drawer is the right shape for it: it covers
   the page, it is dismissed with Esc or a tap outside, and the list underneath keeps its
   scroll position, so closing it puts you back exactly where you were.
   ======================================================================================= */
function openCust(c){
  if(!c) return;
  CUST.sel=c;
  var d=CUST.data||{};
  /* THE FOLLOW-UP IS WRITTEN FROM THE PHONE, OR NOT AT ALL.
       "Allow commenting only by phone ... if we allow commenting in computers for hoop, the
        hoop guys are lazy so we should detect visit type to be from app to allow commenting
        if its not just dont show the writing space without giving reason"

     A comment typed at a desk says nothing about whether anybody went and called the
     customer; one typed in the app was typed by somebody holding the phone that made the
     call. So the writing space is drawn only when the Android bridge is actually present --
     the object the APK injects, which a desktop browser cannot have.

     SILENTLY, as asked: no banner, no "you cannot do this here". The history still reads
     everywhere; only the box to write in is absent. A reason on screen is an invitation to
     argue with it. */
  var canW=!BOOT.readOnly && fromApp_();
  var fus=d.fuStatuses||[];
  /* A callable number is a LINK, everywhere it appears -- the whole reason somebody opens
     this panel is to ring one of these three people. */
  var tel=function(v){
    var t=telHref(v);
    return (v&&t!=='#')?'<a href="tel:'+t+'">'+esc(v)+'</a>':'<span>'+esc(v||'—')+'</span>';
  };
  drawer(
    '<h3>'+esc(c.name||'—')+' '+((c.branch||c.team)?'<span class="chip">'+esc(c.branch||c.team)+'</span>':'')+'</h3>'
    +'<div class="sub">IMEI '+esc(c.imei)+(c.model?' · '+esc(c.model):'')+(c.price?' · TZS '+money(c.price):'')
    +(c.lifeDay!=null?' · siku '+money(c.lifeDay)+'/45':'')+(c.daysOff!=null?' · OFF siku '+money(c.daysOff):'')+'</div>'
    +'<div class="facts">'
    +'<div class="frow"><span>Simu ya mteja</span>'+tel(c.phone)+'</div>'
    +'<div class="frow"><span>Agent (aliyemuuzia)</span><b>'+esc(c.agent||'—')
      +(c.agentPhone&&telHref(c.agentPhone)!=='#'?' · <a href="tel:'+telHref(c.agentPhone)+'">'+esc(c.agentPhone)+'</a>':'')+'</b></div>'
    +'<div class="frow"><span>Mdhamini / Guarantor</span><b>'+(c.gName?esc(c.gName):'—')
      +(c.gPhone&&telHref(c.gPhone)!=='#'?' · <a href="tel:'+telHref(c.gPhone)+'">'+esc(c.gPhone)+'</a>':'')+'</b></div>'
    +(c.heldBy?'<div class="frow"><span>Anayefuatilia / Chasing</span><b>👤 '+esc(c.heldBy)+'</b></div>':'')
    +'</div>'
    +'<div class="mut" style="font-size:11px;margin:-6px 0 12px">Namba ya mteja ndiyo ref ya malipo Watu.</div>'
    +'<div class="card" style="padding:12px"><b style="font-size:13px">Historia / History</b>'
    +'<div id="custHist" class="mut" style="margin-top:6px">Inapakia historia…</div></div>'
    +(canW?
      '<div class="fld"><label>Hali / status</label><select id="cmFu"><option value="">—</option>'
      +fus.map(function(s){ return '<option'+(c.fu===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'
      +'<div class="row hide" id="cmPromRow"><input class="inp" type="date" id="cmDate"><input class="inp" type="text" id="cmAmt" placeholder="Kiasi / amount (TZS)" inputmode="numeric"></div>'
      +'<div class="fld"><label>Maoni / comment</label><textarea id="cmTxt" rows="3"></textarea></div>'
      +'<button class="btn w" id="cmSave">Hifadhi maoni / Save</button>':''));
  function hist(){
    srv('customerComments',{imei:c.imei}).then(function(x){
      var it=x.items||[];
      $('#custHist').innerHTML=!it.length?'<div class="mut">Hakuna maoni bado — wa kwanza kuandika.</div>'
        :'<div style="display:flex;flex-direction:column;gap:8px">'+it.map(function(r){
          return '<div style="background:var(--b50);border-radius:9px;padding:8px 11px;font-size:13px">'
            +(r.fu_status?'<span class="chip">'+esc(r.fu_status)+'</span> ':'')
            +(r.promise_date?'<span class="chip ok">ahadi '+esc(String(r.promise_date).slice(0,10))+'</span> ':'')
            +esc(r.comment||'')
            +'<div class="mut" style="font-size:10.5px;margin-top:3px">'+esc(r.created_by||'')+' · '+esc(String(r.created_at||'').slice(0,16).replace('T',' '))+'</div></div>';
        }).join('')+'</div>';
    }).catch(function(e){ $('#custHist').innerHTML='<div class="mut">'+esc(safeErr(e))+'</div>'; });
  }
  hist();
  if(!canW) return;
  function promToggle(){
    var need=(d.fuNeedDate||[]).indexOf($('#cmFu').value)>=0;
    $('#cmPromRow').classList.toggle('hide',!need);
    if(need&&!$('#cmDate').value) $('#cmDate').value=isoToday(1);
  }
  $('#cmFu').onchange=promToggle; promToggle();
  $('#cmSave').onclick=function(){
    var fu=$('#cmFu').value, txt=$('#cmTxt').value.trim();
    if(!fu&&!txt){ toast('Chagua hali au andika maoni.',true); return; }
    var needP=(d.fuNeedDate||[]).indexOf(fu)>=0;
    $('#cmSave').disabled=true;
    srv('portalAddComment',{imei:c.imei,team:c.team||null,name:c.name||null,fu:fu||null,
      promiseDate:needP?($('#cmDate').value||null):null,
      promiseAmt:needP?(Number(String($('#cmAmt').value).replace(/\D/g,''))||null):null,
      comment:txt||null})
      .then(function(){
        toast('Imehifadhiwa.');
        c.fu=fu||c.fu; $('#cmTxt').value='';
        hist();
      })
      .catch(function(e){ toast(String(e.message||e),true); })
      .then(function(){ var b=$('#cmSave'); if(b) b.disabled=false; });
  };
}

/* ---------- fraud audit / agent scorecards / stock: three first-class navs ----------
   The owner's loop, one pane each: general duty's book vs Watu's records finds the sale
   nobody financed; Sipho's register names who answers for it; the daily files score how
   each agent's customers behave; the warehouse shows who holds the aged phones. */
// status: which slice of the audit table is showing. '' = all of it.
var MZ={from:isoToday(-30),to:isoToday(0),status:''};
function mzDates(redraw){
  return '<div class="row">'
    +'<input class="inp" type="date" id="mzFrom" value="'+MZ.from+'" style="flex:0 1 150px">'
    +'<input class="inp" type="date" id="mzTo" value="'+MZ.to+'" style="flex:0 1 150px">'
    +'<button class="btn sm ghost" id="mzGo">Show</button></div>';
}
function mzWire(m,redraw){
  var go=$('#mzGo'); if(go) go.onclick=function(){ MZ.from=$('#mzFrom').value||MZ.from; MZ.to=$('#mzTo').value||MZ.to; redraw(m); };
}
function drawStock(m){
  m.innerHTML='<div class="card"><h2>Stock</h2><div class="sk"></div></div>';
  srv('stockView').then(function(d){
    var filt='<div class="row"><input class="inp" id="stQ" placeholder="Filter: agent, IMEI, item…"></div>';
    m.innerHTML='<div class="card"><h2>Aged stock — by RSMs and agents'+(d.asOf?' <span class="mut" style="font-weight:400;font-size:12px">(report of '+esc(d.asOf)+')</span>':'')+'</h2>'
      +(d.total?
        /* This pane already holds all three lists; the tiles just take you to the right one
           rather than making somebody scroll past two tables to find the third. "Oldest"
           goes further and filters the serial list to whoever is holding it, because the
           number is only ever read as "who has had one this long". */
        '<div class="tiles">'
        +tile('Aged phones',money(d.total),'past the age limit',
          { go:function(){ stGo('stSerials',''); }, cta:'orodha ›' })
        +tile('Holders',money((d.holders||[]).length),'wenye stock',
          { go:function(){ stGo('stHolders'); }, cta:'nani ›' })
        +tile('Oldest',money((d.holders[0]||{}).maxAge||0),'days · '+esc((d.holders[0]||{}).agent||'—'),
          { color:'bad', cta:'simu zake ›',
            go:function(){ stGo('stSerials',(d.holders[0]||{}).agent||''); } })
        +'</div>'
        +'<div class="mut" style="margin-bottom:8px">Ages are SyscoPos\'s own (resettable there — true age comes in phase 3). Top = oldest burden.</div>'
        +'<h2 style="margin-top:4px">By item — IMEI numbers inclusive</h2>'
        +(d.items||[]).map(function(it){
          return '<details style="border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0">'
            +'<summary style="cursor:pointer;font-weight:700">'+esc(it.item)+' — '+money(it.pieces)+' phones'
            +' <span class="mut" style="font-weight:400;font-size:11.5px">avg '+(it.avgAge!=null?money(it.avgAge):'—')+'d · oldest '
            +'<span'+(it.maxAge>=14?' style="color:var(--bad)"':'')+'>'+money(it.maxAge)+'d</span></span></summary>'
            +'<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Serial / IMEI</th><th>Holder</th><th>Received</th><th class="r">Age (days)</th></tr></thead><tbody>'
            +(it.serials||[]).map(function(s){
              return '<tr><td style="font-size:11px">'+esc(s.serial)+'</td><td>'+esc(s.agent)+'</td>'
                +'<td>'+esc(s.received||'—')+'</td><td class="r"'+(s.age>=14?' style="color:var(--bad)"':'')+'>'+(s.age!=null?money(s.age):'—')+'</td></tr>';
            }).join('')+'</tbody></table></div></details>';
        }).join('')
        +'<h2 style="margin-top:16px" id="stHolders">By holder</h2>'
        +'<div class="scroll"><table><thead><tr><th>Holder</th><th>Role</th><th class="r">Phones</th><th class="r">Avg age</th><th class="r">Oldest</th><th>Items</th></tr></thead><tbody>'
        +(d.holders||[]).map(function(h){
          return '<tr><td><b>'+esc(h.agent)+'</b>'+(h.branch?'<div class="mut" style="font-size:10px">'+esc(h.branch)+'</div>':'')+'</td>'
            +'<td>'+esc(h.role||'—')+'</td><td class="r">'+money(h.pieces)+'</td>'
            +'<td class="r">'+(h.avgAge!=null?money(h.avgAge):'—')+'</td>'
            +'<td class="r"'+(h.maxAge>=14?' style="color:var(--bad)"':'')+'>'+money(h.maxAge)+'</td>'
            +'<td class="mut" style="font-size:11px">'+esc(h.items)+'</td></tr>';
        }).join('')+'</tbody></table></div>'
        +'<h2 style="margin-top:16px" id="stSerials">Per serial</h2>'+filt
        +'<div class="scroll"><table><thead><tr><th>Serial / IMEI</th><th>Holder</th><th>Item</th><th>Received</th><th class="r">Age (days)</th></tr></thead><tbody id="stRows">'
        +(d.serials||[]).map(function(s){
          return '<tr><td style="font-size:11px">'+esc(s.serial)+'</td><td>'+esc(s.agent)+'</td><td>'+esc(s.item)+'</td>'
            +'<td>'+esc(s.received||'—')+'</td><td class="r"'+(s.age>=14?' style="color:var(--bad)"':'')+'>'+(s.age!=null?money(s.age):'—')+'</td></tr>';
        }).join('')+'</tbody></table></div>'
      :'<div class="mut">No stock uploaded yet. Sipho: open Aged Stock in SyscoPos → click the <b>CSV</b> button → upload that file at <a href="/upload">/upload</a> (or save the page AFTER the table is visible and upload the HTML).</div>')
      +'</div>';
    var q=$('#stQ');
    if(q) q.addEventListener('input',stApplyFilter);
    wireTiles(m);
  }).catch(function(e){ paneFailed(m,e); });
}
/** The per-serial filter, as its own function so a tile can drive the same one the box does
    -- two filters over one table is how the count in the box stops matching the rows. */
function stApplyFilter(){
  var q=$('#stQ'); if(!q) return;
  var Q=q.value.trim().toUpperCase();
  $all('#stRows tr').forEach(function(tr){
    tr.style.display=!Q||tr.textContent.toUpperCase().indexOf(Q)>=0?'':'none';
  });
}
/** Scroll a section of this pane into view, optionally setting the serial filter first. */
function stGo(id,filter){
  if(filter!==undefined){ var q=$('#stQ'); if(q){ q.value=filter; stApplyFilter(); } }
  var h=$('#'+id); if(h&&h.scrollIntoView) h.scrollIntoView({behavior:'smooth',block:'start'});
}
function mzStatusChip(s){
  if(s==='OK') return '<span class="chip ok">OK · Watu</span>';
  if(s==='DRIFT') return '<span class="chip warn">DRIFT · different agent</span>';
  if(s==='PENDING') return '<span class="chip">PENDING · too fresh</span>';
  if(s==='BULK') return '<span class="chip">BULK / CASH?</span>';
  return '<span class="chip bad">⚠ NOT IN WATU</span>';
}
/** Tile options for "show only this status". '' means all; 'BULK|PENDING' is one tile over

}

/* ---------- stock movement: what got away after every upload ---------- */
var MV={hoopA:'',hoopB:'',watuA:'',watuB:''};
/* Which of the four movement reports are on screen. The pane holds a LOT of rows, so
   the reports are chosen with chips and laid side by side (left to right) instead of
   stacked -- "finding the next report requires a lot of scrolling" (the owner). The
   tiles are the same chooser: click one to show just that report. */
var MVSHOW={leftHoop:true,newInHoop:true,newWatu:true,leftWatu:true};
function drawMove(m){
  m.innerHTML='<div class="card"><h2>Stock movement</h2><div class="sk"></div></div>';
  srv('stockMovement',{hoopA:MV.hoopA,hoopB:MV.hoopB,watuA:MV.watuA,watuB:MV.watuB}).then(function(d){
    var c=d.counts||{};
    /* HONEST NAMES: the Watu side diffs two DAILY LOCKED LISTS, not Watu's whole loan
       book -- "new" means newly locked, "left" means no longer on the locked list
       (paid / back online / loan closed). The HOOP side diffs two Aged Stock reports. */
    var DEFS=[
      {k:'leftHoop', t:'Left the Hoop store', s:'in '+(d.hoopA||'—')+', gone by '+(d.hoopB||'—'),
        rows:d.leftHoop||[], cols:[['Serial / IMEI','serial'],['Item','item'],['Holder','holder']], color:'var(--bad)'},
      {k:'newInHoop', t:'New in the Hoop store', s:'appeared by '+(d.hoopB||'—'),
        rows:d.newInHoop||[], cols:[['Serial / IMEI','serial'],['Item','item'],['Holder','holder']], color:''},
      {k:'newWatu', t:'New on the locked list', s:'locked by '+(d.watuB||'—')+' — just got locked, call first',
        rows:d.newWatu||[], cols:[['IMEI','imei'],['Customer','name'],['Agent','agent'],['Model','model']], color:'var(--bad)'},
      {k:'leftWatu', t:'Left the locked list', s:'on '+(d.watuA||'—')+', off by '+(d.watuB||'—')+' — paid or back online',
        rows:d.leftWatu||[], cols:[['IMEI','imei'],['Customer','name'],['Agent','agent'],['Model','model']], color:'var(--ok)'},
    ];
    var shown=DEFS.filter(function(x){return MVSHOW[x.k];});
    function tbl(x){
      return '<div class="card" style="flex:1 1 '+(shown.length>1?'340px':'100%')+';min-width:300px;margin:0">'
        +'<h2>'+esc(x.t)+' — '+money(x.rows.length)+'</h2><div class="mut" style="margin-bottom:6px">'+esc(x.s)+'</div>'
        +'<div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table><thead><tr>'
        +x.cols.map(function(cc){return '<th>'+cc[0]+'</th>';}).join('')+'</tr></thead><tbody>'
        +(x.rows.length?x.rows.map(function(r){
          return '<tr>'+x.cols.map(function(cc){return '<td>'+esc(r[cc[1]]||'—')+'</td>';}).join('')+'</tr>';
        }).join(''):'<tr><td colspan="'+x.cols.length+'" class="mut">Nothing moved between these dates.</td></tr>')
        +'</tbody></table></div></div>';
    }
    m.innerHTML=
      '<div class="card"><h2>Stock movement — the difference after every upload</h2>'
      +'<div class="mut" style="margin-bottom:8px">HOOP store compares two Aged Stock uploads; the Watu side compares two daily LOCKED lists. Defaults are the newest two of each — change any date to check a different gap. Tick which reports to see; they sit side by side.</div>'
      +'<div class="row">'
      +'<span class="mut">Hoop store:</span><input class="inp" type="date" id="mvHA" value="'+esc(d.hoopA||'')+'" style="flex:0 1 140px"><span class="mut">→</span><input class="inp" type="date" id="mvHB" value="'+esc(d.hoopB||'')+'" style="flex:0 1 140px">'
      +'<span class="mut" style="margin-left:10px">Locked lists:</span><input class="inp" type="date" id="mvWA" value="'+esc(d.watuA||'')+'" style="flex:0 1 140px"><span class="mut">→</span><input class="inp" type="date" id="mvWB" value="'+esc(d.watuB||'')+'" style="flex:0 1 140px">'
      +'<button class="btn sm ghost" id="mvGo">Show</button></div>'
      +'<div class="row" style="gap:6px 14px;flex-wrap:wrap">'
      +DEFS.map(function(x){
        return '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0;cursor:pointer">'
          +'<input type="checkbox" class="mvT" value="'+x.k+'"'+(MVSHOW[x.k]?' checked':'')+'> '
          +x.t+' <b'+(x.color?' style="color:'+x.color+'"':'')+'>'+money(c[x.k])+'</b></label>';
      }).join('')+'</div>'
      +((d.hoopA||d.hoopB)?'':'<div class="mut" style="margin-top:8px">No Aged Stock uploads yet — the Hoop-store side fills the day Sipho uploads two reports.</div>')
      +'</div>'
      +'<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">'
      +shown.map(tbl).join('')
      +(shown.length?'':'<div class="card" style="flex:1;margin:0"><div class="mut">Tick at least one report above.</div></div>')
      +'</div>';
    $('#mvGo').onclick=function(){
      MV.hoopA=$('#mvHA').value; MV.hoopB=$('#mvHB').value;
      MV.watuA=$('#mvWA').value; MV.watuB=$('#mvWB').value;
      drawMove(m);
    };
    $all('.mvT',m).forEach(function(cb){
      cb.onchange=function(){ MVSHOW[cb.value]=cb.checked; drawMove(m); };
    });
  }).catch(function(e){ paneFailed(m,e); });
}

          .then(function(){ return srv('newTeamCode',{team:t}); })
          .then(function(d2){ toast((t==='AGENT'?'Agent':'Company')+' code: '+d2.code);
            return srv('boot').then(function(x){BOOT=x;drawCodes(m);}); })
          .catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-corot]',m).forEach(function(b){
      b.onclick=function(){
        var t=b.getAttribute('data-corot');
        if(!confirm('Rotate the '+(t==='AGENT'?'agent':'company')+' code? The old one stops working for new registrations.')) return;
        srv('newTeamCode',{team:t}).then(function(d2){
          toast('New '+(t==='AGENT'?'agent':'company')+' code: '+d2.code);
          return srv('boot').then(function(x){BOOT=x;drawCodes(m);});
        }).catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-tg]',m).forEach(function(b){
      b.onclick=function(){
        srv('officerActive',{userId:b.getAttribute('data-tg'),active:b.getAttribute('data-on')!=='1'})
          .then(function(){drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-rl]',m).forEach(function(b){
      b.onclick=function(){
        $('#rlName').value=b.getAttribute('data-rl');
        var t=(b.getAttribute('data-rltabs')||'').split(',');
        $all('.rlT',m).forEach(function(c){ c.checked=t.indexOf(c.value)>=0; });
      };
    });
    $all('[data-rldel]',m).forEach(function(b){
      b.onclick=function(){
        var role=b.getAttribute('data-rldel');
        if(!confirm('Futa role '+role+'? Hakuna mtu anayeitumia sasa.')) return;
        srv('deleteRole',{role:role})
          .then(function(){toast('Role '+role+' imefutwa.');drawCodes(m);})
          .catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $('#rlSave').onclick=function(){
      var role=$('#rlName').value.trim();
      if(!role){ toast('Enter a role name.',true); return; }
      var tabs=$all('.rlT',m).filter(function(c){return c.checked;}).map(function(c){return c.value;});
      if(!tabs.length){ toast('Tick at least one pane for this role.',true); return; }
      srv('saveRole',{role:role,tabs:tabs})
        .then(function(){toast('Role saved.');drawCodes(m);})
        .catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-ed]',m).forEach(function(b){
      b.onclick=function(){
        EDIT_FROM=b.getAttribute('data-ed');
        $('#acCode').value=EDIT_FROM;
        $('#acName').value=b.getAttribute('data-name')||'';
        $('#acRole').value=b.getAttribute('data-role')||'ADMIN';
        $('#acTeams').value=b.getAttribute('data-teams')||'';
        $('#acAdd').textContent='Hifadhi / Save';
        $('#acCode').focus();
      };
    });
    $('#acAdd').onclick=function(){
      var role=$('#acRole').value;
      var tabs=role==='ADMIN'?['upload','settings']:[];
      var rawTeams=$('#acTeams').value.trim();
      var allTeams=rawTeams.toUpperCase()==='ALL'||rawTeams.toUpperCase()==='ZOTE';
      var teams=allTeams?[]:rawTeams.split(',').map(function(x){return x.trim();}).filter(Boolean);
      if(!allTeams&&!teams.length){ toast('Andika ALL au orodha ya timu. / State ALL, or name the teams.',true); return; }
      var newCode=$('#acCode').value.trim();
      var save=function(){ return srv('saveAccessCode',{code:newCode,name:$('#acName').value,role:role,teams:teams,allTeams:allTeams,tabs:tabs}); };
      var flow = (EDIT_FROM && EDIT_FROM!==newCode)
        ? srv('renameAccessCode',{from:EDIT_FROM,to:newCode}).then(function(r){
            if(r.self){ CODE=newCode; try{localStorage.setItem('hpCode',newCode);}catch(e){} }
            return save();
          })
        : save();
      flow.then(function(){toast('Imehifadhiwa.');drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-del]',m).forEach(function(b){
      b.onclick=function(){
        if(!confirm('Futa code hii?')) return;
        srv('deleteAccessCode',{code:b.getAttribute('data-del')})
          .then(function(){drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ paneFailed(m,e); });
}

/* ---------- settings ---------- */
function drawSettings(m){
  m.innerHTML='<div class="card"><h2>Settings</h2><div class="sk"></div></div>';
  srv('settings').then(function(d){
    m.innerHTML='<div class="card"><h2>Settings</h2>'
      +(d.settings||[]).map(function(s,i){
        return '<div class="row"><div style="min-width:170px;font-size:12.5px;font-weight:700">'+esc(s.key)+'</div>'
          +'<input class="inp" id="st'+i+'" value="'+esc(s.value)+'">'
          +'<button class="btn sm" data-sv="'+esc(s.key)+'" data-i="'+i+'">Save</button></div>';
      }).join('')
      +'<div class="mut">SYSTEM_OPEN=YES hufungua mfumo. CALL_BRAND ni jina kwenye app. FU_STATUSES: hali za ufuatiliaji — tenganisha kwa comma (au mstari mpya). '
      +'<b>SALES_DAILY_TARGET</b>: lengo la mauzo kwa siku (TZS) — linaonekana kama mstari kwenye chati ya Sales performance. / daily sales target in TZS, drawn as the target line on the Sales performance chart.</div>'
      /* THE LOCK SCREEN IS WRITTEN HERE, so the shape it makes is drawn here. Nobody sees
         that screen in the course of ordinary work -- it takes a provisioned handset and a
         lock order to appear at all -- so somebody editing DEVICE_LOCK_MESSAGE is otherwise
         typing blind into a screen only a customer will ever read. */
      +'<div class="mut" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'
      +'<b>DEVICE_*</b>: maneno yanayoonekana kwenye simu iliyofungwa. Hakuna neno lililojengwa ndani ya app — yote yanatoka hapa. '
      +'/ every word on a locked phone comes from these; none is compiled into the APK.'
      +'<pre style="background:#0b2a6b;color:#fff;text-align:center;border-radius:8px;padding:12px;margin:8px 0;font-size:11.5px;line-height:1.6;white-space:pre-wrap">'
      +'HOOP LIMITED\n'
      +'SIMU HII IMEFUNGWA NA HOOP LIMITED.\nWASILIANA NASI KWA NAMBA 0700123456\n'
      +'IMEI: 351388334583295\n'
      +'REASON: STOCK, UNSOLD</pre>'
      +'<b>DEVICE_LOCK_BRAND</b> = mstari wa kwanza, na <code>{brand}</code>. '
      +'<b>DEVICE_HELP_PHONE</b> = namba, na <code>{namba}</code>. '
      +'<b>DEVICE_LOCK_MESSAGE</b> = sentensi — weka <code>{brand}</code> na <code>{namba}</code> popote unapotaka. '
      +'IMEI inatoka kwenye register, si kwenye simu yenyewe. '
      +'<b>DEVICE_LOCK_REASON</b> hutumika <u>pale tu</u> simu ilipojifunga yenyewe kwa kukosa mtandao — ukifunga wewe kwa Funga, sababu uliyoandika ndiyo inayoonekana. '
      +'<b>DEVICE_OFFLINE_GRACE_HOURS</b> = saa za ukimya kabla simu ya mteja kujifunga (168 = wiki moja).</div>'
      +'</div>';
    $all('[data-sv]',m).forEach(function(b){
      b.onclick=function(){
        srv('settingSet',{key:b.getAttribute('data-sv'),value:$('#st'+b.getAttribute('data-i')).value})
          .then(function(){toast('Imehifadhiwa.');}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ paneFailed(m,e); });
}

/* =====================================================================================
   THE STATUS BAR, MEASURED RATHER THAN ASSUMED -- the portal's half.

   Same reasoning, same numbers, same rule as call.html; see the long note there. Two
   differences that matter on this page:

     the bar is .top, not header.top -- white, not navy
     the sidebar's brand sits at the same height, so it takes the inset too, or the header
     clears the clock and the brand beside it still does not

   Only inside the app: fromApp_() is the proof, because a desktop browser legitimately
   fills the screen with nothing drawn over it and would otherwise be padded for nothing. */
function statusBarFit_(){
  if (!fromApp_()) return null;
  var bar = document.querySelector('.top');
  if (!bar) return null;
  var scrH = (window.screen && window.screen.height) || 0;
  var viewH = document.documentElement.clientHeight || window.innerHeight || 0;
  var gap = scrH - viewH;
  var inset = 0;
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;pointer-events:none;'
      + 'visibility:hidden;height:env(safe-area-inset-top,0px)';
    document.body.appendChild(probe);
    inset = Math.round(probe.getBoundingClientRect().height) || 0;
    probe.parentNode.removeChild(probe);
  } catch (e) {}

  var pad = 0;
  if (gap < 16) {                                   // edge-to-edge: the clock is over us
    pad = inset > 0 ? inset : 28;
    bar.style.paddingTop = (11 + pad) + 'px';
    var side = document.querySelector('aside.side');
    if (side) side.style.paddingTop = (14 + pad) + 'px';
  }
  return { scrH: scrH, viewH: viewH, gap: gap, inset: inset, pad: pad, dpr: window.devicePixelRatio || 1 };
}
setTimeout(function(){ try { statusBarFit_(); } catch(e){} }, 350);
