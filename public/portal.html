<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>HOOPLOAN — Portal</title>
<style>
:root{ --b950:#081C4A; --b900:#0B2A6B; --b800:#10357F; --b700:#1D4ED8; --b600:#2563EB; --b300:#93C5FD; --b100:#DBEAFE; --b50:#EFF6FF;
  --bg:#F6F8FC; --card:#fff; --ink:#0F172A; --mut:#64748B; --soft:#94A3B8; --line:#E2E8F0;
  --ok:#067647; --okbg:#E7F6EE; --warn:#92400E; --warnbg:#FEF3DC; --bad:#B42318; --badbg:#FDECEA; --sky:#35A8E1; }
*{box-sizing:border-box}
/* FULL HEIGHT, NOT FULL PAGE. The window itself never scrolls -- the sidebar holds its own
   height and only the work scrolls, which is what stops the nav sliding away the moment a
   table gets long. This one pair of rules is what the whole shell below hangs off. */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.hide{display:none!important}
/* SIGN-IN, AND WHY IT WOULD NOT RISE FOR THE KEYBOARD.

     "at login page it doesnt slide up to see whats beeing filled"

   fitPanelToKeyboard_ was already pointed at this box and could not move it. Two reasons,
   both in this one line as it was written:

     min-height:100vh   a height set in JS cannot shrink a box below its own min-height, so
                        the panel stayed a full viewport tall however small the visible area
                        got, and the code field kept its place behind the keys.
     not positioned     `top` means nothing on a static block, so the other half of the fit
                        was ignored too.

   position:fixed;inset:0 is what HOPE's #signin is, and it is why the same helper works
   there. overflow:auto so a small screen can still reach the button once the keyboard has
   taken half the height. */
#scrIn{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--b900),var(--b800))}
.incard{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:380px;margin:16px;box-shadow:0 12px 34px -14px rgba(8,28,74,.45)}
.mark{width:76px;display:block;margin-bottom:10px}
.incard h1{font-size:18px;margin:0 0 4px}
.incard p{font-size:13px;color:var(--mut);margin:0 0 14px}
input,select,textarea{font-family:inherit}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
.btn.w{width:100%;margin-top:12px;padding:14px}
.btn.ghost{background:#fff;color:var(--b700);border:1.5px solid var(--b100)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{background:var(--b300)}
.err{background:var(--badbg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:10px;display:none}
/* =====================================================================================
   THE SHELL -- HOPE PMO's, brought over whole.

     "upgrade our hooploan interface to be full screen and the features of the left nav
      the way its heavy and everything else as the hopepmo"

   What HOOP had was a centred 1120px column with a navy strip along the top and a stack of
   white pill buttons beside it. Two things were wrong with it on the machines this is
   actually used on. It threw away every pixel past 1120 -- on the office monitor a stock
   table sat in the middle of the screen with grey margins either side of it, scrolling
   sideways while the room went unused. And the nav read as a row of loose buttons that
   happened to be stacked, rather than as the frame of the application.

   HOPE's model, which this now is: a navy column holding the full height of the window,
   a white bar over the work, and ONLY the work scrolling. The nav cannot scroll away,
   the identity and the exits sit at the bottom of the column where they stop competing
   with the tabs, and the table gets the whole width of whatever screen it is on.
   ===================================================================================== */
/* THE HEIGHT HAS TO COME FROM THE WINDOW, not from a chain of percentages.

   `.shell{height:100%}` alone did not work, and this is why: percentage height resolves
   against the PARENT's height, and #scrApp -- the wrapper between <body> and the shell --
   had none. So the chain broke there, the shell fell back to the height of its contents,
   and the sidebar grew as long as whatever table was on screen. Logout ended up somewhere
   past the bottom of a stock report.

   Viewport units cut the chain out entirely: 100dvh is the window, whatever any ancestor
   is doing. dvh rather than vh because on a phone vh is the height WITHOUT the address
   bar, so the foot of the column sits under it; vh stays first as the fallback for the
   older WebViews this runs in. */
#scrApp{height:100vh;height:100dvh;overflow:hidden}
.shell{display:flex;height:100%;min-height:0}

/* The navy is --b900, the same shade the phone app's header uses -- not the darkest in the
   ramp. A near-black column the full height of the screen next to a white page is what
   makes a system read as hard; one step lighter is the colour it was meant to match. */
aside.side{width:236px;flex:0 0 auto;background:var(--b900);color:#cfe0ff;
  display:flex;flex-direction:column;padding:14px 12px;min-height:0}
/* Neither of these may be squeezed: the brand anchors the top and the foot holds Logout. */
.side .brand,.side .foot{flex:0 0 auto}
.side .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:14px;line-height:1.3}
.side .brand svg{width:40px;flex:0 0 40px}
.side .brand small{display:block;color:var(--b300);font-weight:500;font-size:10.5px;margin-top:2px;letter-spacing:.04em}

/* THE NAV ITSELF. It scrolls inside the column when the list outgrows the window, so the
   brand above it and the identity below it never move. */
/* min-height:0 is the other half of the fix, and it is not optional. A flex item's default
   min-height is `auto`, which means "never shrink below your own content" -- so `flex:1`
   plus `overflow:auto` does NOT produce a scrolling box, it produces a box that grows to
   fit and pushes whatever follows it out of view. That is what put the foot off-screen
   even once the height was right. Same reason it is on .body below. */
.tabs{margin-top:16px;display:flex;flex-direction:column;gap:2px;
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tabs button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:0;color:#cfe0ff;padding:9px 11px;border-radius:9px;
  font-size:13px;font-weight:600;cursor:pointer}
/* The icon is how somebody finds a tab in a list of fourteen -- the shape registers before
   the word does, which is the entire reason for carrying them. */
.tabs button svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.tabs button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button.on{background:#fff;color:var(--b800)}
.tabs button.on svg{opacity:1}
/* Quiet labels, not switches. Fourteen tabs in one undifferentiated column is a list you
   read every time; four short groups is a list you learn once and then aim at. */
.navhead{padding:14px 11px 4px;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--b300);text-transform:uppercase}

/* WHO YOU ARE AND THE WAYS OUT, at the foot of the column. These used to ride in the top
   bar competing with the work; down here they are found when looked for and ignored
   otherwise, which is the right weight for something used twice a day. */
.side .foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px}
.side .foot b{color:#fff;font-size:12.5px;display:block}
.side .foot span{font-size:11px;color:var(--b300);display:block;margin-bottom:8px}
.side .foot a,.side .foot button{display:block;width:100%;text-align:center;margin-top:6px;
  font-size:12px;padding:8px;border-radius:8px;text-decoration:none;
  background:rgba(255,255,255,.1);color:#fff;border:0;cursor:pointer;font-weight:600}
.side .foot a:hover,.side .foot button:hover{background:rgba(255,255,255,.18)}

main.main{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
/* Plain padding. Keeping the page clear of the clock is the WRAPPER's job -- it hands this
   page a viewport that already starts below the status bar, which is why the
   env(safe-area-inset-top) that briefly sat in this rule resolved to 0 and changed nothing.
   See the note on header.top in call.html, and MainActivity for the actual fix. */
.top{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;
  display:flex;align-items:center;gap:10px;flex:0 0 auto}
.top h1{margin:0;font-size:16.5px;font-weight:800;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* A hairline that slides across while the screen you are already reading is brought up to
   date behind you -- instead of wiping the pane to a spinner on every click. You keep your
   place and the numbers change under you when they are ready. */
.busy{height:2px;background:transparent;overflow:hidden;flex:0 0 auto}
.busy.on{background:var(--b100)}
.busy.on::after{content:'';display:block;height:100%;width:40%;background:var(--b600);
  animation:hoopbz 1.1s ease-in-out infinite}
@keyframes hoopbz{0%{margin-left:-40%}100%{margin-left:100%}}
/* The ONLY thing on the page that scrolls -- see the min-height:0 note on .tabs. */
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 18px 60px}

/* The three lines open and close the column -- everywhere. Closed, the work takes the width. */
#navBtn{flex:0 0 auto;font-size:17px;line-height:1;padding:7px 11px}
body.nav-closed aside.side{display:none}
.navBack{display:none}
@media(max-width:760px){
  /* On a phone the open nav is a drawer OVER the page, with a backdrop that closes it. */
  /* The column does NOT scroll as a whole here either -- .tabs does, inside it. Letting the
     aside scroll too would carry the foot away with the list, which is the same complaint
     one level down: Logout has to stay where the thumb expects it. */
  aside.side{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:20;
    overflow:hidden;box-shadow:8px 0 30px -12px rgba(8,28,74,.45)}
  body:not(.nav-closed) .navBack{display:block;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:15}
  .body{padding:12px 10px 60px}
  .top{padding:10px 12px}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
/* TWO PANELS, SIDE BY SIDE -- HOPE's .pair, brought over. The breakpoint is 1000px rather
   than the shell's 760px on purpose: two charts crammed into a 900px tablet are worse than
   one above the other, and the point of pairing them is to see both at once, which stops
   being true well before the layout technically stops fitting. */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
/* A GRID ITEM'S AUTOMATIC MINIMUM IS ITS CONTENT, so one wide child inside a 1fr track
   does not overflow -- it widens the track, unbalances the pair and grows the page a
   horizontal scrollbar. min-width:0 lets the track hold its share, and the overflow-x on
   .card is what the content then scrolls inside instead. HOPE gets this from .card having
   overflow:hidden; being explicit about it here says why it cannot be removed. */
.pair>*{min-width:0}
.pair>.card{overflow-x:auto}
@media(max-width:1000px){ .pair{grid-template-columns:1fr} }
/* Tighter tiles for a card that only has half a row. The page-level .tiles minimum of
   150px needs 470px for three across, which a half column does not have until roughly
   1150px -- so between the breakpoint and there, three tiles broke to 2 + 1 orphan. */
.pair .tiles{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
/* A CHART MAY SCALE DOWN, NEVER UP.
   An SVG with viewBox + width:100% and no ceiling grows without limit, so once the shell
   stopped capping the page at 1120px these charts were stretched across the whole monitor
   -- every label blown up with them. That is the "zoomed too much". The cap is the chart's
   own natural size: below it the drawing shrinks as it always did, above it it simply
   stops and centres, and the text stays the size it was designed at. */
.chartwrap{width:100%;max-width:560px;margin:0 auto}
.chartwrap svg{display:block;width:100%;height:auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.14)}
.tile .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:800;margin-top:4px}
.tile .s{font-size:11px;color:var(--soft);margin-top:2px}
/* A TILE THAT IS A DOOR. A number with no way through to the rows behind it is where every
   "where does this come from?" starts, so the ones that HAVE a list say so and open it. The
   affordance has to be visible without a hover -- half these screens are read on a phone,
   where there is no such thing -- hence the standing "fungua ›" line rather than a cursor
   change alone. .on marks the tile whose list is currently showing. */
.tile.go{cursor:pointer;transition:transform .08s ease,box-shadow .12s ease,border-color .12s ease}
.tile.go:hover{border-color:var(--b300);box-shadow:0 6px 16px -6px rgba(11,42,107,.3);transform:translateY(-1px)}
.tile.go:focus-visible{outline:2px solid var(--b600);outline-offset:2px}
.tile.go.on{border-color:var(--b600);box-shadow:0 0 0 1px var(--b600) inset}
.tile .gox{font-size:10px;font-weight:800;color:var(--b600);margin-top:7px;text-transform:uppercase;letter-spacing:.04em}
.tile.go.on .gox::after{content:' ✓'}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.12)}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--b50);color:var(--b900);font-size:10.5px;text-transform:uppercase;cursor:pointer;user-select:none}
th[data-sd="a"]::after{content:" \2191"}
th[data-sd="d"]::after{content:" \2193"}
td.r,th.r{text-align:right}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row .inp{width:auto;flex:1;min-width:120px}
.mut{color:var(--mut);font-size:12.5px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.08em}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;display:none;z-index:9}
.toast.bad{background:var(--bad)}
.road li{margin-bottom:8px;line-height:1.5}
@media(max-width:640px){ th,td{padding:7px 6px} }

/* ===================================================================================
   THE EDGES -- ported from HOPE's portal on the owner's instruction:
     "Please check in Hope and upgrade Hoop's -- mainly the system interface"

   LAST IN THE FILE ON PURPOSE, and every selector is at most as specific as the rule
   it softens, so anything already carrying its own colour keeps it.

   What actually makes HOPE's panes look finished is not a bigger shadow -- it is TWO
   shadow layers plus an inset highlight. The tight layer grounds the panel on the page,
   the wide soft layer lifts it, and the 1px inset white along the top edge catches the
   light. One flat drop shadow (which is what this file had, twice) reads as a rectangle
   with a smudge under it; these three together read as a raised surface. */
:root{
  --gr:16px;                                            /* panels */
  --gr-sm:12px;                                         /* tiles and controls */
  --gline:rgba(15,23,42,.09);
  --ghi:inset 0 1px 0 rgba(255,255,255,.85);            /* the light along the top edge */
  --gsh:0 1px 1.5px rgba(8,28,74,.045), 0 10px 26px -16px rgba(8,28,74,.30);
  --gsh-sm:0 1px 1px rgba(8,28,74,.04), 0 5px 14px -10px rgba(8,28,74,.26);
  /* The hairlines the status colours were missing -- see .chip below. */
  --okline:#CFEADD; --warnline:#F6E3BC; --badline:#F6CFCB;
}
/* Panels. HOOP's .tile does HOPE's .kpi job under a different name. */
.card{border-color:var(--gline);border-radius:var(--gr);box-shadow:var(--gsh),var(--ghi)}
.tile{border-color:var(--gline);border-radius:var(--gr-sm);box-shadow:var(--gsh-sm),var(--ghi)}
/* Controls -- rounder, to match the panels they sit on. Nothing else about them changes. */
.btn{border-radius:12px}
.btn.sm{border-radius:11px}
.inp{border-radius:11px}

/* A CHIP NEEDS ITS HAIRLINE. A flat fill on a white card has no edge, so the colour
   floats on the surface; the matching line is what makes it read as a token you can
   trust rather than a highlighter mark. */
.chip{border:1px solid var(--line)}
.chip.ok{border-color:var(--okline)}
.chip.bad{border-color:var(--badline)}
.chip.warn{border-color:var(--warnline)}

/* A row that answers the pointer is how an eye follows one customer across eight columns. */
tbody tr:hover{background:var(--b50)}
/* The totals line, weighted so the eye stops at it. HOPE's .totrow -- same name, same job. */
tr.totrow td{font-weight:800;background:var(--b50);border-top:2px solid var(--b100)}

/* =====================================================================================
   A CELL THAT IS ITS OWN BAR.

     "I intended to see graphs but the bars are killing it better use numbers within
      b/se the variance of the lenghts makes them ugly"

   Every cell is now exactly the same size and the reading comes from its TINT, so a week
   is seven equal blocks -- no stubs beside full-height blocks, nothing ragged. The number
   lives inside where it can be read rather than inferred, with the percentage under it in
   small type for the glance. The height is fixed rather than content-driven so four
   officers' rows line up down the page even when one of them has a blank day.
   ===================================================================================== */
.credCell{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:38px;border-radius:7px;background:var(--b50);font-size:12px;line-height:1.15}
.credCell b{font-weight:700}
.credCell .credSub{font-size:9.5px;opacity:.75;margin-top:1px}

/* One class for the sideways scroll every wide table needs, instead of inline overflow
   repeated at sixteen call sites. */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* THE THREE STATES A PANE CAN BE IN, so they stop being hand-written per screen and
   stop disagreeing with each other ("Loading…" here, "Inapakia…" there). */
.sk{width:26px;height:26px;border:3px solid var(--b100);border-top-color:var(--b600);
  border-radius:50%;animation:hoopspin .8s linear infinite;margin:22px auto}
@keyframes hoopspin{to{transform:rotate(360deg)}}
.msg{padding:30px 18px;text-align:center;color:var(--mut);font-size:13px}
.msg.bad{color:var(--bad)}
.note{margin:0 0 12px;padding:10px 13px;border:1px solid var(--line);
  border-left:3px solid var(--b600);border-radius:var(--gr-sm);
  color:var(--mut);font-size:12.5px;background:var(--card)}
.note.bad{border-left-color:var(--bad)}

/* The drawer SLIDES instead of snapping, and its backdrop is real glass rather than a
   flat wash. Scoped to the phone breakpoint: on a desktop "closed" still means the nav
   is gone and the work takes the width, which is what display:none above is for. */
@media(max-width:760px){
  aside.side{border-radius:0 18px 18px 0;transition:transform .2s ease}
  body.nav-closed aside.side{display:flex;transform:translateX(-100%)}
  body:not(.nav-closed) .navBack{-webkit-backdrop-filter:blur(14px) saturate(120%);
    backdrop-filter:blur(14px) saturate(120%)}
}

/* =====================================================================================
   THE DRAWER -- and an apology in code form.

   Four screens in this file already CALLED drawer(): the device enrolment form, the batch
   of provisioning tokens, and both token read-backs. Nothing ever defined it. Every one of
   those buttons threw ReferenceError and did nothing at all, which means the Devices pane
   shipped unable to enrol a single phone. A syntax check parses the file and says fine; it
   cannot know that a name was never bound. Ported from HOPE, where it has always lived.
   ===================================================================================== */
.drawer-bg{position:fixed;inset:0;background:rgba(8,17,34,.45);display:none;z-index:60;
  align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%)}
.drawer{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:16px;box-shadow:0 -18px 50px -24px rgba(8,28,74,.55)}
.drawer h3{margin:0 0 4px;font-size:16px}
.drawer .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink)}
/* The customer's facts, label left and value right -- HOPE's .facts, brought over with the
   panel it belongs to. A run of "Agent: X · Guarantor: Y" sentences is read line by line;
   two aligned columns are scanned, which is what somebody does with a phone to their ear. */
.facts{background:var(--card);border:1px solid var(--gline);border-radius:var(--gr-sm);
  padding:12px;margin-bottom:12px;box-shadow:var(--gsh-sm),var(--ghi)}
.frow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:12.5px}
.frow:last-child{border-bottom:0}
.frow span:first-child{color:var(--mut)}
.frow b,.frow a{text-align:right;word-break:break-word}

/* The tip, bottom right: present enough to be read, quiet enough to be ignored. */
#tip{position:fixed;right:18px;bottom:18px;max-width:330px;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--b500);border-radius:var(--gr);
  padding:12px 14px;font-size:12.5px;color:var(--ink);
  box-shadow:0 14px 34px -18px rgba(8,28,74,.6);opacity:0;transform:translateY(12px);
  transition:all .3s ease;pointer-events:none;z-index:70}
#tip.show{opacity:1;transform:none}

/* The bell's unread count. A dot nobody can read is a dot nobody looks at. */
.bell{position:relative}
.bell b{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;
  border-radius:999px;font-size:10px;line-height:1;padding:3px 5px;min-width:16px;font-weight:800}
.nrow{display:block;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.nrow.new{background:var(--b50);margin:0 -16px;padding-left:16px;padding-right:16px}
.nrow .m{color:var(--mut);font-size:11.5px;margin-top:2px}

/* =====================================================================================
   DARK MODE -- one class on <body>; every colour in this file already comes from the
   variables above, so the whole system flips by redefining eleven of them. The panes did
   not need to know it exists, which is exactly why it is worth having.
   ===================================================================================== */
body.dark{--bg:#0B1120;--card:#131C2E;--line:#22304A;--ink:#E5EAF2;--mut:#8B9AB3;--soft:#64748B;
  --b50:#16233C;--b100:#22304A;--b900:#060D1C;--b950:#040914;

<script>
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* =====================================================================================
   EVERY TILE IS A DOOR -- one helper, so all forty behave alike.

     "the widgets in dashboard, sales and stock; in recovery; fraud audit; all stock;
      devices: - should be clickable to open the description/link to their specified
      data lists"

   A headline number with no way through to its rows is where every "where does this come
   from?" begins, and answering that by hand is how a figure loses an argument it was right
   about. So a tile that HAS a list carries it.

   THREE KINDS OF DOOR, because the three honest answers are different:
     another pane   the rows live somewhere that already draws them well (Wateja, Recovery,
                    Mauzo). Set that pane's own filter, then goTab -- never a second copy
                    of a table that already exists.
     filter in place  the rows are already on this screen and the tile is one slice of them
                    (Devices by state, Fraud audit by status). Toggle, and mark the tile.
     sort in place  every column of the table below IS one of the tiles (Stock
                    accountability, Call reports). The tile answers "who" by bringing the
                    worst to the top rather than hiding anybody.

   A tile with no honest destination stays a plain tile. Sending somebody to a screen that
   does not actually contain the number they clicked is worse than not being clickable.

   The closures live in TILEGO, indexed by the data-go attribute rather than inlined as
   onclick strings -- an IMEI or a holder's name in an onclick= is one apostrophe away from
   a broken pane, and this page builds all its HTML by concatenation. */
var TILEGO=[];
function tile(label,value,sub,o){
  o=o||{};
  var go=o.go?(' data-go="'+(TILEGO.push(o.go)-1)+'" tabindex="0" role="button"'):'';
  return '<div class="tile'+(o.go?' go':'')+(o.on?' on':'')+'"'+go+'>'
    +'<div class="l">'+esc(label)+'</div>'
    +'<div class="v"'+(o.color?' style="color:var(--'+o.color+')"':'')+'>'+value+'</div>'
    +(sub?'<div class="s">'+sub+'</div>':'')
    +(o.go?'<div class="gox">'+esc(o.cta||(o.on?'imefunguliwa':'fungua ›'))+'</div>':'')
    +'</div>';
}
/** Call after any innerHTML that contains tiles -- including a box filled in later. */
function wireTiles(root){
  $all('[data-go]',root).forEach(function(el){
    var fn=TILEGO[Number(el.getAttribute('data-go'))];
    if(!fn) return;
    el.onclick=fn;
    // Keyboard, because these are buttons in everything but tag name.
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fn(); } };
  });
}
/** Open another pane with its own filter already set. */
function goWith(tab,set){ if(set) set(); goTab(tab); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pct(x){ return (x==null||isNaN(x))?'—':Math.round(100*x)+'%'; }
function fmtDur(sec){ sec=Math.max(0,Math.round(Number(sec)||0)); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=function(n){return(n<10?'0':'')+n;}; return h>0?(h+':'+p(m)+':'+p(s)):(m+':'+p(s)); }
/* THE CLOCK, NOT AN AGE.
   -----------------------------------------------------------------------------------------
     "you said you'll 00:00:00 for last pinged so as we see actual time"

   An age answers "how long ago"; it does not answer "was that before or after I pressed the
   button", which is the only question anybody actually asks of this column. "4 dk" beside an
   order given "4 dk" ago leaves you guessing at the order of two events four minutes apart.
   A wall clock does not: 14:06:31 against 14:06:12 is settled at a glance.

   Fed epoch milliseconds from the server, never a string. A timestamp text without a zone is
   read as LOCAL by the browser and as UTC by the server, so the same row would tell Dar es
   Salaam a time three hours out. The number cannot be misread. */
function clock(ms){
  if(!ms) return '';
  var d=new Date(Number(ms)); if(isNaN(d.getTime())) return '';
  var p=function(n){ return (n<10?'0':'')+n; };
  var t=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  var n=new Date();
  var today=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return today?t:(p(d.getDate())+'/'+p(d.getMonth()+1)+' '+t);
}
/** Minutes as a person says them. One definition, so two columns cannot drift apart. */
function agoMins(n){ return n==null?'':n<1?'sasa hivi':n<60?money(n)+' dk':money(Math.round(n/60))+'h'; }
/* WHERE IT WAS, UNDER WHAT IT SAYS IT IS.
   =========================================================================================
     "the management gets headache on aged stock [stolen, lost, sold-by-cash etc] am asked if
      the app could trap last sync with location coordinates and put its link under simu
      inasema like locked + link"

   The accountability report can already name the handsets nobody can account for; it could
   never say where one of them is. So an unaccounted IMEI ended in a phone call and somebody's
   word about what happened. A link turns it into a place to go -- and often into evidence
   that a phone booked as sold-by-cash has not left one shop in three weeks.

   THE AGE IS NOT OPTIONAL, and it is why this is a function rather than an anchor tag. The
   phone reports the position the system ALREADY had -- no GPS wake, no battery, no delay to
   the beat -- so a handset that spoke a minute ago can be carrying a fix from Tuesday. A pin
   with no date is not information, it is a wrong address somebody drives to. Same reason the
   accuracy shows when it is coarse: 2km is a suburb, not a doorway.

   Nothing at all when there is no fix, rather than a dash or an empty link: a row that has
   never reported a position should look like a row with one fact in it, not two. */
function devWhere(r){
  if(r.lat==null||r.lng==null) return '';
  var q=Number(r.lat).toFixed(6)+','+Number(r.lng).toFixed(6);
  var when=r.locAt?clock(r.locAt):'';
  var acc=(r.locAcc!=null&&r.locAcc>=500)?' ±'+money(Math.round(r.locAcc/1000*10)/10)+'km':'';
  return '<div style="font-size:10px;margin-top:2px">'
    +'<a href="https://www.google.com/maps?q='+encodeURIComponent(q)+'" target="_blank" '
    +'rel="noopener noreferrer">ilipo / map</a>'
    +(when?'<span class="mut"> · '+esc(when)+esc(acc)+'</span>':'')
    +'</div>';
}
function telHref(v){ var d=String(v==null?'':v).replace(/\D/g,''); if(!d) return '#'; return d.indexOf('255')===0?'+'+d:'+255'+d.replace(/^0+/,''); }
function toast(m,bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':''); t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3500); }

/* =======================================================================================
   LANGUAGE, THEME, TIPS, NOTIFICATIONS -- the four HOPE carries in its top bar.

   ON LANGUAGE, honestly: most of this system speaks both at once ("Wateja / Customers"),
   which is right inside a pane where the two readings sit beside each other. It is wrong in
   a 236px nav column, where doubling every label is what forces the ellipsis. So the switch
   does a real job here -- it picks ONE side for the nav and the page title, and leaves the
   panes bilingual, where the room exists and the pairing helps.
   ======================================================================================= */
var LANG='sw';
try{ LANG=localStorage.getItem('hpLang')==='en'?'en':'sw'; }catch(e){}
function applyLang(l){
  LANG=(l==='en')?'en':'sw';
  try{ localStorage.setItem('hpLang',LANG); }catch(e){}
  var b=$('#langBtn'); if(b) b.textContent=(LANG==='sw')?'SW':'EN';
  if(BOOT&&BOOT.navs){ buildNav(); var n=tabMeta(TAB); if(n) $('#title').textContent=navLabel(n); }
}
function applyTheme(dark){
  document.body.classList.toggle('dark',!!dark);
  try{ localStorage.setItem('hpTheme',dark?'dark':'light'); }catch(e){}
  var b=$('#themeBtn'); if(b) b.innerHTML=dark?'&#9788;':'&#9789;';
}
/* Set before sign-in too, so the code box is not a white flash for somebody working at
   night -- the theme belongs to the person, not to the session. */
(function(){ try{ if(localStorage.getItem('hpTheme')==='dark') document.body.classList.add('dark'); }catch(e){} })();

/* TIPS. Short notes from the `hints` table, shown for the tab you are on. Deliberately a
   corner toast that fades rather than anything you must dismiss: a hint you have to close
   is an interruption, and people learn to kill those without reading them. */
var TIPS=null, TIPTIMER=null, TIPHIDE=null, TIPEVERY=240, TIPHOLD=7;
function tipsStart(){
  srv('hints').then(function(h){
    TIPS=h.tips||{};
    TIPEVERY=Number(h.everySec)||240; TIPHOLD=Number(h.holdSec)||7;
    clearInterval(TIPTIMER);
    setTimeout(tipShow,3000);
    TIPTIMER=setInterval(function(){ tipShow(); },Math.max(30,TIPEVERY)*1000);
  }).catch(function(){ /* tips are never the reason a screen fails */ });
}
function tipShow(force){
  var el=$('#tip'); if(!el||!TIPS) { if(force) toast(LANG==='en'?'No tips yet.':'Hakuna vidokezo bado.'); return; }
  var byLang=TIPS[LANG]||TIPS.sw||TIPS.en||{};
  var pool=(byLang[TAB]||[]).concat(byLang.all||[]);
  if(!pool.length){ if(force) toast(LANG==='en'?'No tip for this screen.':'Hakuna kidokezo cha skrini hii.'); return; }
  el.textContent=pool[Math.floor(Math.random()*pool.length)];
  el.classList.add('show');
  clearTimeout(TIPHIDE);
  TIPHIDE=setTimeout(function(){ el.classList.remove('show'); },Math.max(3,TIPHOLD)*1000);
}

/* THE BELL -- how a supervisor learns an officer logged something without opening the tab.
   Stored UTC, read in East Africa; one helper so the bell and the tables cannot disagree. */
function eatDt_(v){
  var t=Date.parse(v);
  if(isFinite(t)) return new Date(t+3*3600000).toISOString().replace('T',' ').slice(0,16);
  return String(v==null?'':v).replace('T',' ').slice(0,16);
}
var NOTIF=null;
function bellRefresh(){
  return srv('notifications').then(function(d){
    NOTIF=d;
    var b=$('#bellBtn'); if(!b) return;
    b.innerHTML='&#128276;'+(d.unseen?'<b>'+(d.unseen>99?'99+':d.unseen)+'</b>':'');
  }).catch(function(){ /* the bell is never the reason a screen fails */ });
}
function bellOpen(){
  var d=NOTIF||{items:[]};
  var items=d.items||[];
  drawer('<h3>Taarifa / Notifications</h3>'
    +'<div class="sub">Maoni ya ufuatiliaji ya timu zako. / Follow-up comments from your own teams.</div>'
    +'<div style="max-height:60vh;overflow:auto">'
    +(items.length?items.map(function(i){
        return '<div class="nrow'+(i.unseen?' new':'')+'">'
          +'<b>'+esc(i.who||i.imei||'')+'</b>'+(i.status?' — '+esc(i.status):'')
          +'<div>'+esc(i.what||'')+'</div>'
          +'<div class="m">'+esc(i.team||'')+' · '+esc(i.by||'')+' · '+esc(eatDt_(i.at))+'</div></div>';
      }).join('')
      :'<div class="mut">Hakuna kipya. / Nothing new.</div>')
    +'</div>'
    +(d.unseen?'<button class="btn w" id="notifSeen" style="margin-top:10px">Nimesoma zote / Mark all read</button>':''));
  var b=$('#notifSeen');
  if(b) b.onclick=function(){
    srv('notifSeen',{}).then(function(){ closeDrawer(); bellRefresh(); })
      .catch(function(e){ toast(String(e.message||e),true); });
  };
}

/* THE DRAWER. Four screens in this file already called this; nothing defined it, so the
   device enrolment form and every token read-back threw and did nothing. Ported from HOPE
   verbatim, including the Close button it appends for you -- a sheet on a phone with no
   visible way out is a trap, and not every caller remembers to add one. */
function drawer(html){
  $('#drawer').innerHTML = html
    + '<button class="btn ghost w" style="margin-top:8px" onclick="closeDrawer()">Funga / Close</button>';
  $('#drawerBg').style.display='flex';
  $('#drawer').scrollTop=0;        // a reopened drawer starts at the top, not where the last one ended
  fitPanelToKeyboard_('drawerBg');
}
function closeDrawer(){
  var bg=$('#drawerBg');
  bg.style.display='none';
  /* Clear what fitPanelToKeyboard_ set. Without this a drawer opened later inherits the
     height the keyboard forced on this one and opens as a letterbox. */
  bg.style.height=''; bg.style.minHeight=''; bg.style.top='';
}
$('#drawerBg').onclick=function(e){ if(e.target===$('#drawerBg')) closeDrawer(); };
/* Esc closes it, same as tapping outside. At a desk that is the reflex, and a panel that
   ignores it reads as stuck. */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#drawerBg').style.display==='flex') closeDrawer();
});

/* THE THREE STATES A PANE CAN BE IN, in one place.

   Ported from HOPE (app.html loading()/failed()) with the owner's instruction to bring
   HOOP's interface up to it. Before this, every screen hand-wrote its own -- thirteen
   spellings of "loading" split between English and Swahili, and fifteen catch blocks
   that printed the server's raw words.

   THAT SECOND ONE WAS NOT A COSMETIC PROBLEM. A backend error came out as a page of JSON
   on the screen, which is unreadable and alarming -- and it put customer names and phone
   numbers in front of whoever happened to be standing there. Anything that looks like raw
   data is now dropped and logged to the console instead of shown. */
function paneLoading(m, title){
  if(!m) return;
  m.innerHTML='<div class="card">'+(title?'<h2>'+esc(title)+'</h2>':'')+'<div class="sk"></div></div>';
}
/** Is this the APK, rather than a browser? The bridge is injected by the Android wrapper
    (the same object HOOPLOAN Calls reads its device id from), so its presence IS the proof --
    a user agent string can be typed by anyone, an injected object cannot. */
function fromApp_(){
  // Either name: an older handset still exposes HopeCalls. See nativeBridge() in call.html.
  var b = window.HoopLoan || window.HopeCalls;
  return !!(b && b.getDeviceId);
}
function safeErr(e){
  var raw=String((e&&e.message)||e||'');
  var looksLikeData=raw.charAt(0)==='['||raw.charAt(0)==='{'||raw.length>300;
  if(looksLikeData&&window.console) console.error('[hoop] raw failure:', raw.slice(0,2000));
  return looksLikeData
    ? 'Mfumo haukujibu vizuri. Jaribu tena baada ya sekunde chache. / The server did not answer properly \u2014 try again in a few seconds.'
    : raw;
}
function paneFailed(m, e){
  if(!m) return;
  m.innerHTML='<div class="card"><div class="msg bad"><b>Imeshindikana / Could not load.</b><br>'
    +esc(safeErr(e))+'</div></div>';
}
function isoToday(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); var p=function(n){return('0'+n).slice(-2);}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

var CODE='', BOOT=null, TAB='dash';
/* EVERY TABLE EXPORTS TO EXCEL: a button injected above each table automatically, so
   every report in every tab -- including tabs added later -- is born exportable.
   CSV with a BOM: Excel opens it clean, Swahili characters intact. Hidden rows
   (filtered out by a search box or a chip) are NOT exported -- you export what you see. */
/* CELLS MARKED `noxl` ARE CONTROLS, NOT DATA, and they are dropped here. A tick box exports
   as an empty column and a row of action buttons exports as the words "Token Historia Futa"
   -- so a Devices export opened in Excel arrived with a blank first column and a nonsense
   last one, and somebody has to tidy every sheet by hand before it can be sent to anyone.
   Marking the cell is better than guessing at the content: a column that legitimately holds
   the word "Futa" would be indistinguishable otherwise. */
/* A CELL WITH A SUB-LINE IS TWO FACTS, and textContent runs them together. Several columns
   now carry a small second line under the main one -- the beat's clock over its age, the
   order's time over who gave it -- and `td.textContent` returns "14:06:314 dk", because a
   <div> boundary is not whitespace. It reads as a corrupt number in Excel rather than as two
   values, which is worse than either of them alone. So block children are separated here. */
function cellText_(td){
  var s='';
  [].slice.call(td.childNodes).forEach(function(n){
    if(n.nodeType===1&&/^(DIV|BR|P|LI|TR)$/.test(n.nodeName)) s+=' ';
    s+=(n.textContent||'');
  });
  return s.replace(/\s+/g,' ').trim();
}
function csvOfTable_(t){
  var out=[];
  [].slice.call(t.rows).forEach(function(tr){
    if(tr.style.display==='none'||tr.classList.contains('fhide')) return;
    var cells=[].slice.call(tr.cells).filter(function(td){
      return !td.classList.contains('noxl');
    }).map(function(td){
      return '"'+cellText_(td).replace(/"/g,'""')+'"';
    });
    if(cells.length) out.push(cells.join(','));
  });
  return '\ufeff'+out.join('\r\n');
}
function expName_(ext){
  var d=new Date(),p=function(n){return ('0'+n).slice(-2);};
  return 'HOOP-'+(TAB||'report')+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.'+ext;
}
function xlName_(){ return expName_('csv'); }

/* ONE WAY OUT FOR EVERY EXPORT, and it has to be the phone's way first.
   ---------------------------------------------------------------------------------------------
     "downloading exports able to work in app in a phone too"

   A browser saves a file it built itself by pointing an <a download> at a blob: URL. Inside the
   Android app that is a dead end: the WebView hands blob: to Android's DownloadManager, which
   does not understand the scheme and throws, and the wrapper's fallback then asks the system to
   open that same URL with an ordinary app -- which nothing on the handset can. The old symptom
   was the app simply closing; the wrapper now catches it and says "open the system in Chrome",
   which is honest but still means the officer does not get their file.

   The wrapper has carried HoopLoan.saveBase64 for exactly this the whole time -- it writes the
   bytes into the phone's own Downloads folder through MediaStore -- and nothing on this page
   ever called it. So every export in the system goes through here, bridge first, browser second.
   Not just the newest report: routing it at the one place all the buttons already share means
   Wateja, Devices, Stoo and every pane added later save on a phone too, without being told.

   `data` is either a string (text: CSV) or a Uint8Array (binary: PDF). */
function b64_(data){
  var bytes = typeof data!=='string' ? data
    : (window.TextEncoder ? new TextEncoder().encode(data)
      /* btoa is byte-wise, so a string has to become UTF-8 bytes first or one Swahili
         character throws and the whole export is lost. */
      : new Uint8Array(unescape(encodeURIComponent(data)).split('').map(function(c){ return c.charCodeAt(0); })));
  var s='', CH=0x8000;   // chunked: fromCharCode.apply blows the stack on a long report
  for(var i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}
function saveFile_(name, mime, data){
  var bridge = window.HoopLoan || window.HopeCalls;

  /* RUNG ONE: the wrapper writes it straight into the phone's Downloads folder. */
  if(bridge && typeof bridge.saveBase64==='function'){
    try{
      var r=bridge.saveBase64(name, mime, b64_(data));
      /* The bridge answers "OK <name>" or "ERR <reason>". A save that fails silently is the
         whole reason it reports back at all, so the reason is shown rather than swallowed. */
      if(typeof r==='string' && r.indexOf('ERR')===0) toast(r.slice(4).trim()||'Imeshindikana kuhifadhi', true);

     rung those officers get rung three -- which inside a WebView is a dead end -- so a report
     they could export last week would silently stop coming out. The share sheet keeps the file

  if(bridge && navigator.share){

  var a=document.createElement('a');

/* ---------- A PDF WRITTEN BY HAND, BECAUSE THERE IS NOWHERE TO FETCH ONE FROM ----------
   This portal loads no third-party script -- not one, deliberately -- so "export to PDF" here
   cannot mean pulling jsPDF off a CDN. It is written out instead, and a PDF is a small enough
   format that this is a page of code rather than a library: a catalog, a page tree, two of the
   fourteen fonts every reader on earth already has, and one content stream per page.

   It is worth the page of code because of what these sheets are for. HR's advance report is
   carried to a bank; a CSV is a spreadsheet somebody must still format, while a PDF is the
   document itself -- same columns, same order, header repeated on every page, and it cannot be
   quietly edited between the office and the counter.

   LANDSCAPE, because these tables are wide. The advance report alone is ten columns, and a
   portrait page would truncate half of them into uselessness.

   ONE CAUTION worth stating: the file is assembled as a string whose every character is a
   single byte, because the cross-reference table at the end is a list of BYTE offsets and they
   are counted with .length. That is why pdfEsc_ maps everything outside WinAnsi down to one
   byte rather than letting a stray character through -- a two-byte character would put every
   offset after it out by one and the reader would refuse the file. */
function pdfEsc_(s){
  var out='';
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    /* The base-14 fonts are WinAnsi: ASCII below 127, Latin-1 from 160 up. Anything else has
       no glyph. The few that genuinely appear in these tables are mapped to plain equivalents
       -- an em dash is the empty cell in every table in this file -- and the rest become '?'
       rather than silent noise. */
    if(c===8211||c===8212){ out+='-'; continue; }
    if(c===8216||c===8217){ out+="'"; continue; }
    if(c===8220||c===8221){ out+='"'; continue; }
    if(c===8230){ out+='...'; continue; }
    if(c===8226){ out+='·'; continue; }
    if(c<32||(c>=127&&c<160)||c>255){ out+='?'; continue; }
    if(c===40||c===41||c===92) out+='\\';        // ( ) \ would end the string literal early
    out+=String.fromCharCode(c);
  }
  return out;
}
/* HELVETICA'S REAL WIDTHS, because guessing them shows.
   Character widths live inside the font file, which we are not shipping -- the reader supplies
   Helvetica itself. So the widths have to be known here to place a right-aligned figure or to
   decide where a long comment gets cut, and a rule of thumb does not survive contact with a
   header like BANK/CARRIER NAME: W is 944 units and O is 778, while a lowercase l is 222, so
   any single average is wrong by a factor of four and the column either overlaps its neighbour
   or wastes half the page.
   Three digits per character from space (32) to tilde (126), thousandths of the point size --
   these are the published AFM numbers. Only '@' is rounded, from 1015 down to 999, because it
   does not fit in three digits and does not appear in these tables. */
var HELVW='278278355556556889667191333333389584278333278278'
  +'556556556556556556556556556556'
  +'278278584584584556999'
  +'667667722722667611778722278500667556833722778667778722667611722667944667667611'
  +'278278278469556333'
  +'556556500556556278556556222222500222833556556556556333500278556500722500500500'
  +'334260334584';
function pdfW_(s,size,bold){
  var w=0;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    // Latin-1 accented letters are 556 to 722 in this font; 611 is the middle of that.
    w += (c>=32&&c<=126) ? Number(HELVW.substr((c-32)*3,3)) : 611;
  }
  /* Helvetica-Bold is wider than Helvetica, mostly across the lowercase. Eight per cent over
     the regular table is a shade generous, which is the safe direction to be wrong in: a
     column guessed too wide loses one character to the ellipsis, one guessed too narrow runs
     into the column beside it and the sheet stops being readable at all. */
  return w*(bold?1.08:1)*size/1000;
}
function pdfFit_(s,w,size,bold){
  if(w<=0) return '';
  if(pdfW_(s,size,bold)<=w) return s;
  var t=s;
  while(t.length>1 && pdfW_(t+'..',size,bold)>w) t=t.slice(0,-1);
  return t+'..';
}
function pdfOfTable_(t,title){
  // Same rules as the CSV: hidden rows are not exported, control cells are not data.
  var all=[];
  [].slice.call(t.rows).forEach(function(tr){
    if(tr.style.display==='none'||tr.classList.contains('fhide')) return;
    var cells=[].slice.call(tr.cells).filter(function(td){ return !td.classList.contains('noxl'); });
    if(!cells.length) return;
    all.push({
      head: !!(tr.parentNode && tr.parentNode.nodeName==='THEAD'),
      vals: cells.map(cellText_),
      align: cells.map(function(td){ return td.classList.contains('r')?'r':'l'; }),
    });
  });
  var head = all.filter(function(r){ return r.head; })[0] || all.shift() || {vals:[],align:[]};
  var body = all.filter(function(r){ return r!==head && !r.head; });
  var n = head.vals.length || 1;
  var align = head.align.slice();
  /* The header cell is not always the one marked right-aligned; the figures under it are. Take
     the stronger claim from the first data row so money lines up on a printed sheet. */
  if(body.length) body[0].align.forEach(function(a,i){ if(a==='r') align[i]='r'; });
  while(align.length<n) align.push('l');

  var W=842, H=595, M=26, AVAIL=W-2*M;            // A4 landscape, in points
  var FS=7.2, HFS=7.8, RH=12.2, TOP=H-M-28, BOT=M+14;

  /* Column widths in proportion to what is actually in them, but capped: one long comment must
     not squeeze nine other columns down to nothing. */
  var nat=[], i, j;
  for(i=0;i<n;i++){
    var wd=pdfW_(String(head.vals[i]||''),HFS,true);
    for(j=0;j<body.length;j++) wd=Math.max(wd,pdfW_(String(body[j].vals[i]||''),FS,false));
    nat.push(Math.min(wd+8, AVAIL*0.26));
  }
  /* NO COLUMN IS NARROWER THAN ITS OWN HEADING, when the page can afford it. Proportional
     widths alone truncated BANK/CARRIER NAME down to "BANK/CARRIER N..", because the cells
     under it say M-Pesa and the arithmetic only saw short content. A clipped heading costs far
     more than a clipped comment: the heading is what tells the reader which figure they are
     looking at, and this sheet is carried to a bank by somebody who did not build it. */
  var floors=[];
  for(i=0;i<n;i++) floors.push(Math.min(pdfW_(String(head.vals[i]||''),HFS,true)+7, AVAIL*0.22));
  // Unless there are so many headings they will not fit at full width, in which case a table
  // that fits beats a heading that reads.
  if(floors.reduce(function(a,b){ return a+b; },0)>AVAIL) floors=floors.map(function(){ return 26; });

  var tot=nat.reduce(function(a,b){ return a+b; },0)||1;
  var cw=nat.map(function(v,ci){ return Math.max(floors[ci], v*AVAIL/tot); });
  // Those floors can push the row wider than the page; take the excess back off the roomy ones.
  var over=cw.reduce(function(a,b){ return a+b; },0)-AVAIL;
  if(over>0){
    var slack=cw.reduce(function(a,v,ci){ return a+Math.max(0,v-floors[ci]); },0)||1;
    cw=cw.map(function(v,ci){ return v-over*Math.max(0,v-floors[ci])/slack; });
  }
  var x=[M]; for(i=0;i<n;i++) x.push(x[i]+cw[i]);

  var cell_=function(txt,ci,y,size,font){
    var bold=font==='/F2';
    var s=pdfFit_(String(txt==null?'':txt), cw[ci]-6, size, bold);
    var tx = align[ci]==='r' ? x[ci]+cw[ci]-3-pdfW_(s,size,bold) : x[ci]+3;
    return 'BT '+font+' '+size+' Tf '+tx.toFixed(1)+' '+y.toFixed(1)+' Td ('+pdfEsc_(s)+') Tj ET';
  };

  var perPage=Math.max(1, Math.floor((TOP-BOT-RH)/RH));
  var pages=[];
  for(i=0;i<body.length;i+=perPage) pages.push(body.slice(i,i+perPage));
  if(!pages.length) pages.push([]);

  var now=new Date(), p2=function(v){ return (v<10?'0':'')+v; };
  var stamp=p2(now.getDate())+'/'+p2(now.getMonth()+1)+'/'+now.getFullYear()
    +' '+p2(now.getHours())+':'+p2(now.getMinutes());

  var streams=pages.map(function(rows,pi){
    var o=[], y=TOP;
    o.push('BT /F2 12 Tf 0 0 0 rg '+M+' '+(H-M-8)+' Td ('+pdfEsc_('HOOPLOAN — '+title)+') Tj ET');
    o.push('BT /F1 7.5 Tf 0.35 0.35 0.35 rg '+M+' '+(H-M-20)+' Td ('
      +pdfEsc_(stamp+'  ·  ukurasa '+(pi+1)+'/'+pages.length+'  ·  safu '+body.length)+') Tj ET');
    // The header is repeated on every page: page four of a bank run is unreadable without it.
    o.push('0.90 0.92 0.95 rg '+M+' '+(y-3).toFixed(1)+' '+AVAIL.toFixed(1)+' '+RH+' re f');
    o.push('0 0 0 rg');
    for(var c=0;c<n;c++) o.push(cell_(head.vals[c],c,y+0.5,HFS,'/F2'));
    y-=RH;
    rows.forEach(function(r,ri){
      if(ri%2===1){
        o.push('0.965 0.965 0.965 rg '+M+' '+(y-3).toFixed(1)+' '+AVAIL.toFixed(1)+' '+RH+' re f');
        o.push('0 0 0 rg');
      }
      for(var c2=0;c2<n;c2++) o.push(cell_(r.vals[c2],c2,y+0.5,FS,'/F1'));
      y-=RH;
    });
    return o.join('\n');
  });

  /* Objects 1-4 are fixed; each page then adds a page object and its content stream, so page q
     is object 5+2q and its stream 6+2q. */
  var objs=[], ids=pages.map(function(_,q){ return 5+q*2; });
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('<< /Type /Pages /Count '+pages.length+' /Kids ['
    +ids.map(function(id){ return id+' 0 R'; }).join(' ')+'] >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  streams.forEach(function(sc,q){
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] '
      +'/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+q*2)+' 0 R >>');
    objs.push('<< /Length '+sc.length+' >>\nstream\n'+sc+'\nendstream');
  });

  var out='%PDF-1.4\n', offs=[];
  objs.forEach(function(b,idx){ offs.push(out.length); out+=(idx+1)+' 0 obj\n'+b+'\nendobj\n'; });
  var xref=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  offs.forEach(function(o){ out+=('0000000000'+o).slice(-10)+' 00000 n \n'; });
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  var bytes=new Uint8Array(out.length);
  for(i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&0xff;
  return bytes;
}

function injectExports_(){

        var b=document.createElement('button');
        b.textContent='\u2913 Excel'; b.className='btn sm ghost'; b.style.cssText='font-size:11.5px;padding:5px 10px';
        b.onclick=function(){
          saveFile_(expName_('csv'),'text/csv;charset=utf-8',csvOfTable_(t));
        };
        var p=document.createElement('button');
        p.textContent='\u2913 PDF'; p.className='btn sm ghost'; p.style.cssText='font-size:11.5px;padding:5px 10px';
        p.onclick=function(){
          var n=(typeof tabMeta==='function'&&tabMeta(TAB))?navLabel(tabMeta(TAB)):(TAB||'Ripoti');
          saveFile_(expName_('pdf'),'application/pdf',pdfOfTable_(t,n));
        };
        bar.appendChild(b); bar.appendChild(p);
        /* ABOVE THE SCROLL BOX, NOT INSIDE IT. A wide table lives in a `.scroll` div, and a
           button placed next to the table scrolls sideways with it -- so on a phone the
           export buttons for the widest tables in the system, which are exactly the ones
           worth exporting, slide off the left edge as soon as you look at the last column. */
        var host=t.parentNode, box=(host&&host.classList&&host.classList.contains('scroll'))?host:null;
        if(box&&box.parentNode) box.parentNode.insertBefore(bar,box);
        else host.insertBefore(bar,t);

    }
    // The tick-list funnel on every header -- group any table by one agent, one
    // branch, one status. Injected here so tables added later get it for free.
    if(t.tHead) $all('th',t.tHead).forEach(function(th){
      if(th.querySelector('.thfilt')) return;
      var s=document.createElement('span');
      s.className='thfilt'; s.textContent='\u23f7'; s.title='Chuja / filter this column';
      th.appendChild(s);
    });
  });
}
new MutationObserver(function(){ injectExports_(); }).observe(document.body,{childList:true,subtree:true});

/* EVERY TABLE SORTS ITSELF: click a header to sort by that column, click again to flip.
   Delegated once on the document, so every table -- including ones added later -- gets
   it for free. Numbers sort as numbers (commas, %%, leading figures like "3 (25%%)"),
   ties and text fall back to text; ISO dates are zero-padded so text order IS date
   order. Row click-handlers survive: sorting moves the same nodes. */
document.addEventListener('click', function(e){
  // The funnel and its menu belong to the FILTER, not the sort.
  if (e.target.closest && (e.target.closest('.thfilt') || e.target.closest('#fltMenu'))) return;
  var th = e.target.closest ? e.target.closest('th') : null;
  if (!th) return;
  var table = th.closest('table'); if (!table) return;
  var tbody = table.querySelector('tbody'); if (!tbody) return;
  var ths = [].slice.call(th.parentNode.children);
  var idx = ths.indexOf(th); if (idx < 0) return;
  var rows = [].slice.call(tbody.children).filter(function(r){ return r.children.length > 1; });
  if (rows.length < 2) return;
  var dir = th.getAttribute('data-sd') === 'a' ? -1 : 1;
  ths.forEach(function(x){ x.removeAttribute('data-sd'); });
  th.setAttribute('data-sd', dir === 1 ? 'a' : 'd');
  function txt(tr){ var td = tr.children[idx]; return td ? td.textContent.trim() : ''; }
  function numv(s){
    var t = s.replace(/[,%%\s]/g, '');
    var n = Number(t);
    if (isFinite(n) && t !== '') return n;
    if (/^[0-9]/.test(t)) { n = parseFloat(t); if (isFinite(n)) return n; }
    return null;
  }
  rows.sort(function(a, b){
    var x = txt(a), y = txt(b);
    var nx = numv(x), ny = numv(y);
    if (nx !== null || ny !== null){
      var cx = nx === null ? -Infinity : nx, cy = ny === null ? -Infinity : ny;
      if (cx !== cy) return (cx - cy) * dir;
    }
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  rows.forEach(function(r){ tbody.appendChild(r); });
});

/* THE HAIRLINE, not a spinner over the whole pane. Counted rather than boolean, because
   several panes fire three or four calls at once and the first one back would otherwise
   switch the bar off while the rest were still in flight. */
var BUSY=0;
function busy(on){
  BUSY=Math.max(0,BUSY+(on?1:-1));
  var b=$('#busy'); if(b) b.classList.toggle('on',BUSY>0);
}
/* =======================================================================================
   A DROPPED REQUEST IS NOT A FAILED SCREEN.

     "on settings: Imeshindikana / Could not load. Failed to fetch"

   "Failed to fetch" is not the server saying no -- it is fetch() rejecting because no
   response arrived at all. settings() is one bounded read of eight keys; it cannot be slow
   and it cannot crash. So the request did not complete: a handset that changed tower
   mid-request, a moment of no signal, a connection reset while a deploy swapped over.

   There was NO retry anywhere in this client. One dropped packet on mobile data and the
   pane died with a message nobody can act on. For officers working on patchy connections
   that is not an edge case -- it is Tuesday.

   So a fetch-level rejection is retried, twice, backing off. An HTTP ERROR IS NOT RETRIED:
   a 400 or a 403 is the server answering, and asking again gets the same answer.

   WHY RETRYING A POST IS SAFE HERE, EXCEPT ONCE. A rejected fetch is ambiguous -- the
   server may have processed it before the answer was lost -- so a retry can duplicate a
   write. Every write this client makes is idempotent by construction: settingSet upserts,
   notifSeen moves a watermark to now, deviceEnrol skips what is already enrolled,
   deviceSetState writes no event when the state does not move. The exception is
   portalAddComment, which APPENDS -- retrying it could post a follow-up twice, and a
   duplicated comment in a customer's history is a small lie about what happened. It is on
   the deny-list, and anything added later that appends belongs there too. */
var NO_RETRY={portalAddComment:1};
function srv(fn,args,tries){
  tries=tries||0;
  busy(true);
  return fetch('/api/portal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:CODE,fn:fn,args:args||{}})})
  .then(function(r){ return r.text().then(function(t){ var b; try{b=JSON.parse(t);}catch(e){throw new Error('Server error HTTP '+r.status);}
    if(r.status<200||r.status>=300||b.ok===false){ var er=new Error(b.error||('HTTP '+r.status)); er.answered=true;
      // A refusal the caller can argue with carries the rows it is about -- see deviceSetState.
      if(b.code) er.code=b.code; if(b.imeis) er.imeis=b.imeis;
      throw er; } return b; }); })
  .then(function(v){ busy(false); return v; },
        function(e){
          busy(false);
          var dropped=!e||!e.answered;          // no response at all, as opposed to a refusal
          if(dropped&&!NO_RETRY[fn]&&tries<2){
            return new Promise(function(res){ setTimeout(res,tries?1500:500); })
              .then(function(){ return srv(fn,args,tries+1); });
          }
          if(dropped) e=new Error('Mtandao umekatika — imejaribu mara '+(tries+1)+'. Angalia intaneti kisha bofya ↻. '
            + '/ The request never reached the server; tried '+(tries+1)+' times. Check the connection, then tap ↻.');
          throw e;
        });
}

     here the moment the server lists it. */
