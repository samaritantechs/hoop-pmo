      { go:function(){ goWith('cust',function(){ CUST.list='leo45'; }); }, cta:'wateja ›' })
    +tile('Simu leo',n(s.calls),'credit team',
      { go:function(){ goWith('ripoti',function(){ RIP.sort='calls'; }); }, cta:'ripoti ›' })
    +tile('Reached — yesterday',(s.reached&&s.reached.pct!=null?pct(s.reached.pct):'—'),
      (s.reached&&s.reached.den?money(s.reached.num)+' / '+money(s.reached.den)+' · ':'')
        +'last week avg: '+(s.weekAvg&&s.weekAvg.pct!=null?pct(s.weekAvg.pct):'—'),
      { color:'ok', go:function(){ goWith('ripoti',function(){ RIP.sort='ratio'; }); }, cta:'ripoti ›' })
    +'</div>'
    /* THE WEEK, LEFT AND RIGHT. These two answer halves of one question -- how much 7+ debt
       is on the books, and how much of it the credit team pulled back -- so reading them
       needs both in the eye at once. Stacked, the second was always a scroll away from the
       first, and each was stretched across the whole monitor to fill the room. */
    +'<div class="pair">'
    +'<div class="card"><h2>Locked 7+ — wiki hii / this week</h2>'
    +'<div class="mut" style="margin-bottom:6px">Kila siku ya upload: wateja waliowekwa <b>Locked 7+ Days</b> kwenye faili la Watu, ndani ya dirisha la siku 45. Kupanda = mzigo unaongezeka.</div>'
    +'<div id="trendBox"><div class="sk"></div></div></div>'
    +'<div class="card"><h2>Credit — 7+ recovery kwa wiki / this week</h2>'
    +'<div class="mut" style="margin-bottom:6px">Waliowekwa Locked 7+ kwenye faili la Watu, ndani ya siku 45. '
    +'Kila credit, kila siku: waliopewa OFF JANA (7+ siku jana) na wangapi kati yao walipungua leo.</div>'
    +'<div id="credRecBox"><div class="sk"></div></div></div>'
    +'</div>'
    /* SALES AND STOCK, BELOW. Summaries only -- the number and the one thing wrong with it,
       with the pane itself a click away for anybody who needs the pivots.

       GATED HERE, ON THE CLIENT, and that is deliberate. salesWeek wants the `scorecards`
       nav and stockAccount wants `stock`; the dashboard is shown to everybody. Asking for
       either unconditionally would put a 403 error string on the dashboard of every code
       that does not hold them -- the exact bug requireAnyNav was written for. Widening the
       server gate would be worse: per-agent sales is not something a dashboard-only code
       should acquire by side door. So the card is drawn only for somebody who could have
       opened that pane anyway, and the request is never made otherwise. */
    /* .pair only when there are genuinely TWO. A code holding just one of the two navs
       would otherwise get a 1fr 1fr grid with a single child: the card sitting in the left
       half and dead space in the right. */
    +(function(){
      var cards=[];
      if(hasNav('scorecards')) cards.push('<div class="card"><h2>Mauzo wiki hii / Sales this week</h2>'
        +'<div id="dashSalesBox"><div class="sk"></div></div></div>');
      if(hasNav('stock')) cards.push('<div class="card"><h2>Stoo / Stock accountability</h2>'
        +'<div id="dashStockBox"><div class="sk"></div></div></div>');
      if(!cards.length) return '';
      return cards.length>1 ? '<div class="pair">'+cards.join('')+'</div>' : cards[0];
    })()
    +'<div class="card"><h2>Leo unafanyaje / Today’s path</h2>'
    +'<ol class="road" style="margin:0;padding-left:20px">'
    +'<li><a href="/upload">Pakia orodha ya Watu ya leo</a> — Excel kutoka Watu, kama ilivyo.</li>'
    +'<li>Credit team wanafungua <a href="/call">HOOPLOAN Calls</a> kwenye simu zao — orodha inajipanga kwa timu, wanaanza kupiga.</li>'
    +'<li>Kesho asubuhi: pakia ya kesho, kisha angalia <b>Recovery</b> — nani amelipa baada ya simu zetu.</li>'
    +'</ol></div>';
  wireTiles(m);
  // Everything the week governs, through the one path that governs it.
  dashWeekRedraw();
}
/** Does this code hold that pane? The same list the sidebar is built from, so a card can
    never appear for a nav whose tab is hidden. */
function hasNav(k){ return (BOOT.navs||[]).indexOf(k)>=0; }

/* ---------- the two summaries under the charts ----------
   Each is the headline plus the ONE number that means somebody has to do something: the
   week against its target, and how much stock nobody can account for. Everything else
   stays in the pane, one click away, where there is room to pivot it four ways. */
function drawDashSales(){
  var box=$('#dashSalesBox'); if(!box) return;
  // The week the board is standing on -- not "whatever week has sales", which is what an
  // empty argument asked for and is how this card used to disagree with the two beside it.
  srv('salesWeek',{week:RECWEEK}).then(function(d){
    var b=$('#dashSalesBox'); if(!b) return;
    var c=d.company||{}, n=c.count||0, amt=c.amount||0;
    var tgt=d.weekTarget||null;
    /* AGAINST THE AMOUNT, NOT THE COUNT. weekTarget is TZS (SALES_DAILY_TARGET x 7) and
       `n` is a number of handsets, so subtracting one from the other compared shillings to
       phones: fourteen sold against a 21,000,000 target read as "20,999,986 pungufu" and
       painted red every single week, whatever the team did. drawSalesPerf compares amounts
       throughout; this is the same comparison. */
    var over=tgt?(amt-tgt):null;
    var pctOfTarget=tgt?Math.round(100*amt/tgt):null;
    // All three open Mauzo, where the day-by-day board and the per-agent pivots live.
    var toSales=function(){ goTab('sales'); };
    b.innerHTML='<div class="tiles" style="margin-bottom:8px">'
      +tile('Simu zimeuzwa',money(n),esc(d.from||'')+' → '+esc(d.to||''),
        { go:toSales, cta:'mauzo ›' })
      +tile('Thamani',money(amt),'TZS',{ go:toSales, cta:'mauzo ›' })
      /* THE PERFORMANCE IS THE HEADLINE, not the goal. Printing the target big and the
         delta small put the number nobody can act on where the eye lands first. */
      +(tgt
        ? tile('Dhidi ya lengo',pctOfTarget+'%',
            (over>=0?'+'+money(over):'−'+money(Math.abs(over)))+' / lengo '+money(tgt),
            { color:(over>=0?'ok':'bad'), go:toSales, cta:'mauzo ›' })
        /* No target set is a SETTINGS problem, so this one door leads there instead --
           telling somebody to "weka SALES_DAILY_TARGET" without saying where is half an
           instruction. Only for a code that can actually open Settings. */
        : tile('Dhidi ya lengo','—','weka SALES_DAILY_TARGET',
            hasNav('settings')?{ go:function(){ goTab('settings'); }, cta:'settings ›' }:{}))
      +'</div>'
      // Said plainly rather than shown as "this week" -- see the Monday problem.
      +(d.fellBack?'<div class="note">Wiki hii bado haina mauzo — hii ni wiki iliyopita. '
        +'/ Nothing uploaded for this week yet; showing the last week that has sales.</div>':'')
      +salesWeekChart_(d)
      +'<button class="btn sm ghost" onclick="goTab(\'sales\')">Fungua Mauzo / Open sales</button>';
    wireTiles(b);
  }).catch(function(e){ var b=$('#dashSalesBox'); if(b) b.innerHTML='<div class="mut">'+esc(safeErr(e))+'</div>'; });
}
/** TZS at a glance. A week's takings run to eight digits, and eight digits above a bar is a
    label nobody reads and every neighbour collides with. */
function moneyShort_(n){
  n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toFixed(n>=1e10?0:1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(n>=1e3) return Math.round(n/1e3)+'K';
  return String(Math.round(n));
}

/* =====================================================================================
   THE SALES WEEK, AS A SHAPE.

     "I expected sales to have a graphical trend"

   The card had the numbers and no picture: total sold, total value, percent of target. Three
   figures that cannot tell you a week was carried by one enormous Tuesday, which is the thing
   a dealer actually wants off a dashboard.

   The data was already here -- salesWeek returns company.days, a date -> {count, amount} map
   -- so this draws what was already being fetched and thrown away.

   BY VALUE, not by handset count, because the target beside it is in shillings and two
   charts on one card measuring different things is worse than one chart. The count rides
   along in the tooltip.

   A DAY WITH NO SALES IS DRAWN AS ZERO HERE, and that is the opposite of the locked-7+ chart
   next to it, on purpose. That chart's gaps mean "nobody uploaded", a fact it can know. Sales
   arrive as one report covering a range, so within a week that HAS sales, a day with no rows
   means no sales -- a real zero, and drawing it as a gap would hide a dead Tuesday. */
function salesWeekChart_(d){
  var days=d.days||[], byDay=(d.company&&d.company.days)||{};
  if(!days.length) return '';
  var pts=days.map(function(iso){
    var e=byDay[iso]||null;
    return { date:iso, amount:e?(e.amount||0):0, count:e?(e.count||0):0 };
  });
  var vals=pts.map(function(p){ return p.amount; });
  var max=Math.max.apply(null,vals);
  if(!(max>0)) return '<div class="mut" style="margin:8px 0">Hakuna mauzo wiki hii. '
    +'/ No sales recorded in this week.</div>';

  var W=560,H=180,padL=46,padB=26,padT=18,padR=8;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var slot=innerW/pts.length, bw=Math.min(52,slot*0.6);
  // The daily target, drawn as a line across the week when one is set: a bar chart with a
  // target on it answers "which days carried us" in one look.
  var dayTgt=d.dailyTarget||null;
  var yOf=function(v){ return padT+innerH-(max?(v/max)*innerH:0); };
  /* THE SAME ABBREVIATIONS THE CREDIT GRID USES, and not the first three letters of the
     Swahili names -- Jumapili, Jumatatu, Jumanne and Jumatano ALL begin "Jum", so slicing
     gave a week reading Jum · Jum · Jum · Jum · Alh · Iju · Jum. Four different days under
     one label is not a shorter axis, it is no axis. */
  var wd=['Jpi','Jtt','Jnn','Jtn','Alh','Iju','Jms'];
  var shortOf=function(iso){ return wd[new Date(iso+'T00:00:00').getDay()]; };

  var grid='',bars='',labels='';
  [0,0.5,1].forEach(function(f){
    var y=padT+innerH-f*innerH;
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'
      +'<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'
      +esc(moneyShort_(max*f))+'</text>';
  });
  var best=-1; pts.forEach(function(p,i){ if(best<0||p.amount>pts[best].amount) best=i; });
  pts.forEach(function(p,i){
    var cx=padL+slot*i+slot/2;
    labels+='<text x="'+cx+'" y="'+(H-padB+17)+'" text-anchor="middle" font-size="11" '
      +'font-weight="'+(i===best?'700':'400')+'" fill="var(--mut)">'+esc(shortOf(p.date))+'</text>';
    if(!p.amount){
      labels+='<text x="'+cx+'" y="'+(padT+innerH-6)+'" text-anchor="middle" font-size="10" fill="var(--soft)">0</text>';
      return;
    }
    var y=yOf(p.amount), h=Math.max(2,padT+innerH-y);
    bars+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="var(--ok)" '
      +'opacity="'+(i===best?'1':'0.5')+'"><title>'+esc(p.date)+': '+money(p.count)+' simu · TZS '
      +money(p.amount)+'</title></rect>'
      +'<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" font-weight="700" '
      +'fill="'+(i===best?'var(--ok)':'var(--mut)')+'">'+esc(moneyShort_(p.amount))+'</text>';
  });
  var tgtLine='';
  if(dayTgt&&dayTgt>0&&dayTgt<=max){
    var ty=yOf(dayTgt);
    tgtLine='<line x1="'+padL+'" y1="'+ty+'" x2="'+(W-padR)+'" y2="'+ty+'" stroke="var(--b600)" '
      +'stroke-width="1.5" stroke-dasharray="5 4"/>'
      +'<text x="'+(W-padR)+'" y="'+(ty-5)+'" text-anchor="end" font-size="10.5" fill="var(--b600)">'
      +'lengo/siku '+esc(moneyShort_(dayTgt))+'</text>';
  }
  var sold=pts.reduce(function(s,p){ return s+p.count; },0);
  var live=pts.filter(function(p){ return p.amount>0; }).length;
  return '<div class="chartwrap" style="margin:4px 0 6px"><svg viewBox="0 0 '+W+' '+H+'" role="img" '
    +'aria-label="Sales value per day this week">'
    +'<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(W-padR)+'" y2="'+(padT+innerH)+'" stroke="var(--line)" stroke-width="1.5"/>'
    +grid+bars+tgtLine+labels+'</svg></div>'
    +'<div class="mut" style="margin-bottom:8px">Thamani kwa siku (TZS). Kilele: '
    +esc(moneyShort_(max))+' · siku zenye mauzo: '+money(live)+'/'+money(pts.length)
    +' · jumla '+money(sold)+' simu.'
    +(dayTgt?' Mstari wa nukta = lengo la siku.':'')+'</div>';
}

/* =====================================================================================
   STOCK, AS A PICTURE -- AND NOT AS A TREND, BECAUSE IT HAS NONE.

     "anything creative for stock at dashboard too"

   Stock is counted whenever Sipho's report is uploaded, not every day, so there is no daily
   series to draw and inventing one would be a chart that looks informative and is not. What
   stock DOES have is two compositions, and they are the whole accountability question:

     WHAT IS IN HAND   held, of which `stale` have been sitting past the age limit.
                       `stale` is a SUBSET of `held` -- so it is drawn inside that bar, never
                       beside it as though it were separate stock.

     WHAT LEFT         everything on the previous report and not on this one, split into
                       sold / on Watu / unaccounted. Those three are disjoint and sum to the
                       departures that could be checked, which is what makes a stacked bar
                       honest here. `notChecked` is deliberately NOT in the bar: it is the
                       count nobody could verify either way, and folding an open question
                       into a clean category is how a book starts lying.

   The second bar is the one the whole feature exists for -- "hoop agents are stealing stock"
   is a red segment or it is nothing. */
function stockSplitBars_(d,t){
  var held=t.held||0, stale=t.stale||0, fresh=Math.max(0,held-stale);
  var sold=t.sold||0, watu=t.watu||0, un=t.unaccounted||0;
  var gone=sold+watu+un;
  var seg=function(n,total,color,label){
    if(!n) return '';
    var pctW=total?(100*n/total):0;
    return '<div style="width:'+pctW.toFixed(2)+'%;background:'+color+'" title="'
      +esc(label)+': '+money(n)+'"></div>';
  };
  var key=function(color,label,n){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:11.5px">'
      +'<i style="width:10px;height:10px;border-radius:3px;background:'+color+';display:inline-block"></i>'
      +esc(label)+' <b>'+money(n)+'</b></span>';
  };
  var bar=function(inner){
    return '<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;'
      +'background:var(--b50);margin:4px 0 6px">'+inner+'</div>';
  };
  var out='';
  if(held>0){
    out+='<div style="font-size:12px;font-weight:700;margin-top:6px">Zilizopo mkononi / In hand</div>'
      +bar(seg(fresh,held,'var(--b600)','Ndani ya muda')+seg(stale,held,'#F59E0B','Zimekaa muda'))
      +'<div class="mut">'+key('var(--b600)','ndani ya muda',fresh)
      +key('#F59E0B','zimekaa zaidi ya siku '+money(d.staleDays||0),stale)+'</div>';
  }
  if(gone>0){
    out+='<div style="font-size:12px;font-weight:700;margin-top:10px">Zimeondoka tangu ripoti iliyopita '
      +'/ Left since the previous report</div>'
      +bar(seg(sold,gone,'var(--ok)','Zimeuzwa')+seg(watu,gone,'var(--b300)','Zipo Watu')
        +seg(un,gone,'var(--bad)','Hazijulikani'))
      +'<div class="mut">'+key('var(--ok)','zimeuzwa',sold)
      +key('var(--b300)','zipo Watu',watu)+key('var(--bad)','hazijulikani',un)+'</div>';
  }
  if(!out) return '';
  return '<div style="margin:2px 0 8px">'+out+'</div>';
}

function drawDashStock(){
  var box=$('#dashStockBox'); if(!box) return;
  /* The stock book as it stood at the END of the week on screen. Stock has no series to
     trend -- it is counted whenever Sipho's report is uploaded, not daily -- so following
     the week means answering "how did the book stand then", which stockAccount resolves
     backward to the newest report at or before that date. */
  srv('stockAccount', RECWEEK?{asOf:addDays_(mondayOf_(RECWEEK),6)}:{}).then(function(d){
    var b=$('#dashStockBox'); if(!b) return;
    var t=(d.company&&d.company.totals)||{};
    if(!d.asOf){
      b.innerHTML='<div class="mut">Hakuna ripoti ya stock bado. / No stock report uploaded yet.</div>';
      return;
    }
    var un=t.unaccounted||0;
    /* Each opens Stock accountability with its own column brought to the top, so the tile
       lands on WHO rather than on the same total again one screen further down. */
    var toAcct=function(col){ return function(){ goWith('acct',function(){ STOCKACCT.sort=col; }); }; };
    b.innerHTML='<div class="tiles" style="margin-bottom:8px">'
      +tile('Zilizopo',money(t.held||0),esc(String(d.asOf).slice(0,10)),
        { go:toAcct('held'), cta:'nani anazo ›' })
      +tile('Hazijulikani',money(un),'zimeondoka bila maelezo',
        { color:(un?'bad':''), go:toAcct('unaccounted'), cta:'nani anazo ›' })
      +tile('Zimekaa muda',money(t.stale||0),'zaidi ya siku '+money(d.staleDays||0),
        { go:toAcct('stale'), cta:'nani anazo ›' })
      +'</div>'
      +stockSplitBars_(d,t)
      /* Not the same as zero unaccounted, and it must not read like it: a departure nobody
         could check is an open question, not a clean book. */
      +(d.notChecked?'<div class="note">'+money(d.notChecked)+' hazikuweza kukaguliwa. '
        +'/ could not be checked against the sales book or Watu.</div>':'')
      +'<button class="btn sm ghost" onclick="goTab(\'acct\')">Fungua uwajibikaji / Open accountability</button>';
    wireTiles(b);
  }).catch(function(e){ var b=$('#dashStockBox'); if(b) b.innerHTML='<div class="mut">'+esc(safeErr(e))+'</div>'; });
}

/* ===================================================================================
   CREDIT RECOVERY, PER PERSON, PER DAY -- THE PICTURE.
     "at dashboard add credit recovery - graphical ... Monday someone recovered 4 of 15
      Tuesday 5 of 10 - to sunday"

   One ROW per credit officer, seven small bars across it -- Monday to Sunday, the same
   fixed week as every other chart here. Each bar's full height is what that officer was
   DEALT that morning (their cut of the OFF JANA pool, under the same stratified deal the
   handsets run), and the filled part is how many of those came back. The number under
   each bar reads exactly as the owner asked for it: 4/15.

   A day the officer was dealt nothing is a gap, not a zero -- an officer who was handed
   no 7+ customers on Wednesday did not "fail Wednesday", and the chart must not say so. */
/* THE WEEK SLIDES, AND IT SLIDES THE WHOLE DASHBOARD.

     "the date forward and backward is not for credit but the whole dashboard holded
      DTA preview as hopeloan"

   It began as a control inside the Credit card, moving the two recovery charts. That was
   the wrong home for it: a dashboard showing last week's recovery beside THIS week's sales
   and today's stock is four cards disagreeing about what day it is, with nothing on screen
   saying so. HOPE settled this long ago -- one week bar at the head of the dashboard and
   every card drawn for it (weekBar / wireWeekBar in HOPE's app.html).

   So the choice lives at the top now and everything follows it: both recovery charts, the
   sales week, and the stock book as it stood at the end of that week. Empty string = this
   week; anything else is a Monday. */
var RECWEEK='';
/** The Monday of whatever week a date falls in. Computed on the CLIENT so the bar can be
    drawn before any request returns; the server snaps the same way, and the two must agree
    or the bar would jump to a different week the moment the first card landed. */
function mondayOf_(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return '';
  var d=new Date(String(iso)+'T09:00:00Z');
  d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
  return d.toISOString().slice(0,10);
}
function addDays_(iso,n){
  var d=new Date(String(iso)+'T09:00:00Z');
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
/** Redraw every card the week governs -- in ONE place, so a card added later cannot quietly
    go on showing a different week from the rest of the board. */
function dashWeekRedraw(){
  /* Every one of these guards on its own container and returns quietly when it is not on
     screen, so this is also the Recovery pane's redraw -- ONE path for the whole week,
     rather than two lists that drift until half the screen is showing a different week. */
  drawDashWeekBar();
  drawTrend();
  drawCreditRecovery();
  drawRecoveryTrend();
  if(hasNav('scorecards')) drawDashSales();
  if(hasNav('stock')) drawDashStock();
}
function dashWeekSet(iso){ RECWEEK=iso||''; dashWeekRedraw(); }
/* Drawn from the client's own arithmetic rather than from a response, because it heads a
   board of four independent requests: waiting on one would leave the control missing for as
   long as the slowest card takes, and adopting one card's answer would make the bar lie
   whenever that card fell back to a different week on its own. */
function drawDashWeekBar(){
  var host=$('#dashWeekBar'); if(!host) return;
  var thisMon=mondayOf_(isoToday(0));
  var mon=RECWEEK?mondayOf_(RECWEEK):thisMon;
  var end=addDays_(mon,6);
  var chip=mon===thisMon
    ? '<span class="chip">wiki hii / this week</span>'
    : (mon>thisMon
        ? '<span class="chip ok">wiki ijayo / upcoming week</span>'
        : '<span class="chip warn">wiki iliyopita / past week</span>');
  host.innerHTML='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<span class="mut" style="font-size:12px">Wiki (Jumatatu) / Week starting Monday</span>'
    +'<button class="btn sm ghost" id="dwPrev" title="Wiki iliyopita / previous week">◀</button>'
    +'<input class="inp" type="date" id="dwDate" value="'+esc(mon)+'" style="flex:0 1 158px">'
    +'<button class="btn sm ghost" id="dwNext" title="Wiki ijayo / next week">▶</button>'
    +'<span style="font-size:12px;font-weight:700">'+esc(mon)+' → '+esc(end)+'</span>'
    +chip
    +(mon===thisMon?'':'<button class="btn sm" id="dwNow">Rudi wiki hii / back to this week</button>')
    +'</div>'
    +'<div class="mut" style="font-size:11.5px;margin-top:5px">Kadi zote hapa chini zinafuata wiki hii. '
    +'/ Every card below is drawn for this week.</div>';
  var p=$('#dwPrev'); if(p) p.onclick=function(){ dashWeekSet(addDays_(mon,-7)); };
  var n=$('#dwNext'); if(n) n.onclick=function(){ dashWeekSet(addDays_(mon,7)); };
  var now=$('#dwNow'); if(now) now.onclick=function(){ dashWeekSet(''); };
  // Any date is accepted and snapped to its own Monday, in front of them, before the redraw.
  var dt=$('#dwDate'); if(dt) dt.onchange=function(){
    var m=mondayOf_(dt.value); if(!m) return; dt.value=m; dashWeekSet(m);
  };
}
function recWeekBar(d){
  return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'
    +'<button class="btn sm ghost" id="recWkPrev" title="Wiki iliyopita / previous week">◀</button>'
    +'<span style="font-size:12px;font-weight:600">'+esc(d.from||'')+' → '+esc(d.to||'')+'</span>'
    +'<button class="btn sm ghost" id="recWkNext" title="Wiki ijayo / next week">▶</button>'
    +(d.thisWeek
      ? '<span class="chip">wiki hii / this week</span>'
      : '<button class="btn sm" id="recWkNow">Rudi wiki hii / back to this week</button>')
    // Landed here on its own rather than by somebody pressing an arrow -- say so, so the
    // week on screen is never mistaken for the current one.
    +(d.fellBack ? '<span class="chip warn">bado hakuna upload wa wiki hii / no uploads yet this week</span>' : '')
    +'</div>';
}
function wireRecWeekBar(d){
  /* Goes through dashWeekRedraw like the dashboard's own bar does, rather than naming three
     draws of its own. Two lists of "what a week change redraws" is how one of them ends up
     missing the card somebody added last month. */
  var step=function(n){
    var base=new Date((d.from||new Date().toISOString().slice(0,10))+'T09:00:00Z');
    base.setUTCDate(base.getUTCDate()+7*n);
    dashWeekSet(base.toISOString().slice(0,10));
  };
  var p=$('#recWkPrev'); if(p) p.onclick=function(){ step(-1); };
  var n=$('#recWkNext'); if(n) n.onclick=function(){ step(1); };
  var now=$('#recWkNow'); if(now) now.onclick=function(){ dashWeekSet(''); };
}
/* THE COLOUR IS THE GRAPH, now that the length is gone.

   Alpha over the OK green rather than seven fixed hex steps: it composites correctly on
   whatever the card behind it is, so the same scale works in dark mode without a second
   palette. Floor of .08 so a 0% cell is still visibly a CELL and not a hole in the row --
   "nobody came back" is a reading, and a blank would look like missing data instead.

   White text only once the tint is dark enough to need it; below that the ink stays, which
   keeps the numbers legible at every step rather than at the two ends. */
function credTint_(ratio){
  if(ratio==null) return ' style="background:var(--b50);color:var(--soft)"';
  var a=0.08+0.62*Math.max(0,Math.min(1,ratio));
  return ' style="background:rgba(6,118,71,'+a.toFixed(2)+');color:'
    +(ratio>=0.55?'#fff':'var(--ink)')+'"';
}
function drawCreditRecovery(){
  var box=$('#credRecBox'); if(!box) return;
  srv('recoveryWeek',{week:RECWEEK}).then(function(d){
    var b=$('#credRecBox'); if(!b) return;
    var pts=d.points||[], people=(d.credits||[]);
    // Only the people who were actually dealt something this week -- a roster member with
    // an empty week is a blank row that pushes the real ones off the screen.
    var live=people.filter(function(p){
      return Object.keys(p.days||{}).some(function(k){ return p.days[k].assigned>0; });
    });
    if(!pts.length||!live.length){
      /* The bar stays even on an empty week -- it is the way back OUT of one, and this is
         the message the owner actually meets on a MONDAY: a fresh Mon-Sun week holds one
         upload at most, and recovery needs the NEXT upload before it can show anything.
         So the empty state names the reason and points at the button rather than reading
         as "the chart is broken". */
      b.innerHTML=
        '<div class="mut">Hakuna mgao wa 7+ kwa wiki hii bado'
        +(d.thisWeek?' — wiki huanza Jumatatu, na recovery huonekana baada ya upload ya siku inayofuata. Bonyeza ◀ kuona wiki iliyopita.':' — hakuna upload wa wiki hiyo.')
        +' / No 7+ pool for this week yet'+(d.thisWeek?' — a week starts Monday and recovery only shows after the NEXT day\'s upload. Press ◀ for last week.':'.')
        +'</div>';
      return;
    }
    var today=(new Date(Date.now()+3*3600*1000)).toISOString().slice(0,10);
    /* SHORT, and now it has to be. These are CSS-px labels in a grid column, not SVG text
       that scales: "Wednesday" at 10.5px is an unbreakable ~58px token, and a grid track's
       automatic minimum is its content, so seven of them plus the name column gave the row
       a min-content of roughly 526px. Inside half a .pair that is wider than the track, so
       the grid pushed its column out, the two halves stopped being equal, and the page grew
       a horizontal scrollbar. Three letters is ~24px and the row fits its column again.
       (The full Swahili names were already declared here and never used.) */
    var dayShort=function(iso){
      var sw=['Jpi','Jtt','Jnn','Jtn','Alh','Iju','Jms'];
      return sw[new Date(iso+'T00:00:00').getDay()];
    };
    /* AN EYE PER DAY, at the end of each day's name -- each day opened on its own, because
       "who were they" is asked about one day at a time. Drawn only where that day actually
       had a pool; an eye over a day nobody uploaded would open an empty panel and look
       broken. The list itself is fetched on the tap, never with the chart. */
    /* A REAL HEADER ROW, not seven loose labels floating over the bars. It is banded and
       ruled like a table head, the first cell is named rather than left blank, each day
       carries its date under the name, and TODAY's column is tinted the whole way across so
       the eye finds "where are we now" without counting along. */
    var head='<div style="display:grid;grid-template-columns:minmax(76px,108px) repeat(7,1fr);gap:4px;'
      +'align-items:end;background:var(--b50);border:1px solid var(--line);'
      +'border-radius:9px 9px 0 0;padding:7px 6px;margin-bottom:0">'
      +'<div style="font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;'
      +'letter-spacing:.03em">Credit</div>'
      +pts.map(function(pt){
        var any=pt.offJana, isToday=(pt.date===today);
        return '<div style="text-align:center;'
          +(isToday?'background:var(--b100);border-radius:6px;':'')+'padding:2px 0">'
          +'<div style="font-size:10.5px;color:'+(isToday?'var(--ink)':'var(--mut)')+';'
          +'font-weight:'+(isToday?'700':'600')+'">'+esc(dayShort(pt.date))
          +(any?' <span class="credEye" data-date="'+esc(pt.date)+'" role="button" tabindex="0" '
              +'title="Ona wateja wa siku hii / see this day\'s customers" '
              +'style="cursor:pointer;opacity:.75;font-size:12px">\u{1F441}</span>':'')
          +'</div>'
          +'<div style="font-size:9px;color:var(--soft)">'+esc(String(pt.date).slice(5))+'</div>'
          +'</div>';
      }).join('')+'</div>';

    var rows=live.map(function(p){
      var wkA=0,wkR=0;
      var cells=pts.map(function(pt){
        var c=p.days[pt.date];
        if(!c||!c.assigned){
          return '<div class="credCell" style="color:var(--soft)">—</div>';
        }
        wkA+=c.assigned; if(!c.pending) wkR+=c.recovered;
        /* THE NUMBER IS THE CELL, and the colour is the graph.
             "I intended to see graphs but the bars are killing it better use numbers
              within b/se the variance of the lenghts makes them ugly"

           The bars encoded recovery as LENGTH, scaled against the busiest officer of the
           week. One person dealt 40 and another dealt 2 put a full-height block beside a
           3px stub on the same row, and neither told you the thing that matters -- 1 of 2
           came back is a better day than 12 of 40, and the tall bar was the worse one.

           Colour carries it instead. The tint is the RATIO recovered, so every cell is the
           same size and the eye reads the week as a wash of light and dark: the pale ones
           are where the chasing did not land. No length, so no raggedness, and 4/15 is
           sitting right there to be read rather than inferred from a stub. */
        var ratio=c.pending?null:(c.assigned?c.recovered/c.assigned:0);
        return '<div class="credCell"'+credTint_(ratio)+'>'
          +(c.pending
            ? '<b>'+money(c.assigned)+'</b><span class="credSub">kesho</span>'
            : '<b>'+money(c.recovered)+'/'+money(c.assigned)+'</b>'
              +'<span class="credSub">'+Math.round(100*ratio)+'%</span>')
          +'</div>';
      }).join('');
      return '<div style="display:grid;grid-template-columns:minmax(76px,108px) repeat(7,1fr);gap:4px;align-items:center;'
        +'padding:8px 6px;border:1px solid var(--line);border-top:0">'
        +'<div style="font-size:12.5px"><b>'+esc(p.name||p.userId)+'</b>'
        +'<div class="mut" style="font-size:10.5px">wiki: '+money(wkR)+'/'+money(wkA)
        +(wkA?' · '+Math.round(100*wkR/wkA)+'%':'')+'</div></div>'
        +cells+'</div>';
    }).join('');

    b.innerHTML=head+rows
      +'<div class="mut" style="font-size:10.5px;margin-top:8px">'
      +'Kila kisanduku: <b>waliopungua / waliopewa</b> · kijani zaidi = walirudi zaidi · '
      +'“kesho” = mgao wa leo, matokeo huonekana kwenye upload ijayo · “—” = hakukuwa na mgao siku hiyo. '
      +'Bonyeza \u{1F441} juu ya siku kuona wateja wenyewe.</div>'
      +'<div id="credDayBox" style="margin-top:10px"></div>';

    // One handler per eye. Each day opens on its own and replaces whatever was open, so the
    // panel never becomes a stack of days nobody closed.
    Array.prototype.forEach.call(b.querySelectorAll('.credEye'), function(el){
      var open=function(){ credDayOpen(el.getAttribute('data-date'), dayShort); };
      el.onclick=open;
      el.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); open(); } };
    });
  }).catch(function(e){
    var b=$('#credRecBox'); if(b) b.innerHTML='<div class="mut">'+esc(safeErr(e))+'</div>';
  });
}

/* THE WEEK'S LOCKED 7+ AS A PICTURE. Plain inline SVG -- no library, no network, and
   it prints. One bar per upload day: height is that day's burden against the week's
   own peak, the newest bar is filled, the rest sit lighter so the eye lands on today.
   A day with no upload is drawn as a gap and SAID so, never as a zero -- "nobody
   uploaded" and "nobody was locked" are different facts. The table under it is the
   same numbers for anyone who wants to read (or export) them. */
function drawTrend(){
  var box=$('#trendBox'); if(!box) return;
  srv('lockedTrend',{week:RECWEEK}).then(function(d){
    var pts=d.points||[];
    var box2=$('#trendBox'); if(!box2) return;
    var vals=pts.filter(function(p){return p.num!=null;}).map(function(p){return p.num;});
    if(!vals.length){
      box2.innerHTML='<div class="mut">Hakuna upload bado — chati itajaa baada ya upload za kila siku.</div>';
      return;
    }
    /* WHICH WEEK AM I LOOKING AT. Shown whenever the chart has fallen back off the current
       week -- a Monday-morning dashboard quietly drawing LAST week under a heading that says
       "wiki hii" would be worse than the blank card it replaced. */
    var wkNote=d.fellBack
      ? '<div class="chip warn" style="margin-bottom:6px">Wiki ya '+esc(d.from||'')+' → '+esc(d.to||'')
        +' — bado hakuna upload wa wiki hii. / showing the latest week with uploads, not this one.</div>'
      : '';
    var max=Math.max.apply(null,vals), n=pts.length;
    /* Sized for HALF a row, not the whole page. At 720 the chart had to be scaled down
       hard to fit beside its neighbour, which shrank every label with it; 560 is close
       to 1:1 in the column it now occupies, so the text reads at the size it was set. */
    var W=560,H=190,padL=42,padB=26,padT=16,padR=8;
    var innerW=W-padL-padR, innerH=H-padT-padB;
    var slot=innerW/n, bw=Math.min(56,slot*0.62);
    var yOf=function(v){ return padT+innerH-(max?(v/max)*innerH:0); };
    var lastIdx=-1; pts.forEach(function(p,i){ if(p.num!=null) lastIdx=i; });
    // Full English names, Monday first -- the week the server sends, unshifted.
    var dayName=function(iso){
      var wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      return wd[new Date(iso+'T00:00:00').getDay()];
    };
    var grid='',bars='',labels='';
    [0,0.5,1].forEach(function(f){
      var y=padT+innerH-f*innerH, v=Math.round(max*f);
      grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'
        +'<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+money(v)+'</text>';
    });
    pts.forEach(function(p,i){
      var cx=padL+slot*i+slot/2;
      labels+='<text x="'+cx+'" y="'+(H-padB+17)+'" text-anchor="middle" font-size="11" '
        +'font-weight="'+(i===lastIdx?'700':'400')+'" fill="var(--mut)">'+esc(dayName(p.date))+'</text>';
      if(p.num==null){
        labels+='<text x="'+cx+'" y="'+(padT+innerH-6)+'" text-anchor="middle" font-size="10" fill="var(--soft)">—</text>';
        return;
      }
      var y=yOf(p.num), h=Math.max(2,padT+innerH-y), on=(i===lastIdx);
      bars+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" '
        +'fill="var(--bad)" opacity="'+(on?'1':'0.42')+'"><title>'+esc(p.date)+': '+money(p.num)+' locked 7+</title></rect>'
        +'<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+(on?'var(--bad)':'var(--mut)')+'">'+money(p.num)+'</text>';
    });
    var first=vals[0], last=vals[vals.length-1], diff=last-first;
    box2.innerHTML=wkNote
      /* .chartwrap is the ceiling: width:100% inside it, but never wider than the chart's
         own natural size, so it shrinks on a phone and stops growing on a monitor. */
      +'<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" '
      +'aria-label="Locked 7+ per day this week">'
      +'<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(W-padR)+'" y2="'+(padT+innerH)+'" stroke="var(--line)" stroke-width="1.5"/>'
      +grid+bars+labels+'</svg></div>'
      +'<div class="mut" style="margin-top:6px">'
      +(vals.length>1
        ? (diff===0?'Sawa na siku ya kwanza yenye upload.':(diff>0?'⬆ ':'⬇ ')+money(Math.abs(diff))+' kuliko siku ya kwanza yenye upload wiki hii.')
        : 'Siku moja tu ya upload wiki hii.')
      +' Kilele: '+money(max)+'. Siku zenye — hazina upload.</div>';
  }).catch(function(e){
    var b=$('#trendBox'); if(b) b.innerHTML='<div class="mut">'+esc(safeErr(e))+'</div>';
  });
}

/* ---------- ripoti ---------- */
var RIP={from:isoToday(-7),to:isoToday(0),team:'',sort:''};
/** Tile options for "sort the officers by this column". Clicking the live one clears it. */
function ripBy(key,cta){
  return { on:RIP.sort===key, cta:cta,
    go:function(){ RIP.sort=(RIP.sort===key?'':key); drawRipoti($('#main')); } };
}
/* WORST FIRST FOR % PF, biggest first for everything else. The three volume columns are
   read as league tables -- who did the most -- while % PF is only ever looked at to find
   who is not chasing their own book, so ordering it downward would bury the answer. */
function ripSorted(users){
  if(!RIP.sort) return users;
  var k=RIP.sort, up=(k==='ratio');
  return users.slice().sort(function(a,b){
    var x=Number(a[k])||0, y=Number(b[k])||0;
    // Somebody with no calls has no ratio to judge; they sink rather than topping the list.
    if(up){ if(!a.calls) return 1; if(!b.calls) return -1; return x-y; }
    return y-x;
  });
}
function drawRipoti(m){
  m.innerHTML='<div class="card"><h2>Call reports — simu za credit team</h2><div class="sk"></div></div>';
  srv('report',{from:RIP.from,to:RIP.to,team:RIP.team}).then(function(d){
    var t=d.totals||{};
    m.innerHTML=
      '<div class="card"><h2>Call reports — simu za credit team</h2>'
      +'<div class="row"><input class="inp" type="date" id="rF" value="'+RIP.from+'"><input class="inp" type="date" id="rT" value="'+RIP.to+'">'
      +'<select class="inp" id="rTeam"><option value="">Timu zote</option>'
      +(d.teams||[]).map(function(x){return '<option'+(x.team===RIP.team?' selected':'')+'>'+esc(x.team)+'</option>';}).join('')
      +'</select></div>'
      /* EVERY TILE IS A COLUMN OF THE TABLE BELOW, so each one answers "who" by bringing
         that column to the top rather than by opening a second copy of the same table.
         % PF sorts WORST first: a tile you click because it looks low should not hand you
         the people who are already doing well. */
      +'<div class="tiles">'
      +tile('Simu',money(t.calls),'',ripBy('calls','nani amepiga ›'))
      +tile('Muda',fmtDur(t.duration),'',ripBy('duration','nani ametumia ›'))
      +tile('Portfolio',money(t.portfolio),'',
        Object.assign({color:'ok'},ripBy('portfolio','nani amefuata ›')))
      +tile('% pf',(t.calls?pct(t.ratio):'—'),'',ripBy('ratio','wa chini kwanza ›'))
      +'</div>'
      +'<div class="scroll"><table><thead><tr><th>Afisa</th><th class="r">Simu</th><th class="r">Muda</th><th class="r">Wateja</th><th class="r">PF</th><th class="r">Non-PF</th><th class="r">% PF</th><th></th></tr></thead><tbody>'
      +ripSorted(d.users||[]).map(function(u){
        var h=telHref(u.phone);
        return '<tr><td>'+esc(u.name)+'<div class="mut" style="font-size:10.5px">'+esc(u.team||'')+' '+esc(u.position||'')+'</div></td>'
          +'<td class="r">'+money(u.calls)+'</td><td class="r">'+fmtDur(u.duration)+'</td>'
          +'<td class="r">'+money(u.uniqCustomers)+'</td>'
          +'<td class="r" style="color:var(--ok)">'+money(u.portfolio)+'</td>'
          +'<td class="r" style="color:var(--soft)">'+money(u.nonPortfolio)+'</td>'
          +'<td class="r"'+(u.calls&&u.ratio<0.5?' style="color:var(--bad)"':'')+'>'+(u.calls?pct(u.ratio):'—')+'</td>'
          +'<td class="r">'+(h!=='#'?'<a href="tel:'+h+'" title="'+esc(u.phone)+'">📞</a>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
    wireTiles(m);
    $('#rF').onchange=function(){RIP.from=this.value;drawRipoti(m);};
    $('#rT').onchange=function(){RIP.to=this.value;drawRipoti(m);};
    $('#rTeam').onchange=function(){RIP.team=this.value;drawRipoti(m);};
  }).catch(function(e){ paneFailed(m,e); });
}

/* ---------- recovery ---------- */
/* kind: which slice of the comparison is on screen. '' = all of it. Set from the dashboard
   too, so "Locked 7+" over there lands on the people who are sinking over here. */
var REC={kind:''};
function recBy(k,cta){
  return { on:REC.kind===k, cta:cta||'orodha ›',
    go:function(){ REC.kind=(REC.kind===k?'':k); drawRecovery($('#main')); } };
}
function recRows(rows){
  // 'off' is what the dashboard asks for -- the ones going the wrong way, either direction.
  if(REC.kind==='off') return rows.filter(function(r){ return r.kind==='worse'||r.kind==='left'; });
  if(!REC.kind) return rows;
  return rows.filter(function(r){ return r.kind===REC.kind; });
}
function recChip(r){
  if(r.paid) return '<span class="chip ok">AMELIPA</span>';
  if(r.kind==='better') return '<span class="chip">karibu</span>';
  if(r.kind==='worse') return '<span class="chip bad">amezama zaidi</span>';
  if(r.kind==='left') return '<span class="chip warn">ametoka kwenye orodha</span>';
  return '<span class="chip">—</span>';
}
function drawRecovery(m){
  m.innerHTML='<div class="card"><h2>Recovery</h2><div class="sk"></div></div>';
  srv('recovery').then(function(d){
    if(!d.prev){
      m.innerHTML='<div class="card"><h2>Recovery</h2><div class="mut">'+esc(d.note||'Hakuna data bado — pakia orodha ya kwanza.')+'</div></div>';
      return;
    }
    var c=d.counts||{};
    m.innerHTML=
      '<div class="card"><h2>Recovery — '+esc(d.prev)+' → '+esc(d.latest)+'</h2>'
      +'<div class="mut" style="margin-bottom:10px">Nani amerudi baada ya simu zetu: tunalinganisha upload mbili za mwisho, mteja kwa mteja (IMEI).</div>'
      /* Four of the five filter the table below; "wamelinganishwa" is the denominator --
         everybody on both decks -- which is the whole book, and the whole book already has
         a pane of its own. Sending somebody to a fifth copy of Wateja would be worse than
         the door they already have. */
      +'<div class="tiles">'
      +tile('Wamelinganishwa',money(c.compared),'wapo kwenye deki zote mbili',
        { go:function(){ goWith('cust',function(){ CUST.list='leo45'; }); }, cta:'wateja ›' })
      +tile('Wamelipa mara ya kwanza',money(c.paidNew),'',
        Object.assign({color:'ok'},recBy('paid')))
      +tile('Siku-offline zimepungua',money(c.reconnected),'',
        Object.assign({color:'ok'},recBy('better')))
      +tile('Wamezidi kuzama',money(c.deeper),'wanahitaji simu leo',
        Object.assign({color:'bad'},recBy('worse')))
      +tile('Wametoka kwenye orodha',money(c.leftList),'hawakuwepo leo',recBy('left'))
      +'</div>'
      /* The same week the dashboard is standing on, and its own way to move it -- the
         dashboard's bar is not on this screen, and a pane that inherits a week with no
         control is a pane you cannot get out of last Tuesday from. */
      +'<div id="recWkBox" style="margin:10px 0 0"></div>'
      +'<div id="recTrendBox" style="margin:14px 0"><div class="mut">Inapakia chati…</div></div>'
      /* BRANCH, not the shop-derived team. watu_snapshots only ever carries KINONDONI for
         this dealer (teamFromShop turns "Hoop Limited, Kinondoni" into one team name), so
         this column read the same word on every row. The server now overlays the offline
         queue's real branch per IMEI; the deck's team stays as the fallback. */
      +(d.notListed?'<div class="note">'+money(d.notListed)+' hawakuorodheshwa hapa (orodha ni ndefu mno). '
        +'/ rows beyond the listing cap — the counts above are complete, this table is not.</div>':'')
      +'<div class="scroll"><table><thead><tr><th>Mteja</th><th>Branch</th><th class="r">OFF jana</th><th class="r">OFF leo</th><th></th></tr></thead><tbody>'
      +recRows(d.rows||[]).map(function(r){
        /* OFF leo is green only when it actually fell. Painting a rising number green --
           which it was, for every row -- is the one thing this column must never do. */
        var down=(r.now!=null&&Number(r.now)<Number(r.was));
        return '<tr><td>'+esc(r.name)+'<div class="mut" style="font-size:10px">'+esc(r.imei)+'</div></td><td>'+esc(r.branch||r.team||'')+'</td>'
          +'<td class="r">'+money(r.was)+'</td>'
          +'<td class="r"'+(down?' style="color:var(--ok)"':(r.now==null?'':' style="color:var(--bad)"'))+'>'
          +(r.now==null?'<span class="mut">hayupo</span>':money(r.now))+'</td>'
          +'<td>'+recChip(r)+'</td></tr>';
      }).join('')
      +(recRows(d.rows||[]).length?'':'<tr><td colspan="5" class="mut">Hakuna mstari wa aina hii. / Nothing in this slice — tap the tile again for all of them.</td></tr>')
      +'</tbody></table></div></div>';
    wireTiles(m);
    drawRecoveryTrend();
  }).catch(function(e){ paneFailed(m,e); });
}

/* ===================================================================================
   THE WEEK'S 7+ RECOVERY, AS A PICTURE.
     "how many 7+ reduced daily on week trend - graphical"

   One bar per day, Monday to Sunday, fixed -- the same week the Locked 7+ chart uses, so
   the two charts on two screens are always describing the same seven days. The bar's full
   height is that morning's OFF JANA pool (everyone 7+ on yesterday's upload); the filled
   part is how many of them had their days_offline actually FALL by today. So the eye reads
   recovery as "how much of the bar came back", and the caption underneath says it in
   numbers: 4/15.

   A day with no upload -- or no upload before it to measure against -- is drawn as a gap
   and SAID so, never as a zero. "Nobody uploaded" and "nobody recovered" are different
   facts and must never look the same on a chart somebody makes decisions from.

   Plain inline SVG: no library, no network, and it prints. */
function svgRecoveryBars(pts){
  var vals=pts.filter(function(p){return p.offJana!=null;}).map(function(p){return p.offJana;});
  if(!vals.length) return '';
  var max=Math.max.apply(null,vals)||1, n=pts.length;
  var W=720,H=200,padL=44,padB=40,padT=16,padR=8;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var slot=innerW/n, bw=Math.min(56,slot*0.62);
  var yOf=function(v){ return padT+innerH-(max?(v/max)*innerH:0); };
  var dayName=function(iso){
    var wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return wd[new Date(iso+'T00:00:00').getDay()];
  };
  var today=(new Date(Date.now()+3*3600*1000)).toISOString().slice(0,10);
  var grid='',bars='',labels='';
  [0,0.5,1].forEach(function(f){
    var y=padT+innerH-f*innerH, v=Math.round(max*f);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'
      +'<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+money(v)+'</text>';
  });
  pts.forEach(function(p,i){
    var cx=padL+slot*i+slot/2, isToday=(p.date===today);
    labels+='<text x="'+cx+'" y="'+(H-padB+17)+'" text-anchor="middle" font-size="11" '
      +'font-weight="'+(isToday?'700':'400')+'" fill="var(--mut)">'+esc(dayName(p.date))+'</text>';
    if(p.offJana==null){
      labels+='<text x="'+cx+'" y="'+(padT+innerH-6)+'" text-anchor="middle" font-size="10" fill="var(--soft)">—</text>'
        +'<text x="'+cx+'" y="'+(H-padB+31)+'" text-anchor="middle" font-size="9.5" fill="var(--soft)">hakuna upload</text>';
      return;
    }
    // The whole pool as a light bar, the recovered part filled over it.
    var yA=yOf(p.offJana), hA=Math.max(2,padT+innerH-yA);
    bars+='<rect x="'+(cx-bw/2)+'" y="'+yA+'" width="'+bw+'" height="'+hA+'" rx="4" fill="var(--b100)"/>';
    if(p.pending){
      /* The list was worked today; the answer arrives with TOMORROW's upload. Showing 0
         recovered here would put a zero against people who have done the work and are
         waiting on a file that does not exist yet. */
      labels+='<text x="'+cx+'" y="'+(yA-5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mut)">'
        +money(p.offJana)+'</text>'
        +'<text x="'+cx+'" y="'+(H-padB+31)+'" text-anchor="middle" font-size="9.5" fill="var(--soft)">kesho</text>';
      return;
    }
    var yR=yOf(p.reduced), hR=Math.max(0,padT+innerH-yR);
    bars+=(p.reduced>0?'<rect x="'+(cx-bw/2)+'" y="'+yR+'" width="'+bw+'" height="'+hR+'" rx="4" fill="var(--ok)"/>':'');
    labels+='<text x="'+cx+'" y="'+(yA-5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'
      +money(p.reduced)+'/'+money(p.offJana)+'</text>'
      +'<text x="'+cx+'" y="'+(H-padB+31)+'" text-anchor="middle" font-size="9.5" fill="var(--soft)">'
      +(p.offJana?Math.round(100*p.reduced/p.offJana)+'%':'—')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'
    +grid+bars+labels+'</svg>';
}
/* THE COMMENT BOX HAS TO STAY IN SIGHT WHILE IT IS BEING TYPED INTO.
     "when someone wants to comment in app, the customer board doesnt rise, so they type
      without preview of whats being written"

   This used to be forty lines of measuring, because the customer panel was an ordinary card
   at the BOTTOM of the page flow: window.scrollBy could only move it while the document still
   had room to scroll, and the card was usually the last thing on the page, so the scroll was
   correct and simply had nowhere to go. The workaround gave the page temporary bottom padding
   to scroll into.

   All of that was a consequence of WHERE the panel lived, and the panel has moved. A drawer
   is position:fixed with its own internal scroll, so the field always has somewhere to go --
   which is exactly why HOPE never needed the measuring. What HOPE does need, and what is
   ported here, is one line: a fixed element does NOT shrink to the visual viewport by itself
   on every Android WebView, so the panel is resized to the visible area when the keyboard
   opens. Everything above it then works the way the CSS already said it would.

   It covers #scrIn too. The sign-in box is the same shape -- position:fixed, centred instead
   of flush to the bottom -- and would hide the code field behind the keyboard for the same
   reason, on the one screen nobody can get past. */
function fitPanelToKeyboard_(id){
  var vv=window.visualViewport, bg=document.getElementById(id);
  if(!vv||!bg) return;
  bg.style.height=vv.height+'px';
  /* AND the min-height with it. A stylesheet min-height outranks an inline height, so
     setting one without the other leaves the panel exactly as tall as it was -- which is
     precisely how the sign-in box sat still while this ran on every keyboard event. */
  bg.style.minHeight=vv.height+'px';
  bg.style.top=vv.offsetTop+'px';
}
(function(){
  var vv=window.visualViewport; if(!vv) return;
  var ids=['drawerBg','scrIn'];
  function refit(){
    ids.forEach(function(id){
      var bg=document.getElementById(id);
      if(bg&&bg.style.display!=='none'&&!bg.classList.contains('hide')) fitPanelToKeyboard_(id);
    });
  }
  vv.addEventListener('resize',refit);
  vv.addEventListener('scroll',refit);
})();
/* Belt and braces for a WebView slow to fire visualViewport's resize: once the keyboard's own
   animation has had time to run, bring the field being typed into back inside its panel's
   visible area, so even a late resize still ends with the words on screen. Delegated from the
   document because the drawer's contents are rebuilt on every open. */
document.addEventListener('focusin',function(e){
  var t=e.target;
  if(!t||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(!t.closest||!t.closest('#drawerBg, #scrIn')) return;
  setTimeout(function(){
    try{ t.scrollIntoView({block:'center',behavior:'smooth'}); }catch(err){ t.scrollIntoView(); }
  },300);
});

/* ---------- devices: the phone-locking registry ----------
   The SERVER half of locking. The Android app that draws the lock screen is a separate
   build; until it exists every phone reads "hajawahi kuongea" (never spoke) -- the honest
   state, not an error.

   THE DISTINCTION THIS SCREEN EXISTS TO KEEP: a lock ORDERED is not a lock CONFIRMED. The
   office's intent and the phone's own last word are two different facts, so a phone told
   to lock that has not checked in reads PENDING -- never "locked", and never a failure. */
/* filter = a STATE the server can select on; flag = a per-row judgement (neverSeen, stale)
   that only exists once a row is drawn. Never both at once: they are two different questions
   and answering both leaves a screen nobody can read the count off. */
var DEV={filter:'',flag:''};
function drawDevices(m){
  m.innerHTML='<div class="card"><h2>Devices</h2><div class="sk"></div></div>';
  srv('deviceList',{state:DEV.filter}).then(function(d){
    var c=d.counts||{};
    var chips=[['','Zote / all'],['enrolled','Enrolled'],['locked','Locked'],['released','Released'],['lost','Lost']];
    // A chip reads as ON only when nothing else is filtering; otherwise two controls would
    // both look live while only one of them is deciding what is on screen.
    var chipOn=function(v){ return !DEV.flag && DEV.filter===v; };
    /* THE FIVE TILES ARE THE FIVE LISTS, and clicking one filters the table under it.
       Three of them are states the server can ask the database for; the other two --
       "never spoke" and "silent" -- are judgements the server makes per row and hands down
       as flags, so they filter here, on rows already loaded. Clicking the live one clears
       it, which is the only way back to "zote" that does not need a second control. */
    var byState=function(st){ return { on:DEV.filter===st&&!DEV.flag, cta:'chuja ›',
      go:function(){ DEV.filter=(DEV.filter===st&&!DEV.flag?'':st); DEV.flag=''; drawDevices(m); } }; };
    var byFlag=function(f){ return { on:DEV.flag===f, cta:'chuja ›',
      go:function(){ DEV.flag=(DEV.flag===f?'':f); DEV.filter=''; drawDevices(m); } }; };
    var tiles='<div class="tiles">'
      +tile('Zimesajiliwa',money(c.enrolled||0),'tayari, hazijafungwa',byState('enrolled'))
      +tile('Zimefungwa',money(c.locked||0),
        ((c.lockPending||0)?money(c.lockPending)+' bado hazijathibitisha':'zote zimethibitisha'),
        Object.assign({color:((c.locked||0)?'bad':'')},byState('locked')))
      +tile('Hazijawahi kuongea',money(c.neverSeen||0),'app haijafunguliwa',byFlag('neverSeen'))
      +tile('Kimya / silent',money(c.stale||0),'zaidi ya saa 36',byFlag('stale'))
      +tile('Zimeachiwa',money(c.released||0),'mkopo umeisha',
        Object.assign({color:'ok'},byState('released')))
      +'</div>';
    var bar='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">'
      +chips.map(function(x){ return '<button class="btn sm'+(chipOn(x[0])?'':' ghost')+'" data-dvf="'+x[0]+'">'+x[1]+'</button>'; }).join('')
      +'<span style="flex:1"></span><button class="btn sm" id="dvEnrol">+ Sajili simu / Enrol phones</button></div>';
    /* neverSeen and stale ride on the row, so this fence is the same fact the tile counted
       -- never a second definition of "silent" that could drift from the one in the tile. */
    var rows=(d.rows||[]).filter(function(r){ return !DEV.flag || r[DEV.flag]===true; });
    var table=rows.length
      ? '<div class="scroll"><table><thead><tr>'
        +'<th class="noxl"><input type="checkbox" id="dvAll" title="Chagua zote zinazoonekana / select all shown"></th>'
        +'<th>IMEI</th><th>Item</th><th>Holder</th><th>Hali / state</th>'
        +'<th>Uliagiza / last order</th>'
        +'<th>Simu inasema</th><th>Iliongea lini</th><th class="noxl"></th></tr></thead><tbody>'
        +rows.map(function(r){
          var st=r.state==='locked'?(r.lockState==='pending'?'<span class="chip warn">imeagizwa · bado</span>':'<span class="chip bad">imefungwa</span>')
            :r.state==='released'?'<span class="chip ok">imeachiwa</span>'
            :r.state==='lost'?'<span class="chip bad">imepotea</span>':'<span class="chip">tayari</span>';
          /* THE TIME IT SPOKE, with the age underneath. The clock is what lets you place the
             beat either side of the order you gave; the age is what makes a dead phone
             obvious without doing arithmetic. Both, because they answer different questions,
             and the red still belongs to the age's fact -- silence, not lateness. */
          var age=agoMins(r.silentMins);
          var seen=r.neverSeen?'<span class="mut">hajawahi</span>'
            :(r.stale?'<span style="color:var(--bad)">':'<span>')+esc(clock(r.seenAt)||age)+'</span>'
              +(age?'<div class="mut" style="font-size:10px">'+esc(age)+'</div>':'');
          return '<tr><td class="noxl"><input type="checkbox" class="dvck" value="'+esc(r.imei)+'"></td>'
            +'<td style="font-size:11px">'+esc(r.imei)+'</td><td>'+esc(r.item||'—')+'</td>'
            +'<td>'+esc(r.holder||'—')+'</td><td>'+st+'</td>'
            /* WHAT YOU LAST ORDERED, next to what the phone says about itself.
               "simu inasema = locked but i just unlocked"
               Those two columns disagreeing is normal for a moment and alarming without
               this one: an unlock given ten seconds ago and one given yesterday mean
               completely different things about a handset still reporting locked. The age
               is what turns "is this broken" into "has it had time to hear me". */
            +'<td>'+esc(r.lastOrder||'—')
              +(r.orderAt||r.orderAgeMins!=null?'<div class="mut" style="font-size:10px">'
                +esc(clock(r.orderAt)||agoMins(r.orderAgeMins))
                +(r.orderBy?' · '+esc(r.orderBy):'')+'</div>':'')
            +'</td>'
            +'<td>'+esc(r.reported||'—')+devWhere(r)+'</td><td>'+seen+'</td>'
            +'<td class="r noxl"><button class="btn sm ghost" data-dvt="'+esc(r.imei)+'">Token</button> '
            +'<button class="btn sm ghost" data-dvh="'+esc(r.imei)+'">Historia</button> '
            +'<button class="btn sm danger" data-dvd="'+esc(r.imei)+'" title="Ondoa kwenye register / Remove from the register">Futa</button></td></tr>';
        }).join('')+'</tbody></table></div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center">'
        +'<b style="font-size:12px">Zilizochaguliwa: <span id="dvCount">0</span></b>'
        +'<button class="btn sm danger" data-dvs="locked">Funga / Lock</button>'
        +'<button class="btn sm" data-dvs="enrolled">Fungua / Unlock</button>'
        +'<button class="btn sm ghost" data-dvs="released">Achia / Release</button>'
        +'<button class="btn sm ghost" data-dvs="lost">Imepotea / Write off</button></div>'
      : (d.notReady
        /* NOT THE SAME THING as an empty register, and it must not read like one: nobody
           would ever guess from "no devices yet" that the answer is to run a SQL file. */
        ? '<div class="note bad">Jedwali la vifaa halijatengenezwa bado. Endesha '
          +'<b>db/migrations/RUN-ME-2026-08-24-devices.sql</b> kwenye Supabase, kisha rudi hapa. '
          +'/ The devices table has not been created yet — run that migration, then come back.</div>'
        : '<div class="mut">Hakuna kifaa kwenye kundi hili. Bofya "Sajili simu" — weka IMEI kutoka ripoti ya stock. '
          +'/ No devices here yet; enrol IMEIs from the stock report to begin.</div>');
    m.innerHTML='<div class="card"><h2>Devices / Kufunga simu</h2>'
      +'<div class="mut" style="margin-bottom:8px">Simu tulizozidhibiti, kwa IMEI. <b>Kuagiza kufunga si sawa na kufungwa</b> — '
      +'simu ikishathibitisha ndipo inasomeka "imefungwa". App ya simu ikiwa bado haijajengwa, zote zitasoma "hajawahi kuongea". '
      +'/ Ordering a lock is not the same as a confirmed lock.</div>'
      +tiles+bar+table+'<div id="dvHist" style="margin-top:10px"></div></div>';
    wireTiles(m);
    $all('[data-dvf]').forEach(function(b){ b.onclick=function(){ DEV.filter=b.getAttribute('data-dvf'); DEV.flag=''; drawDevices(m); }; });
    $('#dvEnrol').onclick=function(){ devEnrolForm(m); };
    $all('[data-dvs]').forEach(function(b){ b.onclick=function(){ devSetState(m, b.getAttribute('data-dvs')); }; });
    $all('[data-dvh]').forEach(function(b){ b.onclick=function(){ devHistory(b.getAttribute('data-dvh')); }; });
    $all('[data-dvt]').forEach(function(b){ b.onclick=function(){ devToken(b.getAttribute('data-dvt')); }; });
    $all('[data-dvd]').forEach(function(b){ b.onclick=function(){ devDelete(m, b.getAttribute('data-dvd')); }; });
    devWireTicks_();
  }).catch(function(e){ paneFailed(m,e); });
}

/* TICK ALL, AND THE COUNT BESIDE THE BUTTONS.
   =========================================================================================
     "Add Bulk Tick checkbox on the first column before imei that selects all list"

   IT ONLY EVER TICKS ROWS YOU CAN SEE, and that is the whole design rather than a detail.
   The column funnels hide rows without unticking them, so a select-all that reached hidden
   rows would arm Funga against phones that are not on screen -- filter to one branch, tick
   all, lock, and you have just locked the other branches' handsets too. "You act on what you
   see" is the same rule the Excel export already follows, and the two must not disagree.

   The count exists for the same reason. Funga on a bulk selection is irreversible from the
   office in one direction -- every one of those phones goes dark to its customer -- so the
   number of phones about to be affected belongs next to the button, not inferred from ticks
   scrolled off the top of the screen. */
function devVisibleTicks_(){
  return $all('.dvck').filter(function(c){
    var tr=c.closest('tr');
    return tr && tr.style.display!=='none' && !tr.classList.contains('fhide');
  });
}
function devSyncTicks_(){
  var vis=devVisibleTicks_(), on=vis.filter(function(c){ return c.checked; });
  var n=$('#dvCount'); if(n) n.textContent=String(on.length);
  var all=$('#dvAll');
  if(all){
    all.checked = vis.length>0 && on.length===vis.length;
    // Partly ticked reads as neither on nor off, which is what it is.
    all.indeterminate = on.length>0 && on.length<vis.length;
  }
}
function devWireTicks_(){
  var all=$('#dvAll');
  if(all) all.onclick=function(){
    var want=all.checked;
    devVisibleTicks_().forEach(function(c){ c.checked=want; });
    devSyncTicks_();
  };
  $all('.dvck').forEach(function(c){ c.onclick=function(){ devSyncTicks_(); }; });
  devSyncTicks_();
}
function devPicked(){ return devVisibleTicks_().filter(function(c){ return c.checked; }).map(function(c){ return c.value; }); }
function devSetState(m, state){
  var imeis=devPicked();
  if(!imeis.length){ toast('Chagua simu kwanza. / Pick some phones first.', true); return; }
  var reason='';
  if(state==='locked'||state==='lost'){
    reason=prompt((state==='locked'?'Sababu ya kufunga':'Sababu')+' / Reason (required):')||'';
    if(!reason.trim()){ toast('Sababu inahitajika. / A reason is required.', true); return; }
  }
  devSend_(m, imeis, state, reason.trim(), false);
}
/* THE ORDER, AND THE ONE REFUSAL THAT IS WORTH ARGUING WITH.
   =========================================================================================
     "funga for already achia should refuse and say you cant funga achia, proceed anyway if
      you will install app"

   A released handset that has not spoken since is not listening: it dropped Device Owner and
   stopped calling home, so a lock ordered against it sits unheard while the register reads
   "imeagizwa · bado" and the office waits on a phone that stopped asking days ago.

   So the server refuses -- and offers the way through, because there IS one honest reason to
   give an order a phone cannot currently hear: you are about to put the app back on it by
   cable and you want the lock waiting when it wakes. That is deliberate, so it takes a
   deliberate yes rather than being the default.

   Only the phones the server named are retried. Ticking twenty and having one unreachable
   must not turn a confirmation about that one into a second lock order for the other
   nineteen -- they were locked the first time. */
function devSend_(m, imeis, state, reason, force){
  srv('deviceSetState',{imeis:imeis,state:state,reason:reason,force:force===true}).then(function(r){
    toast('Zimebadilishwa: '+money(r.changed)
      +(r.notEnrolled?' · '+money(r.notEnrolled)+' hazijasajiliwa':'')
      +(r.alreadyThere?' · '+money(r.alreadyThere)+' zilikuwa hivyo':'')
      +(r.woken?' · '+money(r.woken)+' zimeamshwa':''));
    drawDevices(m);

/* THE STATION'S SCRIPT. A token on its own is a string nobody can act on -- what the bench
   needs is the two lines that put it into the handset in front of them. So the commands are
   built here, with the token already in them, rather than left in a document to be copied
   out and edited by hand fifty times. */
var DEVCMP='com.samaritantechs.hooploanlock/.LockAdmin';
var DEVPKG='com.samaritantechs.hooploanlock';
/* ONE LINE, PASTED ONCE, AND IT MUST RUN ON THE BENCH THAT EXISTS.
   =========================================================================================
     "the copying cmd from clipboard in system at device should be the single command to
      configure phone"

   What this used to produce could not run at all on that bench, and had three separate
   reasons why -- every one of them already found and fixed in the docs, and none of them
   fixed HERE, which is the copy the station actually pastes:

     `\` line continuations   bash. In cmd.exe the first line runs truncated and the rest
                              arrive as broken commands.
     `adb install` bare       no -r, so a handset that already has the app is refused; and a
                              relative path that only resolves if you happen to be standing
                              in the right folder.
     no --include-stopped-packages
                              the enrol silently does nothing on a freshly installed app and
                              prints result=0, which reads exactly like success. That one
                              cost twenty hours on a real handset.

   So: one line, absolute path, every flag present, the token already in it. Paste, enter,
   done.

   AND THE ENROL IS NOT CHAINED BEHIND `&&`, which is what let the second box go away.
   -----------------------------------------------------------------------------------------
     "token copying just have 3 cmd at once dont confuse me nor sipho we taking it nowhere
      all we need is cmd to sinle paste and run"
     "just one view and copy now you added the 3rd and am confused"

   The screen used to offer the three separate commands as well, because `&&` stops at the
   first failure and the commonest stop on this bench is not a failure at all: a phone being
   redone answers "device owner is already set", which is the finished state. Two boxes and a
   paragraph explaining when to use which -- a rule the operator has to read, understand and
   apply correctly at the exact moment the phone in their hand did something unexpected.

   In cmd.exe `&` runs the next command whatever happened to the last one. So the group runs
   set-device-owner, then the enrol REGARDLESS -- which is precisely the behaviour the second
   box existed to provide, done by the shell instead of by a person. "already set" now scrolls
   past and the enrol lands. The install keeps its `&&`: if the APK is not there, nothing
   downstream can work and the operator should see one error, not three.

   Guarded by the parentheses, not by cmd's precedence rules -- an explicit group is the same
   on every Windows this will ever touch, and this is not a line to be clever on. */
function devOneLiner(token){
  return 'adb install -r "%USERPROFILE%\\Downloads\\HOOPLOAN-Lock.apk"'
    + ' && (adb shell dpm set-device-owner ' + DEVCMP
    + ' & adb shell am broadcast --include-stopped-packages'
    + ' -a ' + DEVPKG + '.ENROL -n ' + DEVPKG + '/.EnrolReceiver'
    + ' -e server ' + location.origin + ' -e token ' + token + ')';
}
function devCopyBox(id){
  var t=$('#'+id); if(!t) return; t.select();
  try{ document.execCommand('copy'); toast('Imenakiliwa / copied'); }
  catch(e){ toast('Chagua na nakili mwenyewe. / Select and copy manually.', true); }
}
function devProvision(m, r){
  var p=r.provision||[];
  if(!p.length){ closeDrawer(); drawDevices(m); return; }
  /* NEW PHONE OR ONE WE ALREADY KNEW, said out loud on every line.
       "achia and relock/re-enroll should repick same token used before if the imei exists"

     A known IMEI keeps the token it already holds -- so the handset needs nothing done to
     it, and the operator needs to SEE that rather than wonder whether the register has just
     handed the phone in their hand a second identity. `tayari` on a line means: same phone,
     same token, this command only reinstalls and re-arms it. */
  /* THE COMMAND ARRIVES FINISHED. NOBODY EDITS ANYTHING.
     =======================================================================================
       "enrolling should come complete singele updated cmd and not [a PASTE_THE_TOKEN_HERE
        template]"

     This handed out a template with a placeholder and a paragraph telling the operator to
     swap the token in by hand -- for every phone, fifty times a morning, from a list in
     another box. Every one of those edits is a chance to paste the wrong phone's identity
     into a handset, and the only way to find out is a customer's phone answering for
     somebody else's loan, with a factory reset as the way back.

     The token was already known per phone by the time this screen drew. There was never a
     reason to make a person retype it. */
  var one = p.length === 1;
  var cmds = p.map(function(x){ return devOneLiner(x.token); }).join('\n');
  var lines = p.map(function(x){
    return x.imei+'\t'+x.token+'\t'+(x.fresh===false?'tayari / known':'mpya / new');
  }).join('\n');
  drawer('<h3>'+(one?'Simu · '+esc(p[0].imei):'Simu '+money(p.length))+'</h3>'
    +'<div class="sub"><b>Bandika kwenye cmd, bonyeza enter.</b> '
    +'/ Paste into the black cmd window, press enter. '
    +(one?'':'Amri moja kwa kila simu — nakili mstari mmoja kwa simu moja. '
      +'/ One command per phone: copy ONE line for ONE handset. ')
    +'Pakua APK kwanza kutoka <a href="/HOOPLOAN-Lock.apk">/HOOPLOAN-Lock.apk</a>. '
    +'Simu lazima iwe mpya au imefutwa (bila akaunti yoyote). '
    +'/ The handset must have no accounts on it — box-fresh or factory reset.</div>'
    +'<textarea id="dvAdb" rows="'+(one?5:Math.min(14,Math.max(4,p.length*2)))+'" readonly '
    +'style="width:100%;font-family:ui-monospace,monospace;font-size:11px">'+esc(cmds)+'</textarea>'
    +'<button class="btn w" id="dvAdbCopy">Nakili amri / Copy the command'+(one?'':'s')+'</button>'
    /* The IMEI-to-token list stays for MANY phones and goes for one, because with a single
       handset the token is already inside the command above and a second box holding the
       same string was exactly the confusion that got the Token drawer cut down to one. */
    +(one?''
      : '<div class="sub" style="margin-top:12px">Ipi ni ya nani — na <b>tayari</b> maana yake '
        +'simu ile ile, token ile ile. / Which token belongs to which phone. <b>tayari</b> means '
        +'the register already knew this handset and gave it back its own identity.</div>'
        +'<textarea id="dvTok" rows="'+Math.min(12,Math.max(3,p.length))+'" readonly '
        +'style="width:100%;font-family:ui-monospace,monospace;font-size:12px">'+esc(lines)+'</textarea>'
        +'<button class="btn w ghost" id="dvTokCopy">Nakili orodha / Copy the list</button>')
    +'<div class="sub" style="margin-top:12px">Ya mwisho ndiyo muhimu: <b>result=1</b> na neno '
    +'<b>ENROLLED</b>. / The line that matters is the last one: <b>result=1 … ENROLLED</b>.</div>'
    +'<button class="btn w ghost" id="dvTokDone" style="margin-top:6px">Nimemaliza / Done</button>');
  $('#dvAdbCopy').onclick=function(){ devCopyBox('dvAdb'); };
  if($('#dvTokCopy')) $('#dvTokCopy').onclick=function(){ devCopyBox('dvTok'); };
  $('#dvTokDone').onclick=function(){ closeDrawer(); drawDevices(m); };
}

/* ---------- salary advance: ask, decide, pay ----------
   "hoop users should get a nav pane and be able to make advance requests, their leaders will
    be assigned with another approval nav ... there is salary advance report nav that I'll
    grant to hr which hr will use for filing and bank payment report"

   Three panes over one table. Nothing here asks what anybody's ROLE is -- which pane you see
   is which nav you were granted, and that is the whole permission model. The owner makes an
   HR role and ticks the report on it; the code never learns the word HR.

   THE AMOUNTS COME FROM THE SERVER, not from a list typed in here. The server enforces the
   same four when the request lands, and a dropdown built from a second copy of that list is a
   dropdown that will one day disagree with what the server will accept. */
function advWhen(ms){
  if(!ms) return '';
  var d=new Date(Number(ms)); if(isNaN(d.getTime())) return '';
  var p=function(n){ return (n<10?'0':'')+n; };
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()
    +' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* One vocabulary for the three states, so the requester's pane, the queue and HR's report
   never label the same row differently. */
function advChip(r){
  if(r.status==='approved') return '<span class="chip ok">imekubaliwa'
    +(r.approved!=null&&r.approved!==r.amount?' · '+money(r.approved):'')+'</span>';
  if(r.status==='declined') return '<span class="chip bad">imekataliwa</span>';
  return '<span class="chip warn">inasubiri</span>';
}
