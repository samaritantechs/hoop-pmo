<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOOP PMO — Portal</title>
<style>
:root{ --b950:#081C4A; --b900:#0B2A6B; --b800:#10357F; --b700:#1D4ED8; --b600:#2563EB; --b300:#93C5FD; --b100:#DBEAFE; --b50:#EFF6FF;
  --bg:#F6F8FC; --card:#fff; --ink:#0F172A; --mut:#64748B; --soft:#94A3B8; --line:#E2E8F0;
  --ok:#067647; --okbg:#E7F6EE; --warn:#92400E; --warnbg:#FEF3DC; --bad:#B42318; --badbg:#FDECEA; --sky:#35A8E1; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.hide{display:none!important}
/* sign-in */
#scrIn{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--b900),var(--b800))}
.incard{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:380px;margin:16px;box-shadow:0 12px 34px -14px rgba(8,28,74,.45)}
.mark{width:76px;display:block;margin-bottom:10px}
.incard h1{font-size:18px;margin:0 0 4px}
.incard p{font-size:13px;color:var(--mut);margin:0 0 14px}
input,select,textarea{font-family:inherit}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
.btn.w{width:100%;margin-top:12px;padding:14px}
.btn.ghost{background:#fff;color:var(--b700);border:1.5px solid var(--b100)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{background:var(--b300)}
.err{background:var(--badbg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:10px;display:none}
/* shell */
header.top{background:var(--b900);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.toprow{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.toprow .who{flex:1;min-width:0}
.toprow .who b{display:block;font-size:14px}
.toprow .who span{font-size:11px;color:var(--b300)}
.toprow .lg{width:52px}
/* The nav lives on the LEFT, as in Hope's portal: a column of tabs beside the work. */
.shell{display:flex;max-width:1120px;margin:0 auto;align-items:flex-start}
aside.side{flex:0 0 185px;padding:16px 0 16px 14px;position:sticky;top:66px}
.tabs{display:flex;flex-direction:column;gap:6px}
.tabs button{background:#fff;color:var(--b800);border:1px solid var(--line);text-align:left;
  padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--b700);border-color:var(--b700);color:#fff}
/* The two doors that leave the portal ride at the bottom of the same left nav. */
.tabs .sep{height:1px;background:var(--line);margin:5px 2px}
.tabs .lnk{display:block;background:#fff;color:var(--b800);border:1px solid var(--line);text-align:left;
  padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none}
main{flex:1;min-width:0;padding:16px}
/* The three lines open and close it -- everywhere. Closed, the work takes the width. */
#navBtn{flex:0 0 auto;font-size:17px;line-height:1;padding:7px 11px}
body.nav-closed aside.side{display:none}
.navBack{display:none}
@media(max-width:760px){
  /* On a phone the open nav is a drawer OVER the page, with a backdrop that closes it. */
  aside.side{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--bg);z-index:20;
    padding:70px 10px 16px 12px;overflow-y:auto;box-shadow:8px 0 30px -12px rgba(8,28,74,.45)}
  body:not(.nav-closed) .navBack{display:block;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:15}
  main{padding:10px 8px}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.14)}
.tile .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:800;margin-top:4px}
.tile .s{font-size:11px;color:var(--soft);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.12)}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--b50);color:var(--b900);font-size:10.5px;text-transform:uppercase}
td.r,th.r{text-align:right}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row .inp{width:auto;flex:1;min-width:120px}
.mut{color:var(--mut);font-size:12.5px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.08em}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;display:none;z-index:9}
.toast.bad{background:var(--bad)}
.road li{margin-bottom:8px;line-height:1.5}
@media(max-width:640px){ th,td{padding:7px 6px} }
</style>
</head>
<body>

<div id="scrIn">
  <div class="incard">
    <svg class="mark" viewBox="0 0 64 40"><rect width="64" height="40" rx="9" fill="#EFF6FF"/><text x="32" y="21" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-1" fill="#2E2B7A" font-family="Arial">HOOP</text><path d="M22 26 A 11 11 0 0 0 42 26" fill="none" stroke="#35A8E1" stroke-width="4" stroke-linecap="round"/></svg>
    <h1>HOOP PMO</h1>
    <p>Mfumo wa ufuatiliaji — watu simu. Ingia na msimbo wako. / Sign in with your access code.</p>
    <input class="inp" type="password" id="inCode" placeholder="Access code" autocomplete="off">
    <div class="err" id="inErr"></div>
    <button class="btn w" id="inBtn">Ingia / Sign in</button>
  </div>
</div>

<div id="scrApp" class="hide">
  <header class="top">
    <div class="toprow">
      <button class="btn sm ghost" id="navBtn" title="Menyu">&#9776;</button>
      <svg class="lg" viewBox="0 0 64 40"><rect width="64" height="40" rx="9" fill="#fff"/><text x="32" y="21" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-1" fill="#2E2B7A" font-family="Arial">HOOP</text><path d="M22 26 A 11 11 0 0 0 42 26" fill="none" stroke="#35A8E1" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
      <a class="btn sm ghost" href="/upload">Upload</a>
      <a class="btn sm ghost" href="/call">Calls</a>
      <button class="btn sm ghost" id="outBtn">Toka</button>
    </div>
</header>
  <div class="shell">
    <div class="navBack" id="navBack"></div>
    <aside class="side">
      <div class="tabs" id="tabs">
      <button data-t="dash" class="on">Dashboard</button>
      <button data-t="cust">Wateja / Customers</button>
      <button data-t="ripoti">Call reports</button>
      <button data-t="recovery">Recovery</button>
      <button data-t="mauzo" id="tabMauzo">Sales</button>
      <button data-t="teams">Teams</button>
      <button data-t="staff">Staff</button>
      <button data-t="codes" id="tabCodes">Access codes</button>
      <button data-t="settings" id="tabSettings">Settings</button>
      <div class="sep"></div>
      <a class="lnk" href="/upload">Upload &nearr;</a>
      <a class="lnk" href="/call">HOOP Calls &nearr;</a>
    </div>
      </aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pct(x){ return (x==null||isNaN(x))?'—':Math.round(100*x)+'%'; }
function fmtDur(sec){ sec=Math.max(0,Math.round(Number(sec)||0)); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=function(n){return(n<10?'0':'')+n;}; return h>0?(h+':'+p(m)+':'+p(s)):(m+':'+p(s)); }
function telHref(v){ var d=String(v==null?'':v).replace(/\D/g,''); if(!d) return '#'; return d.indexOf('255')===0?'+'+d:'+255'+d.replace(/^0+/,''); }
function toast(m,bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':''); t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3500); }
function isoToday(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); var p=function(n){return('0'+n).slice(-2);}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

var CODE='', BOOT=null, TAB='dash';
/* One search box, two jobs: filter the table rows on the page instantly, and (from three
   characters) ask the register for customers by name / phone / IMEI / agent. */
function custRow_(c){
  var h=telHref(c.phone);
  return '<tr><td><b>'+esc(c.name)+'</b><div class="mut" style="font-size:10px">IMEI '+esc(c.imei)+'</div></td>'
    +'<td>'+esc(c.team)+'</td><td>'+esc(c.agent)+'</td>'
    +'<td class="r">'+(c.daysOff!=null?money(c.daysOff):'—')+(c.locked7?' <span class="chip bad">7+</span>':'')+'</td>'
    +'<td class="r">'+(h!=='#'?'<a href="tel:'+h+'" title="'+esc(c.phone)+'">📞</a>':'')+'</td></tr>';
}
function wireSearch_(inputSel, boxSel, filterFn){
  var t=null;
  $(inputSel).addEventListener('input', function(){
    var q=this.value.trim();
    filterFn(q.toUpperCase());
    clearTimeout(t);
    var box=$(boxSel);
    if(q.length<3){ if(box) box.innerHTML=''; return; }
    t=setTimeout(function(){
      srv('customerSearch',{q:q}).then(function(d){
        if($(inputSel).value.trim()!==q) return;
        var cs=d.customers||[];
        if(!box) return;
        box.innerHTML=!cs.length?'':'<div class="card"><h2>Wateja / Customers — '+cs.length+'</h2>'
          +'<div style="overflow-x:auto"><table><thead><tr><th>Mteja</th><th>Timu</th><th>Agent</th><th class="r">OFF</th><th></th></tr></thead><tbody>'
          +cs.map(custRow_).join('')+'</tbody></table></div></div>';
      }).catch(function(){});
    },350);
  });
}
function srv(fn,args){
  return fetch('/api/portal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:CODE,fn:fn,args:args||{}})})
  .then(function(r){ return r.text().then(function(t){ var b; try{b=JSON.parse(t);}catch(e){throw new Error('Server error HTTP '+r.status);}
    if(r.status<200||r.status>=300||b.ok===false) throw new Error(b.error||('HTTP '+r.status)); return b; }); });
}

$('#inBtn').onclick=function(){
  CODE=$('#inCode').value.trim();
  if(!CODE) return;
  $('#inBtn').disabled=true; $('#inErr').style.display='none';
  srv('boot').then(function(d){
    BOOT=d;
    try{ localStorage.setItem('hpCode',CODE); }catch(e){}
    enter();
  }).catch(function(e){
    $('#inBtn').disabled=false;
    $('#inErr').textContent=String(e.message||e); $('#inErr').style.display='block';
  });
};
$('#inCode').addEventListener('keydown',function(e){ if(e.key==='Enter') $('#inBtn').onclick(); });

function enter(){
  $('#scrIn').classList.add('hide'); $('#scrApp').classList.remove('hide');
  $('#whoName').textContent=BOOT.name||'—';
  $('#whoRole').textContent=(BOOT.role||'')+(BOOT.readOnly?' · view-only':'');
  var isAdmin=String(BOOT.role||'').toUpperCase()==='ADMIN';
  var hasSettings=isAdmin||(BOOT.tabs||[]).indexOf('settings')>=0;
  var hasOps=hasSettings||(BOOT.tabs||[]).indexOf('upload')>=0;
  $('#tabCodes').classList.toggle('hide',!hasSettings);
  $('#tabSettings').classList.toggle('hide',!hasSettings);
  $('#tabMauzo').classList.toggle('hide',!hasOps);
  function navSet(open){
    document.body.classList.toggle('nav-closed', !open);
    try{ localStorage.setItem('hpNav', open?'1':'0'); }catch(e){}
  }
  var savedNav=null; try{ savedNav=localStorage.getItem('hpNav'); }catch(e){}
  navSet(savedNav==null ? window.innerWidth>760 : savedNav==='1');
  $('#navBtn').onclick=function(){ navSet(document.body.classList.contains('nav-closed')); };
  $('#navBack').onclick=function(){ navSet(false); };
  $all('#tabs button').forEach(function(b){ b.onclick=function(){
    TAB=b.getAttribute('data-t');
    $all('#tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
    if(window.innerWidth<=760) navSet(false);
    draw();
  };});
  $('#outBtn').onclick=function(){ try{localStorage.removeItem('hpCode');}catch(e){} location.reload(); };
  $('#inBtn').disabled=false;
  draw();
}
(function(){ try{ var c=localStorage.getItem('hpCode'); if(c){ $('#inCode').value=c; $('#inBtn').onclick(); } }catch(e){} })();

function draw(){
  var m=$('#main');
  if(TAB==='dash') return drawDash(m);
  if(TAB==='cust') return drawCust(m);
  if(TAB==='mauzo') return drawMauzo(m);
  if(TAB==='ripoti') return drawRipoti(m);
  if(TAB==='recovery') return drawRecovery(m);
  if(TAB==='teams') return drawTeams(m);
  if(TAB==='staff') return drawStaff(m);
  if(TAB==='codes') return drawCodes(m);
  if(TAB==='settings') return drawSettings(m);
}

/* ---------- dashboard ---------- */
function drawDash(m){
  var s=BOOT.summary||{};
  var n=function(x){ return x&&x.num!=null?money(x.num):'—'; };
  m.innerHTML=
    '<div class="tiles">'
    +'<div class="tile"><div class="l">Orodha ya leo</div><div class="v">'+n(s.list)+'</div><div class="s">'+(s.deckDate?('deck '+esc(s.deckDate)):'hakuna upload bado')+'</div></div>'
    +'<div class="tile"><div class="l">Locked 7+</div><div class="v" style="color:var(--bad)">'+n(s.locked7)+'</div><div class="s">wamefungiwa wiki+, ndani ya 45</div></div>'
    +'<div class="tile"><div class="l">Ndani ya siku 45</div><div class="v">'+n(s.inWindow)+'</div><div class="s">dirisha la Hoop</div></div>'
    +'<div class="tile"><div class="l">Simu leo</div><div class="v">'+n(s.calls)+'</div><div class="s">credit team</div></div>'
    +'<div class="tile"><div class="l">Waliofikiwa</div><div class="v" style="color:var(--ok)">'+(s.reached&&s.reached.pct!=null?pct(s.reached.pct):'—')+'</div><div class="s">'+(s.reached?money(s.reached.num)+' / '+money(s.reached.den):'')+'</div></div>'
    +'</div>'
    +'<div class="card"><h2>Leo unafanyaje / Today’s path</h2>'
    +'<ol class="road" style="margin:0;padding-left:20px">'
    +'<li><a href="/upload">Pakia orodha ya Watu ya leo</a> — Excel kutoka Watu, kama ilivyo.</li>'
    +'<li>Credit team wanafungua <a href="/call">HOOP Calls</a> kwenye simu zao — orodha inajipanga kwa timu, wanaanza kupiga.</li>'
    +'<li>Kesho asubuhi: pakia ya kesho, kisha angalia <b>Recovery</b> — nani amelipa baada ya simu zetu.</li>'
    +'</ol></div>';
}

/* ---------- ripoti ---------- */
var RIP={from:isoToday(-7),to:isoToday(0),team:''};
function drawRipoti(m){
  m.innerHTML='<div class="card"><h2>Call reports — simu za credit team</h2><div class="mut">Inapakia…</div></div>';
  srv('report',{from:RIP.from,to:RIP.to,team:RIP.team}).then(function(d){
    var t=d.totals||{};
    m.innerHTML=
      '<div class="card"><h2>Call reports — simu za credit team</h2>'
      +'<div class="row"><input class="inp" type="date" id="rF" value="'+RIP.from+'"><input class="inp" type="date" id="rT" value="'+RIP.to+'">'
      +'<select class="inp" id="rTeam"><option value="">Timu zote</option>'
      +(d.teams||[]).map(function(x){return '<option'+(x.team===RIP.team?' selected':'')+'>'+esc(x.team)+'</option>';}).join('')
      +'</select></div>'
      +'<div class="tiles">'
      +'<div class="tile"><div class="l">Simu</div><div class="v">'+money(t.calls)+'</div></div>'
      +'<div class="tile"><div class="l">Muda</div><div class="v">'+fmtDur(t.duration)+'</div></div>'
      +'<div class="tile"><div class="l">Portfolio</div><div class="v" style="color:var(--ok)">'+money(t.portfolio)+'</div></div>'
      +'<div class="tile"><div class="l">% pf</div><div class="v">'+(t.calls?pct(t.ratio):'—')+'</div></div>'
      +'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Afisa</th><th class="r">Simu</th><th class="r">Muda</th><th class="r">Wateja</th><th class="r">PF</th><th class="r">Non-PF</th><th class="r">% PF</th><th></th></tr></thead><tbody>'
      +(d.users||[]).map(function(u){
        var h=telHref(u.phone);
        return '<tr><td>'+esc(u.name)+'<div class="mut" style="font-size:10.5px">'+esc(u.team||'')+' '+esc(u.position||'')+'</div></td>'
          +'<td class="r">'+money(u.calls)+'</td><td class="r">'+fmtDur(u.duration)+'</td>'
          +'<td class="r">'+money(u.uniqCustomers)+'</td>'
          +'<td class="r" style="color:var(--ok)">'+money(u.portfolio)+'</td>'
          +'<td class="r" style="color:var(--soft)">'+money(u.nonPortfolio)+'</td>'
          +'<td class="r"'+(u.calls&&u.ratio<0.5?' style="color:var(--bad)"':'')+'>'+(u.calls?pct(u.ratio):'—')+'</td>'
          +'<td class="r">'+(h!=='#'?'<a href="tel:'+h+'" title="'+esc(u.phone)+'">📞</a>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
    $('#rF').onchange=function(){RIP.from=this.value;drawRipoti(m);};
    $('#rT').onchange=function(){RIP.to=this.value;drawRipoti(m);};
    $('#rTeam').onchange=function(){RIP.team=this.value;drawRipoti(m);};
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

/* ---------- recovery ---------- */
function drawRecovery(m){
  m.innerHTML='<div class="card"><h2>Recovery</h2><div class="mut">Inapakia…</div></div>';
  srv('recovery').then(function(d){
    if(!d.prev){
      m.innerHTML='<div class="card"><h2>Recovery</h2><div class="mut">'+esc(d.note||'Hakuna data bado — pakia orodha ya kwanza.')+'</div></div>';
      return;
    }
    var c=d.counts||{};
    m.innerHTML=
      '<div class="card"><h2>Recovery — '+esc(d.prev)+' → '+esc(d.latest)+'</h2>'
      +'<div class="mut" style="margin-bottom:10px">Nani amerudi baada ya simu zetu: tunalinganisha upload mbili za mwisho, mteja kwa mteja (IMEI).</div>'
      +'<div class="tiles">'
      +'<div class="tile"><div class="l">Wamelinganishwa</div><div class="v">'+money(c.compared)+'</div></div>'
      +'<div class="tile"><div class="l">Wamelipa mara ya kwanza</div><div class="v" style="color:var(--ok)">'+money(c.paidNew)+'</div></div>'
      +'<div class="tile"><div class="l">Siku-offline zimepungua</div><div class="v" style="color:var(--ok)">'+money(c.reconnected)+'</div></div>'
      +'<div class="tile"><div class="l">Wamezidi kuzama</div><div class="v" style="color:var(--bad)">'+money(c.deeper)+'</div></div>'
      +'<div class="tile"><div class="l">Wametoka kwenye orodha</div><div class="v">'+money(c.leftList)+'</div><div class="s">hawakuwepo leo</div></div>'
      +'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Mteja</th><th>Timu</th><th class="r">OFF jana</th><th class="r">OFF leo</th><th></th></tr></thead><tbody>'
      +(d.rows||[]).map(function(r){
        return '<tr><td>'+esc(r.name)+'<div class="mut" style="font-size:10px">'+esc(r.imei)+'</div></td><td>'+esc(r.team||'')+'</td>'
          +'<td class="r">'+money(r.was)+'</td><td class="r" style="color:var(--ok)">'+money(r.now)+'</td>'
          +'<td>'+(r.paid?'<span class="chip ok">AMELIPA</span>':'<span class="chip">karibu</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

/* ---------- wateja / customers ----------
   ONE nav, THREE separated lists: jana (yesterday's list), leo ndani ya siku 45, na leo
   waliopita 45. Kila mstari unabeba AGENT -- aliyemuuzia simu, nafasi ile ile mdhamini
   aliyoshika Hope. Kila mtumiaji (isipokuwa view-only) anaandika maoni kwa mteja yeyote. */
var CUST={data:null,list:'leo45',sel:null};
function drawCust(m){
  CUST.data=null; CUST.sel=null;
  m.innerHTML='<div class="card"><h2>Wateja / Customers</h2><div class="mut">Inapakia…</div></div>';
  srv('customers').then(function(d){ CUST.data=d; custRender(m); })
    .catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}
function custRender(m){
  var d=CUST.data;
  var lists={jana:d.jana||[],leo45:d.leo45||[],leo45plus:d.leo45plus||[]};
  var rows=lists[CUST.list]||[];
  function pill(k,label){
    return '<button class="btn sm'+(CUST.list===k?'':' ghost')+'" data-pl="'+k+'">'+label+' · '+money(lists[k].length)+'</button>';
  }
  m.innerHTML=
    '<div class="card"><h2>Wateja / Customers'+(d.deckDate?' — deck '+esc(d.deckDate):'')+'</h2>'
    +'<div class="row">'
    +pill('jana','Jana'+(d.prevDate?' ('+esc(d.prevDate)+')':''))
    +pill('leo45','Leo · siku ≤ 45')
    +pill('leo45plus','Leo · 45+')
    +'</div>'
    +'<div class="row"><input class="inp" id="custQ" placeholder="Tafuta: jina, simu, IMEI, agent, timu… / search"></div>'
    +'<div class="mut" style="margin-bottom:8px">Bofya mteja kuona historia na kuandika maoni. <b>Agent</b> = aliyemuuzia simu.</div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Mteja</th><th>Timu</th><th>Agent</th><th class="r">OFF</th><th class="r">Siku/45</th><th>Hali</th></tr></thead><tbody id="custRows">'
    +(rows.length?rows.map(function(r,i){
      return '<tr data-ci="'+i+'" style="cursor:pointer"><td><b>'+esc(r.name||'—')+'</b><div class="mut" style="font-size:10px">'+esc(r.imei)+'</div></td>'
        +'<td>'+esc(r.team||'')+'</td><td>'+esc(r.agent||'—')+'</td>'
        +'<td class="r">'+(r.daysOff!=null?money(r.daysOff):'—')+(r.locked7?' <span class="chip bad">7+</span>':(r.locked4?' <span class="chip warn">4+</span>':''))+'</td>'
        +'<td class="r">'+(r.lifeDay!=null?(r.lifeDay<=45?money(r.lifeDay)+'/45':'<span class="chip">NJE</span>'):'—')+'</td>'
        +'<td>'+(r.fu?'<span class="chip">'+esc(r.fu)+'</span>':(r.paid?'<span class="chip ok">amelipa</span>':''))+'</td></tr>';
    }).join(''):'<tr><td colspan="6" class="mut">Hakuna mteja kwenye orodha hii bado.</td></tr>')
    +'</tbody></table></div></div>'
    +'<div id="custDetail"></div><div id="custSrch"></div>';
  $all('[data-pl]',m).forEach(function(b){ b.onclick=function(){ CUST.list=b.getAttribute('data-pl'); CUST.sel=null; custRender(m); }; });
  $all('#custRows tr[data-ci]',m).forEach(function(tr){
    tr.onclick=function(){ openCust(rows[parseInt(tr.getAttribute('data-ci'),10)]); };
  });
  /* The box filters the visible list instantly; from 3 characters it ALSO asks the whole
     register -- so "any customer" means any, not just today's deck. One bounded read. */
  var t=null;
  $('#custQ').addEventListener('input',function(){
    var q=this.value.trim();
    var Q=q.toUpperCase();
    $all('#custRows tr[data-ci]',m).forEach(function(tr){
      tr.style.display=!Q||tr.textContent.toUpperCase().indexOf(Q)>=0?'':'none';
    });
    clearTimeout(t);
    var box=$('#custSrch');
    if(q.length<3){ if(box) box.innerHTML=''; return; }
    t=setTimeout(function(){
      srv('customerSearch',{q:q}).then(function(x){
        if($('#custQ')&&$('#custQ').value.trim()!==q) return;
        var cs=x.customers||[];
        if(!box) return;
        box.innerHTML=!cs.length?'':'<div class="card"><h2>Rejista nzima / Whole register — '+cs.length+'</h2>'
          +'<div style="overflow-x:auto"><table><thead><tr><th>Mteja</th><th>Timu</th><th>Agent</th><th class="r">OFF</th></tr></thead><tbody>'
          +cs.map(function(c,i){
            return '<tr data-si="'+i+'" style="cursor:pointer"><td><b>'+esc(c.name||'—')+'</b><div class="mut" style="font-size:10px">'+esc(c.imei)+'</div></td>'
              +'<td>'+esc(c.team||'')+'</td><td>'+esc(c.agent||'—')+'</td>'
              +'<td class="r">'+(c.daysOff!=null?money(c.daysOff):'—')+(c.locked7?' <span class="chip bad">7+</span>':'')+'</td></tr>';
          }).join('')+'</tbody></table></div></div>';
        $all('[data-si]',box).forEach(function(tr){
          tr.onclick=function(){ openCust(cs[parseInt(tr.getAttribute('data-si'),10)]); };
        });
      }).catch(function(){});
    },350);
  });
  if(CUST.sel) openCust(CUST.sel);
}
function openCust(c){
  var box=$('#custDetail'); if(!box||!c) return;
  CUST.sel=c;
  var d=CUST.data||{};
  var canW=!BOOT.readOnly;
  var h=telHref(c.phone);
  var fus=d.fuStatuses||[];
  box.innerHTML=
    '<div class="card" id="custCard"><h2>'+esc(c.name||'—')+' '+(c.team?'<span class="chip">'+esc(c.team)+'</span>':'')+'</h2>'
    +'<div class="mut" style="margin-bottom:6px">IMEI '+esc(c.imei)+(c.model?' · '+esc(c.model):'')+(c.price?' · TZS '+money(c.price):'')
    +(c.lifeDay!=null?' · siku '+money(c.lifeDay)+'/45':'')+(c.daysOff!=null?' · OFF siku '+money(c.daysOff):'')+'</div>'
    +'<div style="font-size:13.5px;margin-bottom:4px"><b>Agent (aliyemuuzia): '+esc(c.agent||'—')+'</b></div>'
    +'<div style="font-size:13.5px;margin-bottom:10px">Simu: '+(h!=='#'?'<a href="tel:'+h+'">'+esc(c.phone)+'</a>':'—')
    +' <span class="mut">(namba hii ndiyo ref ya malipo Watu)</span></div>'
    +'<div id="custHist" class="mut">Inapakia historia…</div>'
    +(canW?
      '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'
      +'<div class="row"><select class="inp" id="cmFu"><option value="">— Hali / status —</option>'
      +fus.map(function(s){ return '<option'+(c.fu===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'
      +'<div class="row hide" id="cmPromRow"><input class="inp" type="date" id="cmDate"><input class="inp" type="text" id="cmAmt" placeholder="Kiasi / amount (TZS)" inputmode="numeric"></div>'
      +'<div class="row"><textarea class="inp" id="cmTxt" rows="2" placeholder="Maoni… / comment"></textarea></div>'
      +'<button class="btn sm" id="cmSave">Hifadhi maoni / Save</button>'
      +'</div>':'')
    +'</div>';
  var el=$('#custCard'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  function hist(){
    srv('customerComments',{imei:c.imei}).then(function(x){
      var it=x.items||[];
      $('#custHist').innerHTML=!it.length?'<div class="mut">Hakuna maoni bado — wa kwanza kuandika.</div>'
        :'<div style="display:flex;flex-direction:column;gap:8px">'+it.map(function(r){
          return '<div style="background:var(--b50);border-radius:9px;padding:8px 11px;font-size:13px">'
            +(r.fu_status?'<span class="chip">'+esc(r.fu_status)+'</span> ':'')
            +(r.promise_date?'<span class="chip ok">ahadi '+esc(String(r.promise_date).slice(0,10))+'</span> ':'')
            +esc(r.comment||'')
            +'<div class="mut" style="font-size:10.5px;margin-top:3px">'+esc(r.created_by||'')+' · '+esc(String(r.created_at||'').slice(0,16).replace('T',' '))+'</div></div>';
        }).join('')+'</div>';
    }).catch(function(e){ $('#custHist').innerHTML='<div class="mut">'+esc(String(e.message||e))+'</div>'; });
  }
  hist();
  if(!canW) return;
  function promToggle(){
    var need=(d.fuNeedDate||[]).indexOf($('#cmFu').value)>=0;
    $('#cmPromRow').classList.toggle('hide',!need);
    if(need&&!$('#cmDate').value) $('#cmDate').value=isoToday(1);
  }
  $('#cmFu').onchange=promToggle; promToggle();
  $('#cmSave').onclick=function(){
    var fu=$('#cmFu').value, txt=$('#cmTxt').value.trim();
    if(!fu&&!txt){ toast('Chagua hali au andika maoni.',true); return; }
    var needP=(d.fuNeedDate||[]).indexOf(fu)>=0;
    $('#cmSave').disabled=true;
    srv('portalAddComment',{imei:c.imei,team:c.team||null,name:c.name||null,fu:fu||null,
      promiseDate:needP?($('#cmDate').value||null):null,
      promiseAmt:needP?(Number(String($('#cmAmt').value).replace(/\D/g,''))||null):null,
      comment:txt||null})
      .then(function(){
        toast('Imehifadhiwa.');
        c.fu=fu||c.fu; $('#cmTxt').value='';
        hist();
      })
      .catch(function(e){ toast(String(e.message||e),true); })
      .then(function(){ var b=$('#cmSave'); if(b) b.disabled=false; });
  };
}

/* ---------- mauzo: fraud audit + agent scorecards ----------
   The owner's loop: general duty's book vs Watu's records finds the sale nobody
   financed; Sipho's register names who answers for it; the daily files score how each
   agent's customers behave. Two pills, one nav. */
var MZ={list:'audit',from:isoToday(-30),to:isoToday(0)};
function drawMauzo(m){
  m.innerHTML='<div class="card"><h2>Sales</h2><div class="mut">Loading…</div></div>';
  if(MZ.list==='audit') drawAudit(m);
  else if(MZ.list==='stock') drawStock(m);
  else drawAgents(m);
}
function mzPills(){
  return '<div class="row">'
    +'<button class="btn sm'+(MZ.list==='audit'?'':' ghost')+'" data-mz="audit">Fraud audit</button>'
    +'<button class="btn sm'+(MZ.list==='agents'?'':' ghost')+'" data-mz="agents">Agent scorecards</button>'
    +'<button class="btn sm'+(MZ.list==='stock'?'':' ghost')+'" data-mz="stock">Stock</button>'
    +(MZ.list==='stock'?'':'<input class="inp" type="date" id="mzFrom" value="'+MZ.from+'" style="flex:0 1 150px">'
      +'<input class="inp" type="date" id="mzTo" value="'+MZ.to+'" style="flex:0 1 150px">'
      +'<button class="btn sm ghost" id="mzGo">Show</button>')
    +'</div>';
}
function mzWire(m){
  $all('[data-mz]',m).forEach(function(b){ b.onclick=function(){ MZ.list=b.getAttribute('data-mz'); drawMauzo(m); }; });
  var go=$('#mzGo'); if(go) go.onclick=function(){ MZ.from=$('#mzFrom').value||MZ.from; MZ.to=$('#mzTo').value||MZ.to; drawMauzo(m); };
}
function drawStock(m){
  srv('stockView').then(function(d){
    var filt='<div class="row"><input class="inp" id="stQ" placeholder="Filter: agent, IMEI, item…"></div>';
    m.innerHTML='<div class="card"><h2>Aged stock — by RSMs and agents'+(d.asOf?' <span class="mut" style="font-weight:400;font-size:12px">(report of '+esc(d.asOf)+')</span>':'')+'</h2>'

        +'<div class="tile"><div class="l">Holders</div><div class="v">'+money((d.holders||[]).length)+'</div></div>'
        +'<div class="tile"><div class="l">Oldest</div><div class="v" style="color:var(--bad)">'+money((d.holders[0]||{}).maxAge||0)+'</div><div class="s">days</div></div>'
        +'</div>'
        +'<div class="mut" style="margin-bottom:8px">Ages are SyscoPos\'s own (resettable there — true age comes in phase 3). Top = oldest burden.</div>'
        +'<div style="overflow-x:auto"><table><thead><tr><th>Holder</th><th>Role</th><th class="r">Phones</th><th class="r">Avg age</th><th class="r">Oldest</th><th>Items</th></tr></thead><tbody>'
        +(d.holders||[]).map(function(h){
          return '<tr><td><b>'+esc(h.agent)+'</b>'+(h.branch?'<div class="mut" style="font-size:10px">'+esc(h.branch)+'</div>':'')+'</td>'
            +'<td>'+esc(h.role||'—')+'</td><td class="r">'+money(h.pieces)+'</td>'

            +'<td class="r"'+(h.maxAge>=14?' style="color:var(--bad)"':'')+'>'+money(h.maxAge)+'</td>'
            +'<td class="mut" style="font-size:11px">'+esc(h.items)+'</td></tr>';

      +'</div>';

      $all('#stRows tr',m).forEach(function(tr){ tr.style.display=!Q||tr.textContent.toUpperCase().indexOf(Q)>=0?'':'none'; });

function mzStatusChip(s){
  if(s==='OK') return '<span class="chip ok">OK · Watu</span>';
  if(s==='DRIFT') return '<span class="chip warn">DRIFT · different agent</span>';
  if(s==='PENDING') return '<span class="chip">PENDING · too fresh</span>';
  if(s==='BULK') return '<span class="chip">BULK / CASH?</span>';
  return '<span class="chip bad">⚠ NOT IN WATU</span>';
}

    var c=d.counts||{};
    m.innerHTML='<div class="card"><h2>Fraud audit — '+esc(d.from)+' → '+esc(d.to)+'</h2>'

      +(d.rows||[]).map(function(r){

      +'</tbody></table></div></div>';

  $all('[data-nc]',m).forEach(function(b){
    b.onclick=function(){
      if(!confirm('Msimbo mpya wa '+b.getAttribute('data-nc')+'? Kila simu ya timu hii itatakiwa kuingia upya.')) return;
      srv('newTeamCode',{team:b.getAttribute('data-nc')}).then(function(d){
        toast('Msimbo mpya wa '+d.team+': '+d.code);
        return srv('boot').then(function(x){BOOT=x;drawTeams(m);});
      }).catch(function(e){toast(String(e.message||e),true);});
    };
  });
  $('#ntAdd').onclick=function(){
    var t=$('#ntName').value.trim(); if(!t) return;
    srv('saveTeam',{team:t,rsm:$('#ntRsm').value,rsmNo:$('#ntNo').value})
      .then(function(){ return srv('newTeamCode',{team:t.toUpperCase()}); })
      .then(function(d){ toast('Timu '+d.team+' · msimbo '+d.code);
        return srv('boot').then(function(x){BOOT=x;drawTeams(m);}); })
      .catch(function(e){toast(String(e.message||e),true);});
  };
}

/* ---------- staff ---------- */
function drawStaff(m){
  m.innerHTML='<div class="card"><h2>Watumiaji wa Calls / Staff</h2><div class="mut">Inapakia…</div></div>';
  var canW=(BOOT.tabs||[]).indexOf('settings')>=0&&!BOOT.readOnly;
  srv('officers').then(function(d){
    m.innerHTML='<div class="card"><h2>Watumiaji wa Calls / Staff</h2>'
      +'<div class="mut" style="margin-bottom:10px">Kumzima mtu mmoja hakubadilishi msimbo wa timu — akaunti yake tu ndiyo inafungwa.</div>'
      +'<div class="row"><input class="inp" id="staffQ" placeholder="Tafuta: jina, simu, timu, IMEI, agent… / search"></div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Jina</th><th>Timu</th><th>Simu</th><th>Sync ya mwisho</th><th>Hali</th>'+(canW?'<th></th>':'')+'</tr></thead><tbody>'
      +(d.officers||[]).map(function(o){
        return '<tr><td><b>'+esc(o.name)+'</b>'+(o.leader?' <span class="chip">kiongozi</span>':'')+'</td>'
          +'<td>'+esc(o.team||'')+'</td><td>'+esc(o.phone||'')+'</td>'
          +'<td class="mut">'+(o.lastSync?esc(String(o.lastSync).slice(0,16).replace('T',' ')):'—')+'</td>'
          +'<td>'+(o.active?'<span class="chip ok">ACTIVE</span>':'<span class="chip bad">OFF</span>')+'</td>'
          +(canW?'<td class="r"><button class="btn sm ghost" data-tg="'+esc(o.userId)+'" data-on="'+(o.active?1:0)+'">'+(o.active?'Zima':'Washa')+'</button></td>':'')
          +'</tr>';
      }).join('')+'</tbody></table></div></div><div id="staffCust"></div>';
    wireSearch_('#staffQ','#staffCust',function(q){
      $all('tbody tr', $('#main')).forEach(function(tr){
        tr.style.display = !q || tr.textContent.toUpperCase().indexOf(q)>=0 ? '' : 'none';
      });
    });
    if(!canW) return;
    $all('[data-tg]',m).forEach(function(b){
      b.onclick=function(){
        srv('officerActive',{userId:b.getAttribute('data-tg'),active:b.getAttribute('data-on')!=='1'})
          .then(function(){drawStaff(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

/* ---------- access codes ---------- */
var EDIT_FROM='';
function drawCodes(m){
  m.innerHTML='<div class="card"><h2>Access codes</h2><div class="mut">Inapakia…</div></div>';
  EDIT_FROM='';
  srv('accessCodes').then(function(d){
    m.innerHTML='<div class="card"><h2>Access codes — mfumo (portal)</h2>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Code</th><th>Jina</th><th>Role</th><th>Timu</th><th>Tabs</th><th></th></tr></thead><tbody>'
      +(d.codes||[]).map(function(c){
        return '<tr><td class="code">'+esc(c.code)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.role)+'</td>'
          +'<td>'+esc(c.teams?c.teams.join(', '):'ZOTE')+'</td><td class="mut">'+esc((c.tabs||[]).join(', '))+'</td>'
          +'<td class="r"><button class="btn sm ghost" data-ed="'+esc(c.code)+'" data-name="'+esc(c.name)+'" data-role="'+esc(c.role)+'" data-teams="'+esc(c.teams&&c.teams.length?c.teams.join(','):'ALL')+'">Hariri</button> '
          +'<button class="btn sm ghost" data-del="'+esc(c.code)+'">Futa</button></td></tr>';
      }).join('')+'</tbody></table></div>'
      +'<div class="row" style="margin-top:14px"><input class="inp" id="acCode" placeholder="Code (siri)"><input class="inp" id="acName" placeholder="Jina">'
      +'<select class="inp" id="acRole">'+(d.roles||[]).map(function(r){return '<option>'+esc(r.role)+'</option>';}).join('')+'</select>'
      +'<input class="inp" id="acTeams" placeholder="Timu: andika ALL au orodha (comma)"><button class="btn sm" id="acAdd">Ongeza</button></div>'
      +'<div class="mut" style="margin-top:6px">ADMIN inapata kila kitu. AUDITOR ni kuangalia tu. '
      +'Hariri hujaza fomu — badilisha chochote (hata Code yenyewe, hata yako) kisha Hifadhi.</div>'
      +'</div>'
      +'<div class="card"><h2>Roles</h2>'
      +'<div class="row" style="flex-wrap:wrap">'+(d.roles||[]).map(function(r){
          return '<span style="display:inline-flex;align-items:center;gap:2px">'
            +'<button class="btn sm ghost" data-rl="'+esc(r.role)+'" data-rltabs="'+esc((r.tabs||[]).join(','))+'">'
            +esc(r.role)+((r.tabs||[]).length?' \u00B7 '+esc((r.tabs||[]).join('+')):'')
            +(r.inUse?' \u00B7 <span class="chip">watu '+r.inUse+'</span>':'')+'</button>'
            +(!r.inUse?'<button class="btn sm ghost" data-rldel="'+esc(r.role)+'" title="Futa role hii" style="color:var(--bad);border-color:#F6CFCB;padding:7px 9px">\u00D7</button>':'')
            +'</span>';
        }).join('')+'</div>'
      +'<div class="row"><input class="inp" id="rlName" placeholder="Jina la role (mpya au ya kuhariri)">'
      +'<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0"><input type="checkbox" id="rlUp"> Upload</label>'
      +'<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0"><input type="checkbox" id="rlSet"> Settings</label>'
      +'<button class="btn sm" id="rlSave">Hifadhi role</button></div>'
      +'<div class="mut">Bonyeza role kuijaza; Settings inatoa Teams/Staff/Codes, Upload inatoa kupakia. Bila viwili hivyo ni kuangalia tu (dashboard, ripoti, recovery). '
      +'Role isiyo na mtu ina <b>×</b> ya kuifuta; yenye watu haifutiki mpaka uwahamishe.</div>'
      +'</div>';
    $all('[data-rl]',m).forEach(function(b){
      b.onclick=function(){
        $('#rlName').value=b.getAttribute('data-rl');
        var t=(b.getAttribute('data-rltabs')||'').split(',');
        $('#rlUp').checked=t.indexOf('upload')>=0;
        $('#rlSet').checked=t.indexOf('settings')>=0;
      };
    });
    $all('[data-rldel]',m).forEach(function(b){
      b.onclick=function(){
        var role=b.getAttribute('data-rldel');
        if(!confirm('Futa role '+role+'? Hakuna mtu anayeitumia sasa.')) return;
        srv('deleteRole',{role:role})
          .then(function(){toast('Role '+role+' imefutwa.');drawCodes(m);})
          .catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $('#rlSave').onclick=function(){
      var role=$('#rlName').value.trim();
      if(!role){ toast('Andika jina la role.',true); return; }
      var tabs=['dashboard'];
      if($('#rlUp').checked) tabs.push('upload');
      if($('#rlSet').checked) tabs.push('settings');
      srv('saveRole',{role:role,tabs:tabs})
        .then(function(){toast('Role imehifadhiwa.');drawCodes(m);})
        .catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-ed]',m).forEach(function(b){
      b.onclick=function(){
        EDIT_FROM=b.getAttribute('data-ed');
        $('#acCode').value=EDIT_FROM;
        $('#acName').value=b.getAttribute('data-name')||'';
        $('#acRole').value=b.getAttribute('data-role')||'ADMIN';
        $('#acTeams').value=b.getAttribute('data-teams')||'';
        $('#acAdd').textContent='Hifadhi / Save';
        $('#acCode').focus();
      };
    });
    $('#acAdd').onclick=function(){
      var role=$('#acRole').value;
      var tabs=role==='ADMIN'?['upload','settings']:[];
      var rawTeams=$('#acTeams').value.trim();
      var allTeams=rawTeams.toUpperCase()==='ALL'||rawTeams.toUpperCase()==='ZOTE';
      var teams=allTeams?[]:rawTeams.split(',').map(function(x){return x.trim();}).filter(Boolean);
      if(!allTeams&&!teams.length){ toast('Andika ALL au orodha ya timu. / State ALL, or name the teams.',true); return; }
      var newCode=$('#acCode').value.trim();
      var save=function(){ return srv('saveAccessCode',{code:newCode,name:$('#acName').value,role:role,teams:teams,allTeams:allTeams,tabs:tabs}); };
      var flow = (EDIT_FROM && EDIT_FROM!==newCode)
        ? srv('renameAccessCode',{from:EDIT_FROM,to:newCode}).then(function(r){
            if(r.self){ CODE=newCode; try{localStorage.setItem('hpCode',newCode);}catch(e){} }
            return save();
          })
        : save();
      flow.then(function(){toast('Imehifadhiwa.');drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-del]',m).forEach(function(b){
      b.onclick=function(){
        if(!confirm('Futa code hii?')) return;
        srv('deleteAccessCode',{code:b.getAttribute('data-del')})
          .then(function(){drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

/* ---------- settings ---------- */
function drawSettings(m){
  m.innerHTML='<div class="card"><h2>Settings</h2><div class="mut">Inapakia…</div></div>';
  srv('settings').then(function(d){
    m.innerHTML='<div class="card"><h2>Settings</h2>'
      +(d.settings||[]).map(function(s,i){
        return '<div class="row"><div style="min-width:170px;font-size:12.5px;font-weight:700">'+esc(s.key)+'</div>'
          +'<input class="inp" id="st'+i+'" value="'+esc(s.value)+'">'
          +'<button class="btn sm" data-sv="'+esc(s.key)+'" data-i="'+i+'">Save</button></div>';
      }).join('')
      +'<div class="mut">SYSTEM_OPEN=YES hufungua mfumo. CALL_BRAND ni jina kwenye app. FU_STATUSES: hali za ufuatiliaji, moja kwa mstari.</div>'
      +'</div>';
    $all('[data-sv]',m).forEach(function(b){
      b.onclick=function(){
        srv('settingSet',{key:b.getAttribute('data-sv'),value:$('#st'+b.getAttribute('data-i')).value})
          .then(function(){toast('Imehifadhiwa.');}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

</script>
</body>
</html>
