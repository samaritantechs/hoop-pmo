<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOOP PMO — Portal</title>
<style>
:root{ --b950:#081C4A; --b900:#0B2A6B; --b800:#10357F; --b700:#1D4ED8; --b600:#2563EB; --b300:#93C5FD; --b100:#DBEAFE; --b50:#EFF6FF;
  --bg:#F6F8FC; --card:#fff; --ink:#0F172A; --mut:#64748B; --soft:#94A3B8; --line:#E2E8F0;
  --ok:#067647; --okbg:#E7F6EE; --warn:#92400E; --warnbg:#FEF3DC; --bad:#B42318; --badbg:#FDECEA; --sky:#35A8E1; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.hide{display:none!important}
/* sign-in */
#scrIn{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--b900),var(--b800))}
.incard{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:380px;margin:16px;box-shadow:0 12px 34px -14px rgba(8,28,74,.45)}
.mark{width:76px;display:block;margin-bottom:10px}
.incard h1{font-size:18px;margin:0 0 4px}
.incard p{font-size:13px;color:var(--mut);margin:0 0 14px}
input,select,textarea{font-family:inherit}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
.btn.w{width:100%;margin-top:12px;padding:14px}
.btn.ghost{background:#fff;color:var(--b700);border:1.5px solid var(--b100)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{background:var(--b300)}
.err{background:var(--badbg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:10px;display:none}
/* shell */
header.top{background:var(--b900);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.toprow{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.toprow .who{flex:1;min-width:0}
.toprow .who b{display:block;font-size:14px}
.toprow .who span{font-size:11px;color:var(--b300)}
.toprow .lg{width:52px}
/* The nav lives on the LEFT, as in Hope's portal: a column of tabs beside the work. */
.shell{display:flex;max-width:1120px;margin:0 auto;align-items:flex-start}
aside.side{flex:0 0 185px;padding:16px 0 16px 14px;position:sticky;top:66px}
.tabs{display:flex;flex-direction:column;gap:6px}
.tabs button{background:#fff;color:var(--b800);border:1px solid var(--line);text-align:left;
  padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--b700);border-color:var(--b700);color:#fff}
/* The two doors that leave the portal ride at the bottom of the same left nav. */
.tabs .sep{height:1px;background:var(--line);margin:5px 2px}
.tabs .lnk{display:block;background:#fff;color:var(--b800);border:1px solid var(--line);text-align:left;
  padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none}
main{flex:1;min-width:0;padding:16px}
/* The three lines open and close it -- everywhere. Closed, the work takes the width. */
#navBtn{flex:0 0 auto;font-size:17px;line-height:1;padding:7px 11px}
body.nav-closed aside.side{display:none}
.navBack{display:none}
@media(max-width:760px){
  /* On a phone the open nav is a drawer OVER the page, with a backdrop that closes it. */
  aside.side{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--bg);z-index:20;
    padding:70px 10px 16px 12px;overflow-y:auto;box-shadow:8px 0 30px -12px rgba(8,28,74,.45)}
  body:not(.nav-closed) .navBack{display:block;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:15}
  main{padding:10px 8px}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.14)}
.tile .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:800;margin-top:4px}
.tile .s{font-size:11px;color:var(--soft);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px -4px rgba(11,42,107,.12)}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--b50);color:var(--b900);font-size:10.5px;text-transform:uppercase;cursor:pointer;user-select:none}
th[data-sd="a"]::after{content:" \2191"}
th[data-sd="d"]::after{content:" \2193"}
td.r,th.r{text-align:right}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row .inp{width:auto;flex:1;min-width:120px}
.mut{color:var(--mut);font-size:12.5px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.08em}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;display:none;z-index:9}
.toast.bad{background:var(--bad)}
.road li{margin-bottom:8px;line-height:1.5}
@media(max-width:640px){ th,td{padding:7px 6px} }
</style>
</head>
<body>

<div id="scrIn">
  <div class="incard">
    <svg class="mark" viewBox="0 0 64 40"><rect width="64" height="40" rx="9" fill="#EFF6FF"/><text x="32" y="21" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-1" fill="#2E2B7A" font-family="Arial">HOOP</text><path d="M22 26 A 11 11 0 0 0 42 26" fill="none" stroke="#35A8E1" stroke-width="4" stroke-linecap="round"/></svg>
    <h1>HOOP PMO</h1>
    <p>Mfumo wa ufuatiliaji — watu simu. Ingia na msimbo wako. / Sign in with your access code.</p>
    <input class="inp" type="password" id="inCode" placeholder="Access code" autocomplete="off">
    <div class="err" id="inErr"></div>
    <button class="btn w" id="inBtn">Ingia / Sign in</button>
  </div>
</div>

<div id="scrApp" class="hide">
  <header class="top">
    <div class="toprow">
      <button class="btn sm ghost" id="navBtn" title="Menyu">&#9776;</button>
      <svg class="lg" viewBox="0 0 64 40"><rect width="64" height="40" rx="9" fill="#fff"/><text x="32" y="21" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-1" fill="#2E2B7A" font-family="Arial">HOOP</text><path d="M22 26 A 11 11 0 0 0 42 26" fill="none" stroke="#35A8E1" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
      <input id="gq" placeholder="🔍 IMEI · jina · namba / search everything" autocomplete="off"
        style="flex:1 1 180px;min-width:120px;max-width:340px;padding:8px 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;outline:none">
      <a class="btn sm ghost" href="/upload">Upload</a>
      <a class="btn sm ghost" href="/call">Calls</a>
      <button class="btn sm ghost" id="outBtn">Toka</button>
    </div>
</header>
<div id="gres" class="hide" style="position:fixed;z-index:998;top:58px;left:50%;transform:translateX(-50%);width:min(640px,94vw);max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.22);padding:12px"></div>
  <div class="shell">
    <div class="navBack" id="navBack"></div>
    <aside class="side">
      <div class="tabs" id="tabs">
      <button data-t="dash" class="on">Dashboard</button>
      <button data-t="cust">Wateja / Customers</button>
      <button data-t="ripoti">Call reports</button>
      <button data-t="recovery">Recovery</button>
      <button data-t="fraud">Fraud audit</button>
      <button data-t="score">Agent scorecards</button>
      <button data-t="stock">Stock</button>
      <button data-t="move">Stock movement</button>
      <button data-t="staff">Staff</button>
      <button data-t="codes" id="tabCodes">Access codes</button>
      <button data-t="settings" id="tabSettings">Settings</button>
      <div class="sep"></div>
      <a class="lnk" href="/upload">Upload &nearr;</a>
      <a class="lnk" href="/call">HOOP Calls &nearr;</a>
    </div>
      </aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pct(x){ return (x==null||isNaN(x))?'—':Math.round(100*x)+'%'; }
function fmtDur(sec){ sec=Math.max(0,Math.round(Number(sec)||0)); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=function(n){return(n<10?'0':'')+n;}; return h>0?(h+':'+p(m)+':'+p(s)):(m+':'+p(s)); }
function telHref(v){ var d=String(v==null?'':v).replace(/\D/g,''); if(!d) return '#'; return d.indexOf('255')===0?'+'+d:'+255'+d.replace(/^0+/,''); }
function toast(m,bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':''); t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3500); }
function isoToday(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); var p=function(n){return('0'+n).slice(-2);}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

var CODE='', BOOT=null, TAB='dash';
/* EVERY TABLE EXPORTS TO EXCEL: a button injected above each table automatically, so
   every report in every tab -- including tabs added later -- is born exportable.
   CSV with a BOM: Excel opens it clean, Swahili characters intact. Hidden rows
   (filtered out by a search box or a chip) are NOT exported -- you export what you see. */
function csvOfTable_(t){
  var out=[];
  [].slice.call(t.rows).forEach(function(tr){
    if(tr.style.display==='none'||tr.classList.contains('fhide')) return;
    var cells=[].slice.call(tr.cells).map(function(td){
      return '"'+td.textContent.replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"';
    });
    if(cells.length) out.push(cells.join(','));
  });
  return '\ufeff'+out.join('\r\n');
}
function xlName_(){
  var d=new Date(),p=function(n){return ('0'+n).slice(-2);};
  return 'HOOP-'+(TAB||'report')+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.csv';
}
function injectExports_(){
  $all('#main table').forEach(function(t){
    if(!t.__xp){ t.__xp=1;
      if(t.tHead){
        var b=document.createElement('button');
        b.textContent='\u2913 Excel'; b.className='btn sm ghost'; b.style.cssText='margin:0 0 8px;font-size:11.5px;padding:5px 10px';
        b.onclick=function(){
          var a=document.createElement('a');
          a.href=URL.createObjectURL(new Blob([csvOfTable_(t)],{type:'text/csv;charset=utf-8'}));
          a.download=xlName_(); document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
        };
        t.parentNode.insertBefore(b,t);
      }
    }
    // The tick-list funnel on every header -- group any table by one agent, one
    // branch, one status. Injected here so tables added later get it for free.
    if(t.tHead) $all('th',t.tHead).forEach(function(th){
      if(th.querySelector('.thfilt')) return;
      var s=document.createElement('span');
      s.className='thfilt'; s.textContent='\u23f7'; s.title='Chuja / filter this column';
      th.appendChild(s);
    });
  });
}
new MutationObserver(function(){ injectExports_(); }).observe(document.body,{childList:true,subtree:true});

/* EXCEL-STYLE COLUMN FILTERS ("tick inside, not just up-down"): the funnel on a header
   opens a tick-list of that column's distinct values -- untick to hide, so a table
   groups to a single agent or branch in two clicks. Composes with sorting (same
   header), the search boxes (both must pass) and the Excel button (exports what you
   see). Filters live on the table node; a redraw starts clean. */
(function(){
  var st=document.createElement('style');
  st.textContent='.fhide{display:none!important}'
    +'.thfilt{cursor:pointer;opacity:.4;margin-left:4px;font-size:9px;user-select:none}'
    +'.thfilt.on{opacity:1;color:#B42318}'
    +'#fltMenu{position:absolute;z-index:999;background:#fff;border:1px solid var(--line);border-radius:10px;'
    +'box-shadow:0 8px 24px rgba(15,23,42,.16);padding:10px;max-height:320px;overflow:auto;min-width:210px;max-width:280px}';
  document.head.appendChild(st);
})();
var fltMenu=null;
function cellVal_(td){
  var c=td.cloneNode(true);
  $all('.mut',c).forEach(function(x){ if(x.parentNode) x.parentNode.removeChild(x); });
  return c.textContent.replace(/\s+/g,' ').trim();
}
function applyFlt_(table){
  var f=table.__flt||{};
  var keys=Object.keys(f).filter(function(k){ return f[k]; });
  var tbody=table.querySelector('tbody'); if(!tbody) return;
  [].slice.call(tbody.children).forEach(function(tr){
    if(tr.children.length<2) return;
    var hide=keys.some(function(k){
      var td=tr.children[k]; if(!td) return false;
      return !f[k][cellVal_(td)];
    });
    tr.classList.toggle('fhide',hide);
  });
  if(table.tHead) $all('.thfilt',table.tHead).forEach(function(s){
    var th=s.closest('th');
    var i=[].slice.call(th.parentNode.children).indexOf(th);
    s.classList.toggle('on',!!f[i]);
  });
}
function openFlt_(sp){
  var th=sp.closest('th'), table=th.closest('table');
  var idx=[].slice.call(th.parentNode.children).indexOf(th);
  var tbody=table.querySelector('tbody'); if(!tbody) return;
  var vals={};
  [].slice.call(tbody.children).forEach(function(tr){
    if(tr.children.length<2) return;
    var td=tr.children[idx]; if(!td) return;
    var v=cellVal_(td); vals[v]=(vals[v]||0)+1;
  });
  var list=Object.keys(vals).sort();
  var cur=(table.__flt||{})[idx]||null;
  if(fltMenu){ fltMenu.remove(); fltMenu=null; }
  fltMenu=document.createElement('div'); fltMenu.id='fltMenu';
  var CAP=120;
  fltMenu.innerHTML='<div class="row" style="gap:6px;margin-bottom:6px">'
    +'<button class="btn sm ghost" data-fa="all">All</button>'
    +'<button class="btn sm ghost" data-fa="none">None</button>'
    +'<button class="btn sm ghost" data-fa="off">Clear</button></div>'
    +list.slice(0,CAP).map(function(v){
      var on=!cur||!!cur[v];
      return '<label style="display:flex;gap:6px;align-items:center;font-size:12.5px;margin:2px 0;cursor:pointer">'
        +'<input type="checkbox" class="fV" data-v="'+esc(v)+'"'+(on?' checked':'')+'> '
        +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(v===''?'<i>(blank)</i>':esc(v))+'</span>'
        +'<span class="mut">'+vals[v]+'</span></label>';
    }).join('')
    +(list.length>CAP?'<div class="mut">\u2026'+(list.length-CAP)+' more values \u2014 narrow with the search box first</div>':'');
  document.body.appendChild(fltMenu);
  var r=sp.getBoundingClientRect();
  fltMenu.style.top=(r.bottom+window.scrollY+4)+'px';
  fltMenu.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-290))+'px';
  function commit(){
    var sel={},all=true;
    $all('.fV',fltMenu).forEach(function(b){ if(b.checked) sel[b.getAttribute('data-v')]=1; else all=false; });
    table.__flt=table.__flt||{};
    table.__flt[idx]=all?null:sel;
    applyFlt_(table);
  }
  fltMenu.addEventListener('change',commit);
  $all('[data-fa]',fltMenu).forEach(function(b){
    b.onclick=function(){
      var a=b.getAttribute('data-fa');
      if(a==='off'){ if(table.__flt) table.__flt[idx]=null; applyFlt_(table); fltMenu.remove(); fltMenu=null; return; }
      $all('.fV',fltMenu).forEach(function(x){ x.checked=(a==='all'); });
      commit();
    };
  });
}
document.addEventListener('click',function(e){
  var sp=e.target.closest?e.target.closest('.thfilt'):null;
  if(sp){ openFlt_(sp); return; }
  if(fltMenu&&!(e.target.closest&&e.target.closest('#fltMenu'))){ fltMenu.remove(); fltMenu=null; }
});

/* EVERY TABLE SORTS ITSELF: click a header to sort by that column, click again to flip.
   Delegated once on the document, so every table -- including ones added later -- gets
   it for free. Numbers sort as numbers (commas, %%, leading figures like "3 (25%%)"),
   ties and text fall back to text; ISO dates are zero-padded so text order IS date
   order. Row click-handlers survive: sorting moves the same nodes. */
document.addEventListener('click', function(e){
  // The funnel and its menu belong to the FILTER, not the sort.
  if (e.target.closest && (e.target.closest('.thfilt') || e.target.closest('#fltMenu'))) return;
  var th = e.target.closest ? e.target.closest('th') : null;
  if (!th) return;
  var table = th.closest('table'); if (!table) return;
  var tbody = table.querySelector('tbody'); if (!tbody) return;
  var ths = [].slice.call(th.parentNode.children);
  var idx = ths.indexOf(th); if (idx < 0) return;
  var rows = [].slice.call(tbody.children).filter(function(r){ return r.children.length > 1; });
  if (rows.length < 2) return;
  var dir = th.getAttribute('data-sd') === 'a' ? -1 : 1;
  ths.forEach(function(x){ x.removeAttribute('data-sd'); });
  th.setAttribute('data-sd', dir === 1 ? 'a' : 'd');
  function txt(tr){ var td = tr.children[idx]; return td ? td.textContent.trim() : ''; }
  function numv(s){
    var t = s.replace(/[,%%\s]/g, '');
    var n = Number(t);
    if (isFinite(n) && t !== '') return n;
    if (/^[0-9]/.test(t)) { n = parseFloat(t); if (isFinite(n)) return n; }
    return null;
  }
  rows.sort(function(a, b){
    var x = txt(a), y = txt(b);
    var nx = numv(x), ny = numv(y);
    if (nx !== null || ny !== null){
      var cx = nx === null ? -Infinity : nx, cy = ny === null ? -Infinity : ny;
      if (cx !== cy) return (cx - cy) * dir;
    }
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  rows.forEach(function(r){ tbody.appendChild(r); });
});

/* THE EVERYTHING BOX in the header: an IMEI, a name or a number finds customers
   (guarantors included), office people and stock serials from ANY tab. A customer hit
   jumps to Wateja and opens their card ready for a comment; people and stock show
   their facts on the spot with a callable number. Esc or a click outside closes. */
window.GOPEN=null;
(function(){
  var t=null, box=null;
  function hide(){ var g=$('#gres'); if(g) g.classList.add('hide'); }
  function jump(c){
    hide(); $('#gq').value='';
    window.GOPEN=c;
    var b=$('#tabs button[data-t="cust"]');
    if(b) b.click(); else window.GOPEN=null;
  }
  function draw(d){
    var g=$('#gres'); if(!g) return;
    var cs=d.customers||[], pe=d.people||[], st=d.stock||[];
    if(!cs.length&&!pe.length&&!st.length){
      g.innerHTML='<div class="mut" style="padding:6px">Hakuna kilichopatikana. / Nothing found.</div>';
      g.classList.remove('hide'); return;
    }
    var h='';
    if(cs.length){
      h+='<div style="font-weight:800;font-size:12px;color:var(--mut);margin:2px 0 6px">WATEJA / CUSTOMERS — '+cs.length+'</div>'
        +cs.map(function(c,i){
          return '<div class="gitem" data-gc="'+i+'" style="padding:8px 10px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)">'
            +'<b>'+esc(c.name||'—')+'</b> <span class="mut" style="font-size:11px">'+esc(c.imei)+'</span>'
            +(c.locked7?' <span class="chip bad">7+</span>':'')
            +'<div class="mut" style="font-size:11.5px">'+esc(c.branch||c.team||'')+(c.agent?' · Agent: '+esc(c.agent):'')
            +(c.gName?' · Mdhamini: '+esc(c.gName):'')+(c.phone?' · '+esc(c.phone):'')+'</div></div>';
        }).join('');
    }
    if(pe.length){
      h+='<div style="font-weight:800;font-size:12px;color:var(--mut);margin:10px 0 6px">OFISI / OFFICE — '+pe.length+'</div>'
        +pe.map(function(p){
          var hh=telHref(p.phone);
          return '<div style="padding:8px 10px;border-bottom:1px solid var(--line)">'
            +'<b>'+esc(p.name)+'</b>'+(p.active?'':' <span class="chip bad">OFF</span>')
            +'<div class="mut" style="font-size:11.5px">'+esc(p.role||'')+(p.branch?' · '+esc(p.branch):'')
            +(p.phone?' · '+(hh!=='#'?'<a href="tel:'+hh+'">'+esc(p.phone)+'</a>':esc(p.phone)):'')+'</div></div>';
        }).join('');
    }
    if(st.length){
      h+='<div style="font-weight:800;font-size:12px;color:var(--mut);margin:10px 0 6px">STOCK — '+st.length+'</div>'
        +st.map(function(s){

            +'<b>'+esc(s.serial)+'</b><div class="mut" style="font-size:11.5px">'+esc(s.item)
            +(s.holder?' · kwa '+esc(s.holder):'')+(s.asOf?' · ripoti '+esc(s.asOf):'')+'</div></div>';
        }).join('');
    }
    g.innerHTML=h;
    g.classList.remove('hide');
    $all('[data-gc]',g).forEach(function(el){
      el.onclick=function(){ jump(cs[parseInt(el.getAttribute('data-gc'),10)]); };
    });
  }
  document.addEventListener('input',function(e){
    if(!e.target||e.target.id!=='gq') return;
    var q=e.target.value.trim();
    clearTimeout(t);
    if(q.length<3){ hide(); return; }
    t=setTimeout(function(){
      srv('globalSearch',{q:q}).then(function(d){
        if($('#gq').value.trim()!==q) return;
        draw(d);
      }).catch(function(){});
    },300);
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') hide(); });
  document.addEventListener('click',function(e){
    if(e.target.closest&&(e.target.closest('#gres')||e.target.id==='gq')) return;
    hide();
  });
})();

/* One search box, two jobs: filter the table rows on the page instantly, and (from three
   characters) ask the register for customers by name / phone / IMEI / agent. */
function custRow_(c){
  var h=telHref(c.phone);
  return '<tr><td><b>'+esc(c.name)+'</b><div class="mut" style="font-size:10px">IMEI '+esc(c.imei)+'</div></td>'
    +'<td>'+esc(c.team)+'</td><td>'+esc(c.agent)+'</td>'
    +'<td class="r">'+(c.daysOff!=null?money(c.daysOff):'—')+(c.locked7?' <span class="chip bad">7+</span>':'')+'</td>'
    +'<td class="r">'+(h!=='#'?'<a href="tel:'+h+'" title="'+esc(c.phone)+'">📞</a>':'')+'</td></tr>';
}
function wireSearch_(inputSel, boxSel, filterFn){
  var t=null;
  $(inputSel).addEventListener('input', function(){
    var q=this.value.trim();
    filterFn(q.toUpperCase());
    clearTimeout(t);
    var box=$(boxSel);
    if(q.length<3){ if(box) box.innerHTML=''; return; }
    t=setTimeout(function(){
      srv('customerSearch',{q:q}).then(function(d){
        if($(inputSel).value.trim()!==q) return;
        var cs=d.customers||[];
        if(!box) return;
        box.innerHTML=!cs.length?'':'<div class="card"><h2>Wateja / Customers — '+cs.length+'</h2>'
          +'<div style="overflow-x:auto"><table><thead><tr><th>Mteja</th><th>Timu</th><th>Agent</th><th class="r">OFF</th><th></th></tr></thead><tbody>'
          +cs.map(custRow_).join('')+'</tbody></table></div></div>';
      }).catch(function(){});
    },350);
  });
}
function srv(fn,args){
  return fetch('/api/portal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:CODE,fn:fn,args:args||{}})})
  .then(function(r){ return r.text().then(function(t){ var b; try{b=JSON.parse(t);}catch(e){throw new Error('Server error HTTP '+r.status);}
    if(r.status<200||r.status>=300||b.ok===false) throw new Error(b.error||('HTTP '+r.status)); return b; }); });
}

$('#inBtn').onclick=function(){

function enter(){
  $('#scrIn').classList.add('hide'); $('#scrApp').classList.remove('hide');
  $('#whoName').textContent=BOOT.name||'—';
  $('#whoRole').textContent=(BOOT.role||'')+(BOOT.readOnly?' · view-only':'');
  /* WHICH PANES: the server's navs list (per role, ADMIN all, AUDITOR view-all) decides
     every button -- the same rule the endpoints enforce. A pane added later shows up
     here the moment the server lists it. */
  var NAVKEY={dash:'dashboard',cust:'customers',ripoti:'reports',recovery:'recovery',
    fraud:'fraud',score:'scorecards',stock:'stock',move:'movement',staff:'staff',codes:'codes',settings:'settings'};
  var NAVS=BOOT.navs||[];
  $all('#tabs button').forEach(function(b){
    var k=NAVKEY[b.getAttribute('data-t')];
    if(k) b.classList.toggle('hide',NAVS.indexOf(k)<0);
  });
  if(NAVS.indexOf(NAVKEY[TAB])<0){
    var first=$all('#tabs button').filter(function(b){return !b.classList.contains('hide');})[0];
    if(first){ TAB=first.getAttribute('data-t');
      $all('#tabs button').forEach(function(x){x.classList.toggle('on',x===first);}); }
  }
  function navSet(open){
    document.body.classList.toggle('nav-closed', !open);
    try{ localStorage.setItem('hpNav', open?'1':'0'); }catch(e){}
  }
  var savedNav=null; try{ savedNav=localStorage.getItem('hpNav'); }catch(e){}
  navSet(savedNav==null ? window.innerWidth>760 : savedNav==='1');
  $('#navBtn').onclick=function(){ navSet(document.body.classList.contains('nav-closed')); };
  $('#navBack').onclick=function(){ navSet(false); };
  $all('#tabs button').forEach(function(b){ b.onclick=function(){
    TAB=b.getAttribute('data-t');
    $all('#tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
    if(window.innerWidth<=760) navSet(false);
    draw();
  };});
  $('#outBtn').onclick=function(){ try{localStorage.removeItem('hpCode');}catch(e){} location.reload(); };
  $('#inBtn').disabled=false;
  draw();
}
(function(){ try{ var c=localStorage.getItem('hpCode'); if(c){ $('#inCode').value=c; $('#inBtn').onclick(); } }catch(e){} })();

      +fus.map(function(s){ return '<option'+(c.fu===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'
      +'<div class="row hide" id="cmPromRow"><input class="inp" type="date" id="cmDate"><input class="inp" type="text" id="cmAmt" placeholder="Kiasi / amount (TZS)" inputmode="numeric"></div>'
      +'<div class="row"><textarea class="inp" id="cmTxt" rows="2" placeholder="Maoni… / comment"></textarea></div>'
      +'<button class="btn sm" id="cmSave">Hifadhi maoni / Save</button>'
      +'</div>':'')
    +'</div>';
  var el=$('#custCard'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  function hist(){
    srv('customerComments',{imei:c.imei}).then(function(x){
      var it=x.items||[];
      $('#custHist').innerHTML=!it.length?'<div class="mut">Hakuna maoni bado — wa kwanza kuandika.</div>'
        :'<div style="display:flex;flex-direction:column;gap:8px">'+it.map(function(r){
          return '<div style="background:var(--b50);border-radius:9px;padding:8px 11px;font-size:13px">'
            +(r.fu_status?'<span class="chip">'+esc(r.fu_status)+'</span> ':'')
            +(r.promise_date?'<span class="chip ok">ahadi '+esc(String(r.promise_date).slice(0,10))+'</span> ':'')
            +esc(r.comment||'')
            +'<div class="mut" style="font-size:10.5px;margin-top:3px">'+esc(r.created_by||'')+' · '+esc(String(r.created_at||'').slice(0,16).replace('T',' '))+'</div></div>';
        }).join('')+'</div>';
    }).catch(function(e){ $('#custHist').innerHTML='<div class="mut">'+esc(String(e.message||e))+'</div>'; });
  }
  hist();
  if(!canW) return;
  function promToggle(){
    var need=(d.fuNeedDate||[]).indexOf($('#cmFu').value)>=0;
    $('#cmPromRow').classList.toggle('hide',!need);
    if(need&&!$('#cmDate').value) $('#cmDate').value=isoToday(1);
  }
  $('#cmFu').onchange=promToggle; promToggle();
  $('#cmSave').onclick=function(){
    var fu=$('#cmFu').value, txt=$('#cmTxt').value.trim();
    if(!fu&&!txt){ toast('Chagua hali au andika maoni.',true); return; }
    var needP=(d.fuNeedDate||[]).indexOf(fu)>=0;
    $('#cmSave').disabled=true;
    srv('portalAddComment',{imei:c.imei,team:c.team||null,name:c.name||null,fu:fu||null,
      promiseDate:needP?($('#cmDate').value||null):null,
      promiseAmt:needP?(Number(String($('#cmAmt').value).replace(/\D/g,''))||null):null,
      comment:txt||null})
      .then(function(){
        toast('Imehifadhiwa.');
        c.fu=fu||c.fu; $('#cmTxt').value='';
        hist();
      })
      .catch(function(e){ toast(String(e.message||e),true); })
      .then(function(){ var b=$('#cmSave'); if(b) b.disabled=false; });
  };
}

var MZ={from:isoToday(-30),to:isoToday(0)};

    +'<button class="btn sm ghost" id="mzGo">Show</button></div>';
}
function mzWire(m,redraw){
  var go=$('#mzGo'); if(go) go.onclick=function(){ MZ.from=$('#mzFrom').value||MZ.from; MZ.to=$('#mzTo').value||MZ.to; redraw(m); };
}

/* ---------- stock movement: what got away after every upload ---------- */
var MV={hoopA:'',hoopB:'',watuA:'',watuB:''};
/* Which of the four movement reports are on screen. The pane holds a LOT of rows, so
   the reports are chosen with chips and laid side by side (left to right) instead of
   stacked -- "finding the next report requires a lot of scrolling" (the owner). The
   tiles are the same chooser: click one to show just that report. */
var MVSHOW={leftHoop:true,newInHoop:true,newWatu:true,leftWatu:true};
function drawMove(m){
  m.innerHTML='<div class="card"><h2>Stock movement</h2><div class="mut">Loading…</div></div>';
  srv('stockMovement',{hoopA:MV.hoopA,hoopB:MV.hoopB,watuA:MV.watuA,watuB:MV.watuB}).then(function(d){
    var c=d.counts||{};
    /* HONEST NAMES: the Watu side diffs two DAILY LOCKED LISTS, not Watu's whole loan
       book -- "new" means newly locked, "left" means no longer on the locked list
       (paid / back online / loan closed). The HOOP side diffs two Aged Stock reports. */
    var DEFS=[
      {k:'leftHoop', t:'Left the Hoop store', s:'in '+(d.hoopA||'—')+', gone by '+(d.hoopB||'—'),
        rows:d.leftHoop||[], cols:[['Serial / IMEI','serial'],['Item','item'],['Holder','holder']], color:'var(--bad)'},
      {k:'newInHoop', t:'New in the Hoop store', s:'appeared by '+(d.hoopB||'—'),
        rows:d.newInHoop||[], cols:[['Serial / IMEI','serial'],['Item','item'],['Holder','holder']], color:''},
      {k:'newWatu', t:'New on the locked list', s:'locked by '+(d.watuB||'—')+' — just got locked, call first',
        rows:d.newWatu||[], cols:[['IMEI','imei'],['Customer','name'],['Agent','agent'],['Model','model']], color:'var(--bad)'},
      {k:'leftWatu', t:'Left the locked list', s:'on '+(d.watuA||'—')+', off by '+(d.watuB||'—')+' — paid or back online',
        rows:d.leftWatu||[], cols:[['IMEI','imei'],['Customer','name'],['Agent','agent'],['Model','model']], color:'var(--ok)'},
    ];
    var shown=DEFS.filter(function(x){return MVSHOW[x.k];});
    function tbl(x){
      return '<div class="card" style="flex:1 1 '+(shown.length>1?'340px':'100%')+';min-width:300px;margin:0">'
        +'<h2>'+esc(x.t)+' — '+money(x.rows.length)+'</h2><div class="mut" style="margin-bottom:6px">'+esc(x.s)+'</div>'
        +'<div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table><thead><tr>'
        +x.cols.map(function(cc){return '<th>'+cc[0]+'</th>';}).join('')+'</tr></thead><tbody>'
        +(x.rows.length?x.rows.map(function(r){
          return '<tr>'+x.cols.map(function(cc){return '<td>'+esc(r[cc[1]]||'—')+'</td>';}).join('')+'</tr>';
        }).join(''):'<tr><td colspan="'+x.cols.length+'" class="mut">Nothing moved between these dates.</td></tr>')
        +'</tbody></table></div></div>';
    }
    m.innerHTML=
      '<div class="card"><h2>Stock movement — the difference after every upload</h2>'
      +'<div class="mut" style="margin-bottom:8px">HOOP store compares two Aged Stock uploads; the Watu side compares two daily LOCKED lists. Defaults are the newest two of each — change any date to check a different gap. Tick which reports to see; they sit side by side.</div>'
      +'<div class="row">'
      +'<span class="mut">Hoop store:</span><input class="inp" type="date" id="mvHA" value="'+esc(d.hoopA||'')+'" style="flex:0 1 140px"><span class="mut">→</span><input class="inp" type="date" id="mvHB" value="'+esc(d.hoopB||'')+'" style="flex:0 1 140px">'
      +'<span class="mut" style="margin-left:10px">Locked lists:</span><input class="inp" type="date" id="mvWA" value="'+esc(d.watuA||'')+'" style="flex:0 1 140px"><span class="mut">→</span><input class="inp" type="date" id="mvWB" value="'+esc(d.watuB||'')+'" style="flex:0 1 140px">'
      +'<button class="btn sm ghost" id="mvGo">Show</button></div>'
      +'<div class="row" style="gap:6px 14px;flex-wrap:wrap">'
      +DEFS.map(function(x){
        return '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0;cursor:pointer">'
          +'<input type="checkbox" class="mvT" value="'+x.k+'"'+(MVSHOW[x.k]?' checked':'')+'> '
          +x.t+' <b'+(x.color?' style="color:'+x.color+'"':'')+'>'+money(c[x.k])+'</b></label>';
      }).join('')+'</div>'
      +((d.hoopA||d.hoopB)?'':'<div class="mut" style="margin-top:8px">No Aged Stock uploads yet — the Hoop-store side fills the day Sipho uploads two reports.</div>')
      +'</div>'
      +'<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">'
      +shown.map(tbl).join('')
      +(shown.length?'':'<div class="card" style="flex:1;margin:0"><div class="mut">Tick at least one report above.</div></div>')
      +'</div>';
    $('#mvGo').onclick=function(){
      MV.hoopA=$('#mvHA').value; MV.hoopB=$('#mvHB').value;
      MV.watuA=$('#mvWA').value; MV.watuB=$('#mvWB').value;
      drawMove(m);
    };
    $all('.mvT',m).forEach(function(cb){
      cb.onchange=function(){ MVSHOW[cb.value]=cb.checked; drawMove(m); };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

function drawStaff(m){

      +'<div class="row" style="gap:6px">'+Object.keys(d.byRole||{}).map(function(k){return '<button class="chip" data-rf="'+esc(k)+'" style="border:1px solid transparent;cursor:pointer">'+esc(k)+' · '+money(d.byRole[k])+'</button>';}).join('')+'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Role</th><th>Branch</th><th>Phone</th>'+(canKin?'<th>Next of kin</th>':'')+'<th>Status</th></tr></thead><tbody>'
      +((d.staff||[]).length?(d.staff||[]).map(function(o){
        return '<tr data-role="'+esc(o.role||'')+'"><td><b>'+esc(o.name)+'</b>'+(o.joined?'<div class="mut" style="font-size:10px">since '+esc(o.joined)+'</div>':'')+'</td>'
          +'<td>'+esc(o.role||'—')+'</td><td>'+esc(o.branch||'—')+'</td><td>'+esc(o.phone||'')+'</td>'
          +(canKin?'<td class="mut" style="font-size:11px">'+esc(o.kin||'—')+(o.kinPhone?' · '+esc(o.kinPhone):'')+'</td>':'')
          +'<td>'+(o.active?'<span class="chip ok">ACTIVE</span>':'<span class="chip bad">OFF</span>')+'</td></tr>';
      }).join(''):'<tr><td colspan="6" class="mut">No staff yet — upload the Agents Register page (saved HTML) at /upload.</td></tr>')
      +'</tbody></table></div></div><div id="staffCust"></div>';
    /* The role chips are FILTERS: click one to see just that rank, click again for all.
       The search box and the chip compose -- both must match. */
    var ROLEF='';
    function applyStaffFilter(){
      var q=($('#staffQ')?$('#staffQ').value.trim().toUpperCase():'');
      $all('tbody tr', $('#main')).forEach(function(tr){
        var okQ=!q||tr.textContent.toUpperCase().indexOf(q)>=0;
        var okR=!ROLEF||tr.getAttribute('data-role')===ROLEF;
        tr.style.display=(okQ&&okR)?'':'none';
      });
      $all('[data-rf]',m).forEach(function(c){
        c.style.borderColor=(c.getAttribute('data-rf')===ROLEF)?'var(--b700)':'transparent';
        c.style.background=(c.getAttribute('data-rf')===ROLEF)?'var(--b100)':'';
      });
    }
    $all('[data-rf]',m).forEach(function(c){
      c.onclick=function(){ ROLEF=(ROLEF===c.getAttribute('data-rf'))?'':c.getAttribute('data-rf'); applyStaffFilter(); };
    });
    wireSearch_('#staffQ','#staffCust',function(){ applyStaffFilter(); });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

  Promise.all([srv('accessCodes'),srv('officers')]).then(function(res){
    var d=res[0], off=res[1];
    m.innerHTML='<div class="card"><h2>Access codes — mfumo (portal)</h2>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Code</th><th>Jina</th><th>Role</th><th>Timu</th><th>Tabs</th><th></th></tr></thead><tbody>'
      +(d.codes||[]).map(function(c){
        return '<tr><td class="code">'+esc(c.code)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.role)+'</td>'
          +'<td>'+esc(c.teams?c.teams.join(', '):'ZOTE')+'</td><td class="mut">'+esc((c.tabs||[]).join(', '))+'</td>'
          +'<td class="r"><button class="btn sm ghost" data-ed="'+esc(c.code)+'" data-name="'+esc(c.name)+'" data-role="'+esc(c.role)+'" data-teams="'+esc(c.teams&&c.teams.length?c.teams.join(','):'ALL')+'">Hariri</button> '
          +'<button class="btn sm ghost" data-del="'+esc(c.code)+'">Futa</button></td></tr>';
      }).join('')+'</tbody></table></div>'
      +'<div class="row" style="margin-top:14px"><input class="inp" id="acCode" placeholder="Code (siri)"><input class="inp" id="acName" placeholder="Jina">'
      +'<select class="inp" id="acRole">'+(d.roles||[]).map(function(r){return '<option>'+esc(r.role)+'</option>';}).join('')+'</select>'
      +'<input class="inp" id="acTeams" placeholder="Timu: andika ALL au orodha (comma)"><button class="btn sm" id="acAdd">Ongeza</button></div>'
      +'<div class="mut" style="margin-top:6px">ADMIN inapata kila kitu. AUDITOR ni kuangalia tu. '
      +'Hariri hujaza fomu — badilisha chochote (hata Code yenyewe, hata yako) kisha Hifadhi.</div>'
      +'</div>'
      +'<div class="card"><h2>Roles</h2>'
      +'<div class="row" style="flex-wrap:wrap">'+(d.roles||[]).map(function(r){
          return '<span style="display:inline-flex;align-items:center;gap:2px">'
            +'<button class="btn sm ghost" data-rl="'+esc(r.role)+'" data-rltabs="'+esc((r.tabs||[]).join(','))+'">'
            +esc(r.role)+((r.tabs||[]).length?' \u00B7 '+esc((r.tabs||[]).join('+')):'')
            +(r.inUse?' \u00B7 <span class="chip">watu '+r.inUse+'</span>':'')+'</button>'
            +(!r.inUse?'<button class="btn sm ghost" data-rldel="'+esc(r.role)+'" title="Futa role hii" style="color:var(--bad);border-color:#F6CFCB;padding:7px 9px">\u00D7</button>':'')
            +'</span>';
        }).join('')+'</div>'
      +'<div class="row"><input class="inp" id="rlName" placeholder="Role name (new, or click a chip to edit)">'
      +'<button class="btn sm" id="rlSave">Save role</button></div>'
      +'<div class="row" id="rlTabs" style="flex-wrap:wrap;gap:8px 14px">'
      +((d.navTabs||[]).concat(['upload'])).map(function(k){
          var lbl={dashboard:'Dashboard',customers:'Customers',reports:'Call reports',recovery:'Recovery',
            fraud:'Fraud audit',scorecards:'Agent scorecards',stock:'Stock',movement:'Stock movement',staff:'Staff',codes:'Access codes',settings:'Settings',
            upload:'Upload (action)'}[k]||k;
          return '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0">'
            +'<input type="checkbox" class="rlT" value="'+esc(k)+'"> '+esc(lbl)+'</label>';
        }).join('')+'</div>'
      +'<div class="mut">Tick exactly the panes this role opens — every pane is yours to grant, including any added later. '
      +'"Upload (action)" is permission to send files at /upload. ADMIN always holds everything; AUDITOR sees all, changes nothing. '
      +'A role nobody holds carries <b>×</b> to delete it.</div>'
      +'</div>'
      +'<div class="card"><h2>App users — HOOP Calls logins</h2>'
      +'<div class="mut" style="margin-bottom:10px">Who is signed in on the phones. Switching one person off does not touch the team code — only their account.</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Branch</th><th>Phone</th><th>Last sync</th><th>Status</th><th></th></tr></thead><tbody>'
      +((off.officers||[]).length?(off.officers||[]).map(function(o){
        return '<tr><td><b>'+esc(o.name)+'</b>'+(o.leader?' <span class="chip">leader</span>':'')
          +(String(o.role||'').toUpperCase()==='AGENT'?' <span class="chip">agent</span>':'')+'</td>'
          +'<td>'+esc(o.team||'')+'</td><td>'+esc(o.phone||'')+'</td>'
          +'<td class="mut">'+(o.lastSync?esc(String(o.lastSync).slice(0,16).replace('T',' ')):'—')+'</td>'
          +'<td>'+(o.active?'<span class="chip ok">ACTIVE</span>':'<span class="chip bad">OFF</span>')+'</td>'
          +'<td class="r"><button class="btn sm ghost" data-tg="'+esc(o.userId)+'" data-on="'+(o.active?1:0)+'">'+(o.active?'Zima':'Washa')+'</button></td></tr>';
      }).join(''):'<tr><td colspan="6" class="mut">No app users yet — the credit team registers from the app with a team code.</td></tr>')
      +'</tbody></table></div></div>'
      +'</tbody></table></div></div>'
      +(function(){
        /* NO teams, NO branches -- shared sign-in codes for the app. Kinondoni and
           the rest are just location labels on customer rows. Two codes exist: HOOP
           for staff (the workload deal takes over) and AGENT for sales agents (each
           agent sees ONLY the customers they sold -- matched by the phone they
           register with against Sipho's agents register). Both are rotated the same
           way when somebody leaves. */
        var card=function(teamKey,title,blurb,makeLbl){
          var co=(BOOT.teams||[]).filter(function(t){return t.team===teamKey;})[0];
          return '<div class="card"><h2>'+esc(title)+'</h2>'
            +'<div class="mut" style="margin-bottom:10px">'+blurb+'</div>'
            +(co
              ? '<div class="row"><span class="code" style="font-size:20px">'+esc(co.code||'—')+'</span>'
                +'<button class="btn sm ghost" data-corot="'+teamKey+'">Rotate code</button></div>'
              : '<button class="btn sm" data-comk="'+teamKey+'">'+esc(makeLbl)+'</button>')
            +'</div>';
        };
        return card('HOOP','App sign-in code — staff',
            'ONE code for the whole company — every credit user registers on HOOP Calls with it; the workload deal does the rest. Rotating it stops NEW registrations with the old code; to sign an existing person out, use Zima above.',
            'Create the company code')
          +card('AGENT','App sign-in code — agents',
            'ONE shared code for ALL sales agents — share it in the WhatsApp group and rotate it here when somebody leaves. An agent signs in with just their registered phone number and this code; their name and branch are read from the agents register, and the app shows them ONLY the customers they sold. A number that is not on the register cannot sign in at all.',
            'Create the agent code');
      })();
    $all('[data-comk]',m).forEach(function(b){
      b.onclick=function(){
        var t=b.getAttribute('data-comk');
        srv('saveTeam',{team:t})
          .then(function(){ return srv('newTeamCode',{team:t}); })
          .then(function(d2){ toast((t==='AGENT'?'Agent':'Company')+' code: '+d2.code);
            return srv('boot').then(function(x){BOOT=x;drawCodes(m);}); })
          .catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-corot]',m).forEach(function(b){
      b.onclick=function(){
        var t=b.getAttribute('data-corot');
        if(!confirm('Rotate the '+(t==='AGENT'?'agent':'company')+' code? The old one stops working for new registrations.')) return;
        srv('newTeamCode',{team:t}).then(function(d2){
          toast('New '+(t==='AGENT'?'agent':'company')+' code: '+d2.code);
          return srv('boot').then(function(x){BOOT=x;drawCodes(m);});
        }).catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-tg]',m).forEach(function(b){
      b.onclick=function(){
        srv('officerActive',{userId:b.getAttribute('data-tg'),active:b.getAttribute('data-on')!=='1'})
          .then(function(){drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $all('[data-rl]',m).forEach(function(b){
      b.onclick=function(){
        $('#rlName').value=b.getAttribute('data-rl');
        var t=(b.getAttribute('data-rltabs')||'').split(',');
        $all('.rlT',m).forEach(function(c){ c.checked=t.indexOf(c.value)>=0; });
      };
    });
    $all('[data-rldel]',m).forEach(function(b){
      b.onclick=function(){
        var role=b.getAttribute('data-rldel');
        if(!confirm('Futa role '+role+'? Hakuna mtu anayeitumia sasa.')) return;
        srv('deleteRole',{role:role})
          .then(function(){toast('Role '+role+' imefutwa.');drawCodes(m);})
          .catch(function(e){toast(String(e.message||e),true);});
      };
    });
    $('#rlSave').onclick=function(){
      var role=$('#rlName').value.trim();
      if(!role){ toast('Enter a role name.',true); return; }
      var tabs=$all('.rlT',m).filter(function(c){return c.checked;}).map(function(c){return c.value;});
      if(!tabs.length){ toast('Tick at least one pane for this role.',true); return; }
      srv('saveRole',{role:role,tabs:tabs})
        .then(function(){toast('Role saved.');drawCodes(m);})
        .catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-ed]',m).forEach(function(b){
      b.onclick=function(){
        EDIT_FROM=b.getAttribute('data-ed');
        $('#acCode').value=EDIT_FROM;
        $('#acName').value=b.getAttribute('data-name')||'';
        $('#acRole').value=b.getAttribute('data-role')||'ADMIN';
        $('#acTeams').value=b.getAttribute('data-teams')||'';
        $('#acAdd').textContent='Hifadhi / Save';
        $('#acCode').focus();
      };
    });
    $('#acAdd').onclick=function(){
      var role=$('#acRole').value;
      var tabs=role==='ADMIN'?['upload','settings']:[];
      var rawTeams=$('#acTeams').value.trim();
      var allTeams=rawTeams.toUpperCase()==='ALL'||rawTeams.toUpperCase()==='ZOTE';
      var teams=allTeams?[]:rawTeams.split(',').map(function(x){return x.trim();}).filter(Boolean);
      if(!allTeams&&!teams.length){ toast('Andika ALL au orodha ya timu. / State ALL, or name the teams.',true); return; }
      var newCode=$('#acCode').value.trim();
      var save=function(){ return srv('saveAccessCode',{code:newCode,name:$('#acName').value,role:role,teams:teams,allTeams:allTeams,tabs:tabs}); };
      var flow = (EDIT_FROM && EDIT_FROM!==newCode)
        ? srv('renameAccessCode',{from:EDIT_FROM,to:newCode}).then(function(r){
            if(r.self){ CODE=newCode; try{localStorage.setItem('hpCode',newCode);}catch(e){} }
            return save();
          })
        : save();
      flow.then(function(){toast('Imehifadhiwa.');drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
    };
    $all('[data-del]',m).forEach(function(b){
      b.onclick=function(){
        if(!confirm('Futa code hii?')) return;
        srv('deleteAccessCode',{code:b.getAttribute('data-del')})
          .then(function(){drawCodes(m);}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

/* ---------- settings ---------- */
function drawSettings(m){
  m.innerHTML='<div class="card"><h2>Settings</h2><div class="mut">Inapakia…</div></div>';
  srv('settings').then(function(d){
    m.innerHTML='<div class="card"><h2>Settings</h2>'
      +(d.settings||[]).map(function(s,i){
        return '<div class="row"><div style="min-width:170px;font-size:12.5px;font-weight:700">'+esc(s.key)+'</div>'
          +'<input class="inp" id="st'+i+'" value="'+esc(s.value)+'">'
          +'<button class="btn sm" data-sv="'+esc(s.key)+'" data-i="'+i+'">Save</button></div>';
      }).join('')
      +'<div class="mut">SYSTEM_OPEN=YES hufungua mfumo. CALL_BRAND ni jina kwenye app. FU_STATUSES: hali za ufuatiliaji — tenganisha kwa comma (au mstari mpya).</div>'
      +'</div>';
    $all('[data-sv]',m).forEach(function(b){
      b.onclick=function(){
        srv('settingSet',{key:b.getAttribute('data-sv'),value:$('#st'+b.getAttribute('data-i')).value})
          .then(function(){toast('Imehifadhiwa.');}).catch(function(e){toast(String(e.message||e),true);});
      };
    });
  }).catch(function(e){ m.innerHTML='<div class="card">'+esc(String(e.message||e))+'</div>'; });
}

</script>
</body>
</html>
