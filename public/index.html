<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOOP PMO</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0e1420; color: #e8edf5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { max-width: 520px; text-align: center; }
  .mark {
    font-size: 44px; font-weight: 800; letter-spacing: 2px;
    color: #ffb648;
  }
  .mark span { color: #e8edf5; font-weight: 300; }
  p.tag { margin-top: 10px; font-size: 15px; color: #9aa7ba; line-height: 1.6; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .pill {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #2a3648; color: #9aa7ba; background: #141c2b;
  }
  footer { margin-top: 36px; font-size: 12px; color: #5c6a7f; }
</style>
</head>
<body>
<main>
  <div class="mark">HOOP <span>PMO</span></div>
  <p class="tag">Watu follow-up &mdash; the daily locked list, the calls, the recovery.<br>
     The system is being set up; the working screens land here.</p>
  <div class="pills">
    <span class="pill">HOOP Calls</span>
    <span class="pill">Daily Watu upload</span>
    <span class="pill">45-day window</span>
    <span class="pill">Ripoti</span>
    <span class="pill">Recovery</span>
  </div>
  <footer>Hoop Ltd &middot; watu simu follow-up</footer>
</main>
</body>
</html>
