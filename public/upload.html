<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HOOP PMO — Upload</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{ --b900:#0B2A6B; --b800:#10357F; --b700:#1D4ED8; --b600:#2563EB; --b300:#93C5FD; --b100:#DBEAFE; --b50:#EFF6FF;
  --bg:#F6F8FC; --card:#fff; --ink:#0F172A; --mut:#64748B; --line:#E2E8F0;
  --ok:#067647; --okbg:#E7F6EE; --bad:#B42318; --badbg:#FDECEA; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 80px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.head .mark{width:54px;height:36px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.head h1{font-size:19px;margin:0}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 10px -4px rgba(11,42,107,.14)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=password],input[type=date]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.file-drop{display:block;border:2px dashed var(--b300);background:var(--b50);color:var(--b800);border-radius:12px;
  padding:26px 16px;text-align:center;font-weight:700;cursor:pointer;margin-top:14px}
.file-drop input{display:none}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:11px;background:var(--b700);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{background:var(--b300)}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;line-height:1.55}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
.msg.bad{display:block;background:var(--badbg);color:var(--bad)}
.bar{height:8px;background:var(--b100);border-radius:99px;overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--b600);transition:width .3s}
.links{margin-top:18px;font-size:13.5px}
.links a{color:var(--b600);margin-right:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="mark" viewBox="0 0 64 40"><rect width="64" height="40" rx="9" fill="#fff"/><text x="32" y="21" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-1" fill="#2E2B7A" font-family="Arial">HOOP</text><path d="M22 26 A 11 11 0 0 0 42 26" fill="none" stroke="#35A8E1" stroke-width="4" stroke-linecap="round"/></svg>
    <div><h1>Watu daily list</h1><p>Pakia orodha ya Watu ya leo — Excel au CSV, safu 16 za kawaida.</p></div>
  </div>
  <div class="card">
    <label>Msimbo wa mfumo / Access code</label>
    <input type="password" id="code" placeholder="Access code (needs upload permission)" autocomplete="off">
    <label>Tarehe ya orodha / List date</label>
    <input type="date" id="date">
    <label class="file-drop" id="drop">Bofya kuchagua faili — Excel, CSV, au ukurasa wa HTML uliohifadhiwa (SyscoPos)<input type="file" id="file" accept=".xlsx,.xls,.csv,.html,.htm"></label>
    <div id="picked" style="font-size:13px;color:var(--mut);margin-top:8px"></div>
    <button class="btn" id="send" disabled>Pakia / Upload &mdash; inachukua nafasi ya tarehe hii / replaces this date</button>
    <button class="btn" id="wipe" style="background:#fff;color:#B42318;border:1.5px solid #F6CFCB;margin-top:10px">Futa data ya tarehe hii / Delete this date's data</button>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="links"><a href="/call">HOOP Calls →</a><a href="/portal">Portal →</a></div>
</div>
<script>
function $(s){ return document.querySelector(s); }
var AOA = null, NAME = '';
var SLICE = 2000;   // rows per request, header re-sent every slice; the server is stateless

(function init(){
  var d = new Date(); var p = function(n){ return ('0'+n).slice(-2); };
  $('#date').value = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  try { var c = localStorage.getItem('huCode'); if (c) $('#code').value = c; } catch(e){}
})();

/* SIPHO'S HTML SAVES: SyscoPos cannot export Excel from every screen, so a saved page
   is a legal upload. The table is parsed OUT of the HTML right here in the browser,
   the rows go up like any spreadsheet, and the HTML itself is dumped. The preview shows
   the columns and sample rows of the page he saved -- including the honest "0 rows"
   when the page was saved before the table finished loading. */
function parseHtmlFile(text){
  var doc = new DOMParser().parseFromString(text, 'text/html');
  var ths = [].slice.call(doc.querySelectorAll('table thead th')).map(function(t){ return t.textContent.trim(); });
  var thStr = ths.join('|').toUpperCase();
  var trs = [].slice.call(doc.querySelectorAll('tbody tr')).filter(function(tr){ return tr.querySelector('td'); });
  var rows = trs.map(function(tr){
    return [].slice.call(tr.querySelectorAll('td')).map(function(td){ return td.textContent.replace(/\s+/g,' ').trim(); });
  }).filter(function(r){ return r.length >= 4; });
  function pick(src, key, stops){
    var m = String(src||'').match(new RegExp(key + '\\s*:\\s*(.*?)(?=\\s*(?:' + stops + ')\\s*:|$)'));
    return m ? m[1].trim() : '';
  }
  if (thStr.indexOf('NEXT_OF_KIN') >= 0 || thStr.indexOf('NEXT OF KIN') >= 0){
    var out = [['JOINED','NAME','NATIONAL_ID','PHONE','EMAIL','KIN_NAME','KIN_PHONE','KIN_RELATIONSHIP','ROLE','BRANCH','STATUS']];
    rows.forEach(function(c){
      out.push([c[0]||'', c[1]||'',
        pick(c[2],'National_Id','Phone|Email'), pick(c[2],'Phone','Email|National_Id'), pick(c[2],'Email','National_Id|Phone'),
        pick(c[3],'Name','Phone|Relationship'), pick(c[3],'Phone','Relationship|Name'), pick(c[3],'Relationship','Name|Phone'),
        c[4]||'', c[5]||'', c[6]||'']);
    });
    return { kind: 'Agents Register — rejista ya maajenti', aoa: out };
  }
  if (thStr.indexOf('SERIAL') >= 0){
    var out2 = [['AGENT','ITEM','SERIAL','RECEIVED','AGE']];
    rows.forEach(function(c){ out2.push([c[0]||'', c[1]||'', c[2]||'', c[3]||'', c[4]||'']); });
    return { kind: 'Aged Stock — stoo iliyokaa', aoa: out2 };
  }
  return { kind: null, aoa: null, headers: ths };
}

function preview(kindNote){
  var n = Math.max(0, (AOA||[]).length - 1);
  var head = (AOA && AOA[0]) || [];
  var html = (kindNote ? '<b>' + kindNote + '</b><br>' : '') + NAME + ' — safu ' + n + ' data rows.';
  html += '<br>Vichwa: ' + head.slice(0,7).join(', ') + (head.length > 7 ? '…' : '');
  for (var i = 1; i <= Math.min(2, n); i++){
    html += '<br><span style="color:#0F172A">• ' + AOA[i].slice(0,5).map(function(c){ return String(c === '' ? '—' : c); }).join(' · ') + '</span>';
  }
  $('#picked').innerHTML = html;
  $('#send').disabled = !n;
  if (!n && kindNote) show('Safu 0 — ukurasa ulihifadhiwa KABLA orodha haijaonekana. Fungua ukurasa, subiri majina yaonekane, ndipo u-save tena. / 0 rows: save the page AFTER the table is visible.', 'bad');
  else show('', '');
}

$('#file').addEventListener('change', function(){
  var f = this.files && this.files[0];
  if (!f) return;
  NAME = f.name;
  var isHtml = /\.html?$/i.test(f.name);
  var rd = new FileReader();
  rd.onload = function(){
    try {
      if (isHtml){
        var got = parseHtmlFile(String(rd.result));
        if (!got.kind){
          AOA = null; $('#send').disabled = true;
          $('#picked').textContent = NAME + ' — ukurasa haujatambuliwa. Vichwa vilivyoonekana: ' + (got.headers || []).join(', ');
          show('Ukurasa huu wa HTML haufanani na Agents Register wala Aged Stock.', 'bad');
          return;
        }
        AOA = got.aoa;
        preview(got.kind + ' (data pekee inapakiwa; HTML inatupwa)');
        return;
      }
      var wb = XLSX.read(new Uint8Array(rd.result), { type:'array', cellDates:true });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      AOA = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:'' });
      // Date objects -> the text shape the server parses everywhere else.
      AOA = AOA.map(function(row){ return row.map(function(c){
        if (c instanceof Date && !isNaN(c)) {
          var p = function(n){ return ('0'+n).slice(-2); };
          return c.getFullYear() + '-' + p(c.getMonth()+1) + '-' + p(c.getDate());
        }
        return c;
      }); });
      preview('');
    } catch(e){ show('Faili halisomeki: ' + e.message, 'bad'); }
  };
  if (isHtml) rd.readAsText(f); else rd.readAsArrayBuffer(f);
});

function show(t, cls){ var m = $('#msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }
function uuid_(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16); });
}

$('#wipe').onclick = function(){
  var code = $('#code').value.trim();
  var day = $('#date').value;
  if (!code){ show('Weka msimbo wako / enter your access code.', 'bad'); return; }
  if (!day){ show('Chagua tarehe kwanza / choose the date first.', 'bad'); return; }
  if (!confirm('FUTA data YOTE ya tarehe ' + day + '? Orodha ya siku hiyo, historia yake na maoni ya simu za siku hiyo vinaondoka kabisa. / DELETE ALL data for ' + day + '? That day\'s list, its history and its call-app comments are removed for good.')) return;
  try { localStorage.setItem('huCode', code); } catch(e){}
  $('#wipe').disabled = true; $('#send').disabled = true;
  show('Inafuta\u2026 / deleting\u2026', 'ok');
  fetch('/api/upload', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ code: code, action: 'delete', meta: { uploadDate: day } })
  }).then(function(r){ return r.json().then(function(b){ return { s:r.status, b:b }; }); })
    .then(function(x){
      if (x.s < 200 || x.s >= 300 || x.b.ok === false) throw new Error((x.b && x.b.error) || ('HTTP ' + x.s));
      var d = x.b.deleted || {};
      show('Imefutwa tarehe ' + x.b.date + ': orodha ' + (d.deck||0) + ' \u00B7 rejista ' + (d.register||0)
        + ' \u00B7 historia ' + (d.snapshots||0) + '. Simu zitajisafisha zenyewe. / Deleted \u2014 phones will refresh themselves.', 'ok');
    })
    .catch(function(e){ show('Imeshindikana: ' + (e.message || e), 'bad'); })
    .then(function(){ $('#wipe').disabled = false; $('#send').disabled = !(AOA && AOA.length > 1); });
};

$('#send').onclick = function(){
  var code = $('#code').value.trim();
  if (!code){ show('Weka msimbo wako / enter your access code.', 'bad'); return; }
  if (!AOA || AOA.length < 2){ show('Chagua faili kwanza.', 'bad'); return; }
  try { localStorage.setItem('huCode', code); } catch(e){}
  var header = AOA[0], data = AOA.slice(1);
  var total = Math.max(1, Math.ceil(data.length / SLICE));
  var batch = uuid_();
  var sent = 0, inserted = 0, droppedAll = [];
  $('#send').disabled = true;
  $('#bar').style.display = 'block'; $('#barFill').style.width = '2%';
  show('Inapakia… / uploading…', 'ok');
  function part(i){
    var rows = [header].concat(data.slice(i*SLICE, (i+1)*SLICE));
    return fetch('/api/upload', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ code: code, rows: rows,
        meta: { uploadDate: $('#date').value },
        part: { id: batch, index: i, total: total } })
    }).then(function(r){ return r.json().then(function(b){ return { s:r.status, b:b }; }); })
      .then(function(x){
        if (x.s < 200 || x.s >= 300 || x.b.ok === false) throw new Error((x.b && x.b.error) || ('HTTP ' + x.s));
        sent++; inserted += x.b.inserted || 0;
        (x.b.droppedRows || []).forEach(function(d){ droppedAll.push(d); });
        $('#barFill').style.width = Math.round(100*sent/total) + '%';
        if (sent < total) return part(sent);
        var t = 'Imepakiwa: safu ' + inserted + ' · tarehe ' + (x.b.date || $('#date').value)
          + '. Simu zitajipakia zenyewe (DATA_VERSION imesogezwa).';
        if (droppedAll.length) t += '\nZilizokataliwa (' + droppedAll.length + '): '
          + droppedAll.slice(0,10).map(function(d){ return d.name + ' (' + d.imei + ')'; }).join('; ')
          + (droppedAll.length > 10 ? ' …' : '');
        show(t, 'ok');
        $('#send').disabled = false;
      });
  }
  part(0).catch(function(e){
    show('Imeshindikana: ' + (e.message || e) + ' — jaribu tena; upakiaji mpya unapata batch mpya, hakuna kitakachorudiwa mara mbili.', 'bad');
    $('#send').disabled = false;
  });
};
</script>
</body>
</html>
