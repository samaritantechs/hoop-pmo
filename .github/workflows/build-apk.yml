# Builds both Android apps and commits them into public/, where Vercel serves them at
# /HOOPLOAN.apk and /HOOPLOAN-Lock.apk -- the URLs app-version.json and lock-version.json
# advertise to phones. Runs in Actions because the APKs need the Android toolchain; the web
# app itself never needs a build.
name: Build HOOPLOAN APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-version.json'
      - 'lock-version.json'
      - '.github/workflows/build-apk.yml'
  # Compiling is the only real check these apps get -- there is no Android device anywhere in
  # this loop -- so it has to run on the pull request, not after the merge.
  pull_request:
    paths:
      - 'android/**'
      - 'app-version.json'
      - 'lock-version.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build both release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :lock:assembleRelease

      # THE PROVISIONING CHECKSUM. A QR-provisioned phone refuses an admin APK whose signing
      # certificate does not match the checksum in the QR, so that checksum is derived here
      # from the very key that just signed the build -- rather than pasted in by hand once and
      # left to go stale, which would strand a whole batch at the setup wizard with no
      # explanation. base64url, unpadded: the exact form Android's provisioning expects.
      - name: Stamp the provisioning payload
        run: |
          CKSUM=$(keytool -exportcert -keystore android/sideload.keystore \
                    -alias hopecalls -storepass hopecalls 2>/dev/null \
                  | openssl dgst -binary -sha256 | openssl base64 | tr '+/' '-_' | tr -d '=\n')
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("lock-version.json", "utf8"));
            fs.writeFileSync("public/lock-provisioning.json", JSON.stringify({
              checksum: process.argv[1],
              apkUrl: v.apkUrl,
              component: "com.samaritantechs.hooploanlock/.LockAdmin",
              builtFrom: process.argv[2],
            }, null, 2) + "\n");
          ' "$CKSUM" "${GITHUB_SHA::9}"
          echo "signing certificate checksum: $CKSUM"

      - name: Publish the APKs into the site
        # THE GUARD IS THE BRANCH, NOT THE EVENT, and the difference is not cosmetic. This step
        # ends in `git pull --rebase origin main` and `git push origin main`, which is only ever
        # correct when the checkout IS main. The old condition -- "not a pull_request" -- let a
        # workflow_dispatch on ANY branch through: it committed the APKs onto that branch, then
        # rebased it onto main and pushed. Caught by dispatching this on a feature branch, where
        # the rebase hit a conflict in every file the branch had changed and stopped. On a
        # branch that happened to rebase cleanly it would have pushed unreviewed work straight
        # to main instead. Dispatching a build to check that it compiles must never be able to
        # publish anything.
        if: github.ref == 'refs/heads/main'
        run: |
          # TWO NAMES FOR THE SAME BUILD, and the old one is not dead weight. Installed apps
          # take their download URL from /api/app-version at runtime, so they follow the
          # rename by themselves -- but a link that was written down, printed on a setup
          # sheet or turned into a QR for the sales desks points at /HOOP-Calls.apk forever,
          # and a 404 there reads as "the system is down". It costs 100KB in the repo to
          # keep every one of those working, and nothing at all to serve.
          cp android/app/build/outputs/apk/release/app-release.apk public/HOOPLOAN.apk
          cp public/HOOPLOAN.apk public/HOOP-Calls.apk
          cp android/lock/build/outputs/apk/release/lock-release.apk public/HOOPLOAN-Lock.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/HOOPLOAN.apk public/HOOP-Calls.apk public/HOOPLOAN-Lock.apk public/lock-provisioning.json
          git commit -m "APKs built from ${GITHUB_SHA::9}" || exit 0
          git pull --rebase origin main
          git push origin main

      - uses: actions/upload-artifact@v4
        with:
          name: hooploan-apks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/lock/build/outputs/apk/release/lock-release.apk
            public/lock-provisioning.json
