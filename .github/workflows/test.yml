# The test suite, run by a machine instead of by whoever remembered.
#
# WHY THIS DID NOT EXIST UNTIL NOW, which is the part worth writing down. There were two
# workflows here -- one that builds the APKs and one that probes production by hand -- and
# neither ran `npm test`. The suite has grown to 158 tests, several of them written
# specifically to stop a bug coming back, and every one of them only ever ran because
# somebody typed the command. A guard that runs at the author's discretion is a guard on the
# honour system: it holds right up until the day it matters.
#
# It runs on every push and every pull request with no `paths` filter, deliberately. The APK
# workflow filters on `android/**` because compiling Android is slow and irrelevant to a CSS
# change; this suite takes a couple of seconds and asserts things about the schema, the
# importers, the portal HTML and the Android sources all at once. Any filter here is a way to
# be sure the tests did not run on exactly the change that needed them.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines. The suite uses node:test and the native test
          # runner's glob support, so it is genuinely version-sensitive.
          node-version: '22'
      # No lockfile is committed, so `npm ci` would fail. The two dependencies are only
      # needed by the API at runtime -- the tests run against fake-db and never open a
      # socket -- but installing them keeps an accidental real import from passing here
      # and failing on Vercel.
      - run: npm install --no-audit --no-fund
      - run: npm test
      # A JDK is on the runner already, which matters: two tests shell out to `javac` to
      # parse-check the Android sources and SKIP THEMSELVES SILENTLY when it is missing.
      # Without this line they would go on "passing" here by not running at all.
      - name: Confirm javac was available (the parse checks are not silently skipped)
        run: javac -version

      # A LOCK-APP FIX THAT CANNOT REACH THE FLEET IS NOT A FIX.
      # =====================================================================================
      # SelfUpdate is the ONLY way a change to the lock app reaches a handset already in a
      # customer's pocket, and it decides with one line:
      #
      #     if (remote <= BuildConfig.VERSION_CODE) return;   // already current
      #
      # So shipping a change to android/lock/** without raising versionCode in
      # lock-version.json builds a new APK, publishes it, and delivers it to nobody. Every
      # phone in the field keeps running the old build for the rest of its loan.
      #
      # That already happened once, and on the worst possible change: the fix for a release
      # path that left handsets owned, silent and unreachable shipped at versionCode 1, the
      # same as the build carrying the bug. It was caught by reading the version file, not by
      # anything failing -- which is this feature's fourth success-shaped failure.
      - name: A lock-app change must raise versionCode, or no handset will ever get it
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet FETCH_HEAD HEAD -- android/lock/ lock-version.json; then
            echo "lock app untouched; nothing to check."
            exit 0
          fi
          if git diff --quiet FETCH_HEAD HEAD -- android/lock/; then
            echo "only lock-version.json changed; nothing to check."
            exit 0
          fi
          old=$(git show FETCH_HEAD:lock-version.json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).versionCode')
          new=$(node -pe 'JSON.parse(require("fs").readFileSync("lock-version.json","utf8")).versionCode')
          echo "android/lock changed. versionCode $old -> $new"
          if [ "$new" -le "$old" ]; then
            echo "::error::android/lock/** changed but lock-version.json versionCode did not increase ($old -> $new). SelfUpdate skips any build whose versionCode is not HIGHER than the installed one, so this change would reach no handset already in the field. Raise versionCode."
            exit 1
          fi
