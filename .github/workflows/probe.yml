# Probes the live production site from a runner with open internet -- the dev sandbox
# cannot reach vercel.app, so this is how the session sees what a phone sees.
name: Probe production
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          set +e
          for path in / /call /api/health; do
            echo "=== GET $path ==="
            curl -sS -o /tmp/body -w "HTTP %{http_code} final=%{url_effective}\n" -L "https://hoop-pmo.vercel.app$path"
            head -c 400 /tmp/body; echo; echo
          done
          echo "=== POST /api/call api_brand ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST -H 'Content-Type: application/json' \
            -d '{"fn":"api_brand","args":[]}' "https://hoop-pmo.vercel.app/api/call" | head -c 600
          echo; echo "=== POST /api/portal customers (bogus code: a clean 4xx JSON proves the module loads) ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST -H 'Content-Type: application/json' \
            -d '{"code":"PROBE-NOT-A-CODE","fn":"customers","args":{}}' "https://hoop-pmo.vercel.app/api/portal" | head -c 600
